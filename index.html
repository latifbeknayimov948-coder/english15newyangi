{const N={"7": {"v": [["journey", "safar", "[B1] A long journey."], ["trip", "sayohat", "[B1] A school trip."], ["tour", "ekskursiya", "[B1] A city tour."], ["tourist", "sayyoh", "[B1] A foreign tourist."], ["passport", "pasport", "[B1] Show your passport."], ["visa", "viza", "[B1] Apply for a visa."], ["luggage", "yuk", "[B1] Heavy luggage."], ["suitcase", "chamadon", "[B1] Pack a suitcase."], ["ticket", "chipta", "[B1] Buy a ticket."], ["flight", "reys", "[B1] A direct flight."], ["airport", "aeroport", "[B1] Arrive at the airport."], ["departure", "jo‘nash", "[B1] Departure is at six."], ["arrival", "kelish", "[B1] Late arrival."], ["delay", "kechikish", "[B1] A flight delay."], ["hotel", "mehmonxona", "[B1] A small hotel."], ["reservation", "bron", "[B1] Make a reservation."], ["hostel", "yotoqxona", "[B1] A cheap hostel."], ["guide", "yo‘lboshchi", "[B1] A local guide."], ["souvenir", "esdalik", "[B1] Buy a souvenir."], ["sightseeing", "ko‘rgazmali sayohat", "[B1] Go sightseeing."], ["beach", "plyaj", "[B1] A quiet beach."], ["mountain", "tog‘", "[B1] A high mountain."], ["island", "orol", "[B1] A tropical island."], ["resort", "kurort", "[B1] A seaside resort."], ["map", "xarita", "[B1] Read the map."], ["currency", "valyuta", "[B1] Local currency."], ["exchange", "almashtirmoq", "[B1] Exchange money."], ["customs", "bojxona", "[B1] Pass customs."], ["border", "chegara", "[B1] Cross the border."], ["insurance", "sug‘urta", "[B1] Travel insurance."], ["itinerary", "sayohat rejasi", "[B2] Plan the itinerary."], ["excursion", "qisqa sayohat", "[B2] A day excursion."], ["accommodation", "turar joy", "[B2] Book accommodation."], ["package holiday", "tayyor sayohat paketi", "[B2] A package holiday."], ["backpacker", "ryukzakli sayyoh", "[B2] A young backpacker."], ["eco-tourism", "ekoturizm", "[B2] Eco-tourism grows."], ["mass tourism", "ommaviy turizm", "[B2] Mass tourism harms nature."], ["destination", "manzil", "[B2] A popular destination."], ["landmark", "diqqatga sazovor joy", "[B2] A famous landmark."], ["heritage site", "meros obyekti", "[B2] A heritage site."], ["off-season", "mavsumdan tashqari", "[B2] Off-season prices."], ["peak season", "eng gavjum mavsum", "[B2] Peak season is busy."], ["check-in", "ro‘yxatdan o‘tish", "[B2] Online check-in."], ["layover", "oraliq to‘xtash", "[B2] A long layover."], ["jet lag", "vaqt farqi charchog‘i", "[B2] I have jet lag."], ["boarding pass", "bort talonи", "[B2] Show your boarding pass."], ["guided tour", "gid bilan ekskursiya", "[B2] A guided tour."], ["tourist trap", "sayyohlarni aldovchi joy", "[B2] Avoid tourist traps."], ["cultural exchange", "madaniy almashinuv", "[B2] A cultural exchange."], ["budget airline", "arzon aviakompaniya", "[B2] A budget airline."], ["wanderlust", "sayohatga ishtiyoq", "[C1] Wanderlust drives him."], ["hospitality", "mehmondo‘stlik", "[C1] Warm hospitality."], ["overtourism", "haddan ortiq turizm", "[C1] Overtourism angers locals."], ["commodification", "tijoratlashtirish", "[C1] Commodification of culture."], ["indigenous", "mahalliy aholi", "[C1] Indigenous communities."], ["authenticity", "haqiqiylik", "[C1] Seek authenticity."], ["pilgrimage", "ziyorat", "[C1] A pilgrimage route."], ["hinterland", "chekka hudud", "[C1] The hinterland is quiet."], ["escapism", "qochish istagi", "[C1] Travel as escapism."], ["globetrotter", "dunyo kezuvchi", "[C1] A seasoned globetrotter."]], "r": {"t": "A. A Growing Industry\nBefore the pandemic, more than 1.4 billion international trips were made in a single year. Cheaper flights, rising incomes and online booking made travel easier than ever. Tourism now provides jobs for guides, drivers and hotel staff in almost every country. Some small economies depend on it for most of their income.\n\nB. Why People Travel\nPeople travel for many reasons, from relaxation and adventure to the wish to see how others live. Some visit family, while others follow a film, a sport or a historical event. Social media has added a new motive: sharing impressive photographs. Surveys suggest that experiences are now valued more than possessions.\n\nC. Economic Benefits\nVisitors spend money in restaurants, shops and transport, which supports local businesses. Taxes paid by tourists help to fund roads, airports and museums. In poorer regions, tourism may be the only realistic alternative to farming. However, much of the profit sometimes goes to foreign companies rather than local families.\n\nD. The Problem of Overtourism\nPopular cities such as Venice and Barcelona receive far more visitors than their streets can comfortably hold. Residents complain about noise, crowded transport and rising rents that force them to move out. Some places have limited group sizes or introduced charges for visitors. Others encourage tourists to explore lesser-known districts.\n\nE. Environmental Impact\nAeroplanes produce large amounts of carbon dioxide, while travelling by train usually produces far less. Coral reefs are damaged by careless divers and boats, and litter is a growing problem on famous mountain paths. Hotels in dry regions may use enormous quantities of water. Nature can recover, but only if visitor numbers are controlled.\n\nF. Responsible Travel\nTravellers can reduce their impact by staying in local-owned guesthouses, which keep money in the community. Visiting popular places outside the peak season also reduces crowding. Buying handmade products directly from craftspeople helps traditional skills survive. Respecting local customs, such as dress codes, shows basic courtesy.\n\nG. The Future of Travel\nVirtual tours can now show museums and distant landscapes, yet few people believe they will replace real journeys. A new trend called slow travel encourages visitors to stay longer and spend more time in one place. Governments are experimenting with daily limits for the most fragile sites. The challenge is to share the world’s beauty without destroying it.", "q": [{"q": "Before the pandemic, more than 1.4 billion international trips were made in a single year.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Most tourists travel only to visit family.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Tourism has no effect on housing prices in cities.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Venice charges an entry fee to all day visitors.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Travelling by train usually produces far less carbon dioxide than flying.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Visiting popular places outside the peak season reduces crowding.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Virtual tours will completely replace real journeys.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Tourism provides jobs for guides, drivers and hotel ______.", "a": "staff"}, {"q": "Residents of some cities complain that rising ______ force them to move out.", "a": "rents"}, {"q": "Coral reefs are damaged by careless divers and ______.", "a": "boats"}, {"q": "Local-owned ______ keep money in the community.", "a": "guesthouses"}, {"q": "Visiting popular places outside the ______ season reduces crowding.", "a": "peak"}, {"q": "Slow travel encourages visitors to spend more ______ in one place.", "a": "time"}]}, "l": {"s": ["A: Good morning, Sunshine Travel. How can I help?", "B: Hello, I’d like to book a holiday for my family in August.", "A: How many people will be travelling?", "B: Two adults and two children, aged eight and eleven.", "A: Where would you like to go?", "B: Somewhere warm, with a beach. We considered Turkey or Greece.", "A: I can offer a week in Antalya, in a four-star hotel with a pool.", "B: What is included in the price?", "A: Return flights, breakfast and airport transfers, but not lunch or dinner.", "B: How much is it altogether?", "A: It’s one thousand eight hundred pounds for the family, and children under twelve get a ten percent discount.", "B: When would we leave?", "A: On the twelfth of August, at six forty in the morning from Manchester.", "B: Is there an excursion we could take?", "A: Yes, a boat trip to a small island, which costs thirty pounds per adult.", "B: Do we need visas?", "A: No, but your passports must be valid for at least six months.", "B: Should I buy travel insurance?", "A: We strongly recommend it. We can add it for forty pounds.", "B: Alright. Please send the details by email."], "q": [{"q": "The agency is called Sunshine ______.", "a": "Travel"}, {"q": "The family wants a holiday in ______.", "a": "August"}, {"q": "There are two adults and two ______.", "a": "children"}, {"q": "The customer wants somewhere warm with a ______.", "a": "beach"}, {"q": "The hotel in Antalya has four stars and a ______.", "a": "pool"}, {"q": "The price includes return flights, breakfast and airport ______.", "a": "transfers"}, {"q": "Lunch and dinner are not ______.", "a": "included"}, {"q": "The flight leaves from ______.", "a": "Manchester"}, {"q": "The boat trip goes to a small ______.", "a": "island"}, {"q": "Passports must be valid for at least six ______.", "a": "months"}, {"q": "How old are the children?", "o": ["Eight and eleven", "Six and nine", "Ten and twelve"], "a": "Eight and eleven"}, {"q": "How long is the holiday?", "o": ["One week", "Two weeks", "Ten days"], "a": "One week"}, {"q": "What is the total price before the discount?", "o": ["One thousand two hundred pounds", "One thousand eight hundred pounds", "Two thousand four hundred pounds"], "a": "One thousand eight hundred pounds"}, {"q": "What discount do children under twelve get?", "o": ["Five percent", "Ten percent", "Twenty percent"], "a": "Ten percent"}, {"q": "When do they leave?", "o": ["The twelfth of August", "The second of August", "The twenty-first of August"], "a": "The twelfth of August"}, {"q": "At what time is the flight?", "o": ["Six forty", "Seven fifteen", "Five thirty"], "a": "Six forty"}, {"q": "How much is the excursion per adult?", "o": ["Twenty pounds", "Thirty pounds", "Fifty pounds"], "a": "Thirty pounds"}, {"q": "Do they need visas?", "o": ["No", "Yes", "Only the children"], "a": "No"}, {"q": "How much is the travel insurance?", "o": ["Twenty pounds", "Forty pounds", "Sixty pounds"], "a": "Forty pounds"}, {"q": "How will the details be sent?", "o": ["By email", "By post", "By phone"], "a": "By email"}]}, "s1": ["Do you like travelling?", "Where did you go on your last holiday?", "Do you prefer travelling alone or with others?", "What do you usually take with you?", "Is tourism good for your country?", "Which place would you like to visit?"], "s2": ["Describe a trip you remember well. Say where you went, who you went with, and why it was memorable.", "Describe a tourist place in your country. Say where it is, what visitors can do there, and why it is popular."]}, "8": {"v": [["culture", "madaniyat", "[B1] A rich culture."], ["tradition", "an’ana", "[B1] An old tradition."], ["custom", "odat", "[B1] A local custom."], ["festival", "festival", "[B1] A spring festival."], ["celebration", "nishonlash", "[B1] A big celebration."], ["ceremony", "marosim", "[B1] A wedding ceremony."], ["wedding", "to‘y", "[B1] A traditional wedding."], ["holiday", "bayram", "[B1] A national holiday."], ["costume", "milliy kiyim", "[B1] A folk costume."], ["folk", "xalq", "[B1] Folk songs."], ["music", "musiqa", "[B1] Traditional music."], ["dance", "raqs", "[B1] A national dance."], ["craft", "hunar", "[B1] A traditional craft."], ["pottery", "kulolchilik", "[B1] Blue pottery."], ["carpet", "gilam", "[B1] A silk carpet."], ["handmade", "qo‘lda yasalgan", "[B1] A handmade bowl."], ["cuisine", "oshxona", "[B1] Local cuisine."], ["dish", "taom", "[B1] A national dish."], ["recipe", "retsept", "[B1] A family recipe."], ["language", "til", "[B1] A native language."], ["religion", "din", "[B1] Freedom of religion."], ["belief", "e’tiqod", "[B1] A common belief."], ["history", "tarix", "[B1] Ancient history."], ["ancestor", "ajdod", "[B1] Our ancestors."], ["heritage", "meros", "[B1] Cultural heritage."], ["museum", "muzey", "[B1] A history museum."], ["national", "milliy", "[B1] A national symbol."], ["local", "mahalliy", "[B1] Local customs."], ["generation", "avlod", "[B1] The next generation."], ["symbol", "ramz", "[B1] A symbol of peace."], ["cultural identity", "madaniy o‘zlik", "[B2] Protect cultural identity."], ["globalisation", "globallashuv", "[B2] Globalisation spreads brands."], ["preservation", "asrab qolish", "[B2] Preservation of crafts."], ["assimilation", "singib ketish", "[B2] Cultural assimilation."], ["multicultural", "ko‘p madaniyatli", "[B2] A multicultural city."], ["folklore", "folklor", "[B2] Folklore tales."], ["ritual", "rasm-rusum", "[B2] An ancient ritual."], ["etiquette", "odob qoidalari", "[B2] Dining etiquette."], ["intangible heritage", "nomoddiy meros", "[B2] Intangible heritage."], ["authentic", "asl", "[B2] Authentic food."], ["ethnic minority", "etnik ozchilik", "[B2] An ethnic minority."], ["cultural exchange", "madaniy almashinuv", "[B2] A cultural exchange."], ["oral tradition", "og‘zaki an’ana", "[B2] An oral tradition."], ["handicraft", "qo‘l mehnati buyumi", "[B2] Handicraft shops."], ["festivity", "bayram tadbiri", "[B2] Festivities begin."], ["rite of passage", "hayotiy marosim", "[B2] A rite of passage."], ["taboo", "taqiq", "[B2] A cultural taboo."], ["stereotype", "qolip fikr", "[B2] Avoid stereotypes."], ["cultural diversity", "madaniy xilma-xillik", "[B2] Value cultural diversity."], ["hospitality", "mehmondo‘stlik", "[B2] Warm hospitality."], ["indigenous", "mahalliy", "[C1] Indigenous peoples."], ["commodification", "tijoratlashtirish", "[C1] Commodification of rituals."], ["homogenisation", "bir xillashuv", "[C1] Cultural homogenisation."], ["vernacular", "mahalliy til; uslub", "[C1] Vernacular architecture."], ["ancestral", "ajdodlardan qolgan", "[C1] Ancestral lands."], ["syncretism", "sinkretizm", "[C1] Religious syncretism."], ["ethnocentrism", "etnotsentrizm", "[C1] Ethnocentrism limits views."], ["revivalism", "jonlanish harakati", "[C1] Folk revivalism."], ["cultural capital", "madaniy kapital", "[C1] Cultural capital matters."], ["dialect", "shevа", "[C1] A rural dialect."]], "r": {"t": "A. What Is Culture?\nCulture includes the language, beliefs, food, music and habits that a group of people share. It is passed from one generation to the next, usually without formal lessons. Children learn it by watching adults and joining in. Because culture feels natural to its members, it is often noticed only when they meet people from elsewhere.\n\nB. The Role of Festivals\nFestivals bring communities together and strengthen shared identity. Navruz, for example, marks the arrival of spring and is celebrated by many millions of people with special food, music and games. Families clean their homes, forgive old quarrels and visit relatives. Such events give young people a clear sense of belonging.\n\nC. Craft Traditions\nPotters, weavers and carpet makers pass their skills from parent to child. Patterns often carry meanings that go back many centuries. Handmade objects are slower and more expensive to produce than factory goods. Yet many buyers prefer them because each piece is unique.\n\nD. Globalisation and Sameness\nGlobal brands, films and social media spread similar tastes across the world. Teenagers in different continents may now listen to the same music and wear the same clothes. Some people welcome this as a sign of connection. Others fear that local differences will slowly disappear.\n\nE. The Loss of Languages\nAround seven thousand languages are spoken today, but experts predict that thousands may disappear by the end of the century. When a language dies, its stories, songs and knowledge of nature can be lost with it. Some communities now teach it to children in special schools. Recording elderly speakers has also become a priority.\n\nF. Preservation Efforts\nMuseums, schools and festivals all help to keep traditions alive. International organisations list not only buildings but also dances, crafts and oral stories as intangible heritage. Critics warn that turning rituals into tourist shows can make them shallow. The best approach is to support communities in deciding how their culture is shared.\n\nG. Living Traditions\nCulture is never completely fixed; it changes as people borrow, adapt and invent. A tradition survives when it remains useful and meaningful to the people who practise it. Respecting other cultures does not mean abandoning one’s own. A world that keeps its variety is richer and more interesting for everyone.", "q": [{"q": "Festivals help communities strengthen their shared identity.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Craft skills are learned only in schools.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Globalisation has made all cultures identical.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Fast food chains operate in more than one hundred countries.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "When a language disappears, stories and knowledge of nature may be lost.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "International organisations list dances and crafts as intangible heritage.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Most young people are uninterested in traditions.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Navruz marks the arrival of ______.", "a": "spring"}, {"q": "Potters, weavers and carpet makers pass their skills from parent to ______.", "a": "child"}, {"q": "Global brands, films and social media spread similar ______ across the world.", "a": "tastes"}, {"q": "Experts predict that thousands of languages may disappear by the end of the ______.", "a": "century"}, {"q": "Museums, schools and ______ all help to keep traditions alive.", "a": "festivals"}, {"q": "A tradition survives when it remains ______ and meaningful.", "a": "useful"}]}, "l": {"s": ["A: Welcome to the Silk Road Craft Centre. My name is Dilnoza, and I’ll be your guide.", "B: Thank you. How old is the centre?", "A: It opened in 1998, but the building is more than two hundred years old.", "B: What can visitors see?", "A: Four workshops: pottery, carpet weaving, wood carving and silk painting.", "B: Can we try making something?", "A: Yes, the pottery workshop offers a forty-minute lesson, and you keep your bowl.", "B: How much does it cost?", "A: Twelve dollars per person, and the tour itself is free.", "B: Where do the craftsmen learn their skills?", "A: Most learn from their fathers or grandfathers, starting at the age of ten.", "B: Do they use modern tools?", "A: Some, but the patterns are drawn by hand, as they were centuries ago.", "B: How long does it take to make one carpet?", "A: A large carpet takes about eight months and two weavers.", "B: Is the silk locally produced?", "A: Yes, from a farm about thirty kilometres from here.", "B: When is the centre open?", "A: Every day except Monday, from nine until six.", "B: Wonderful. Where can I buy a souvenir?"], "q": [{"q": "The guide’s name is ______.", "a": "Dilnoza"}, {"q": "The centre is called the Silk ______ Craft Centre.", "a": "Road"}, {"q": "The workshops are pottery, carpet weaving, wood carving and silk ______.", "a": "painting"}, {"q": "In the pottery lesson, visitors keep their ______.", "a": "bowl"}, {"q": "Most craftsmen learn from their fathers or ______.", "a": "grandfathers"}, {"q": "The patterns are drawn by ______.", "a": "hand"}, {"q": "A large carpet takes about eight months and two ______.", "a": "weavers"}, {"q": "The silk comes from a ______ nearby.", "a": "farm"}, {"q": "The centre is closed on ______.", "a": "Monday"}, {"q": "The centre opens from nine until ______.", "a": "six"}, {"q": "When did the centre open?", "o": ["1998", "1888", "2008"], "a": "1998"}, {"q": ence and decide where to place messages. Brands often use famous celebrities because people tend to trust or admire them. Clever slogans and music make a product easy to remember.\n\nD. The Age of Influencers\nInfluencers build trust by sharing their daily lives with followers, who feel they know them personally. A recommendation from such a person can sell more products than a conventional advert. However, followers do not always realise when a post is paid for. Several countries have introduced rules requiring a clear label.\n\nE. Fake News\nFalse stories spread easily because they are often shocking and easy to share. Some studies suggest that false stories travel faster online than true ones. Headlines designed to attract clicks, known as clickbait, make the problem worse. Some media are controlled by governments, which may use them as propaganda.\n\nF. Children and the Media\nYoung children often struggle to recognise advertisements, especially when they appear inside games or cartoons. Teenagers spend several hours a day on screens, which can affect sleep and concentration. On the positive side, the media offer unlimited opportunities to learn. Parents are advised to watch together and talk about what they see.\n\nG. Media Literacy\nMedia literacy teaches people to ask who created a message, why, and for whom. Checking several sources before sharing a story is a simple but powerful habit. Some countries have introduced such lessons in schools. An informed audience is the best protection against manipulation.", "q": [{"q": "Many people now read news on their phones instead of printed newspapers.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Advertisements only use facts.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Influencers must reveal paid posts in every country.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Some studies suggest that false stories travel faster online than true ones.", "o": ["True", "False", ful chemical."], ["element", "element", "[B1] A rare element."], ["gravity", "tortishish", "[B1] The force of gravity."], ["species", "tur", "[B1] A new species."], ["hypothesis", "farazi", "[B2] Test a hypothesis."], ["breakthrough", "katta yutuq", "[B2] A medical breakthrough."], ["prototype", "prototip", "[B2] Build a prototype."], ["patent", "patent", "[B2] Apply for a patent."], ["peer review", "ekspert tekshiruvi", "[B2] Peer review takes time."], ["clinical trial", "klinik sinov", "[B2] A clinical trial."], ["genome", "genom", "[B2] Map the genome."], ["nanotechnology", "nanotexnologiya", "[B2] Nanotechnology advances."], ["biotechnology", "biotexnologiya", "[B2] Biotechnology firms."], ["renewable energy", "tiklanuvchi energiya", "[B2] Renewable energy grows."], ["artificial intelligence", "sun’iy intellekt", "[B2] Artificial intelligence helps."], ["quantum", "kvant", "[B2] Quantum computing."], ["simulation", "simulyatsiya", "[B2] A computer simulation."], ["sustainable", "barqaror", "[B2] Sustainable fuel."], ["funding", "moliyalashtirish", "[B2] Research funding."], ["ethical", "axloqiy", "[B2] An ethical issue."], ["replicate", "takrorlamoq", "[B2] Replicate the results."], ["variable", "o‘zgaruvchi", "[B2] Change one variable."], ["sample", "namuna", "[B2] A blood sample."], ["control group", "nazorat guruhi", "[B2] Use a control group."], ["serendipity", "baxtli tasodif", "[C1] Serendipity led to the discovery."], ["paradigm", "paradigma", "[C1] A new paradigm."], ["empirical", "tajribaga asoslangan", "[C1] Empirical evidence."], ["falsifiable", "rad etilishi mumkin bo‘lgan", "[C1] A falsifiable claim."], ["reproducibility", "takrorlanuvchanlik", "[C1] Reproducibility matters."], ["interdisciplinary", "fanlararo", "[C1] Interdisciplinary research."], ["bioethics", "bioetika", "[C1] Bioethics committees."], ["moonshot", "o‘ta katta loyiha", "[C1] A scientific moonshot."], ["anomaly", "g‘ayritabiiylik", "[C1] A data anomaly."], ["corroborate", "tasdiqlamoq", "[C1] Corroborate the findings."]], "r": {"t": "A. Why Science Matters\nScience has transformed daily life in just a few centuries. Clean water, electricity, antibiotics and the internet all began as ideas in laboratories. Scientific thinking also teaches us to question claims and demand evidence. In a world full of opinions, this habit is valuable for everyone, not only researchers.\n\nB. The Scientific Method\nScientists begin by asking a question and forming a hypothesis, an idea that can be tested. They then design experiments, collect data and look for patterns. If the results do not support the hypothesis, it is changed or abandoned. Other scientists repeat the experiment to check whether they obtain the same results.\n\nC. Lucky Accidents\nSome of the greatest discoveries happened by chance. In 1928 Alexander Fleming returned from holiday and noticed that a mould had killed the bacteria around it. This observation led to penicillin, the first widely used antibiotic. Fleming was successful because he was prepared to notice something unusual.\n\nD. Medicine and Vaccines\nVaccines train the body’s immune system to recognise dangerous germs before they cause illness. They have saved millions of lives and almost removed diseases that once killed children every year. Modern genetic research may soon allow treatments designed for individual patients. Such progress, however, depends on long and careful clinical trials.\n\nE. Ethical Questions\nNew techniques such as gene editing raise serious ethical questions. Should parents be allowed to choose the features of their children? Who should control powerful artificial intelligence? Rules differ between countries, and many scientists call for open public debate. Technology alone cannot decide what is right.\n\nF. Funding and Cooperation\nResearch is expensive and is funded by governments, universities and companies. Large projects, such as space missions, require thousands of people from many nations. International cooperation has helped to solve problems that no single country could manage. Yet competition for money sometimes pushes scientists to seek quick results rather than deep understanding.\n\nG. Public Trust\nTrust in science grows when researchers explain their work in clear language and admit uncertainty. Misleading headlines can make people believe that scientists constantly change their minds. In reality, the best theories are supported by evidence from many independent sources. Education from an early age helps citizens to judge such claims sensibly.", "q": [{"q": "Penicillin was discovered partly by accident.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Scientists never repeat each other’s experiments.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Vaccines have saved millions of lives.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Rules on gene editing are identical in all countries.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Most scientists prefer working alone.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "International cooperation has helped to solve scientific problems.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Space missions are cheaper than medical research.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Scientists test a hypothesis through careful ______.", "a": "experiments"}, {"q": "In 1928 Alexander Fleming noticed that a ______ had killed the bacteria around it.", "a": "mould"}, {"q": "Vaccines train the body’s immune ______.", "a": "system"}, {"q": "Gene editing raises serious ______ questions.", "a": "ethical"}, {"q": "Research is funded by governments, universities and ______.", "a": "companies"}, {"q": "Trust grows when researchers explain their work in clear ______.", "a": "language"}]}, "l": {"s": ["A: Hello everyone. I’m Leila, and my project is called ‘Solar Bottle Lamps’.", "B: What gave you the idea?", "A: I visited a village {const N={"11": {"v": [["farm", "ferma", "[B1] A family farm."], ["farmer", "fermer", "[B1] A young farmer."], ["crop", "ekin", "[B1] A rich crop."], ["harvest", "hosil yig‘ish", "[B1] The harvest began."], ["field", "dala", "[B1] A wheat field."], ["soil", "tuproq", "[B1] Fertile soil."], ["seed", "urug‘", "[B1] Plant the seeds."], ["fertiliser", "o‘g‘it", "[B1] Chemical fertiliser."], ["tractor", "traktor", "[B1] An old tractor."], ["irrigation", "sug‘orish", "[B1] Modern irrigation."], ["orchard", "bog‘", "[B1] An apple orchard."], ["livestock", "chorva mollari", "[B1] Raise livestock."], ["cattle", "qoramol", "[B1] Cattle graze."], ["dairy", "sut mahsulotlari", "[B1] A dairy farm."], ["grain", "don", "[B1] Store the grain."], ["wheat", "bug‘doy", "[B1] Golden wheat."], ["rice", "guruch", "[B1] Rice fields."], ["vegetable", "sabzavot", "[B1] Fresh vegetables."], ["fruit", "meva", "[B1] Ripe fruit."], ["organic", "organik", "[B1] Organic food."], ["fresh", "yangi", "[B1] Fresh milk."], ["frozen", "muzlatilgan", "[B1] Frozen peas."], ["processed", "qayta ishlangan", "[B1] Processed food."], ["ingredient", "masalliq", "[B1] A key ingredient."], ["diet", "ovqatlanish tartibi", "[B1] A healthy diet."], ["nutrition", "oziqlanish", "[B1] Good nutrition."], ["hunger", "ochlik", "[B1] Fight hunger."], ["supply", "ta’minot", "[B1] Food supply."], ["export", "eksport qilmoq", "[B1] Export fruit."], ["import", "import qilmoq", "[B1] Import wheat."], ["sustainable farming", "barqaror dehqonchilik", "[B2] Sustainable farming helps soil."], ["pesticide", "pestitsid", "[B2] Pesticide residue."], ["genetically modified", "genetik o‘zgartirilgan", "[B2] Genetically modified corn."], ["yield", "hosildorlik", "[B2] A high yield."], ["monoculture", "yagona ekin dehqonchiligi", "[B2] Monoculture exhausts soil."], ["food security", "oziq-ovqat xavfsizligi", "[B2] Food security matters."], ["famine", "ocharchilik", "[B2] A severe famine."], ["drought", "qurg‘oqchilik", "[B2] A long drought."], ["subsidy", "subsidiya", "[B2] A farm subsidy."], ["agribusiness", "agrobiznes", "[B2] A large agribusiness."], ["food miles", "oziq-ovqat tashish masofasi", "[B2] Reduce food miles."], ["preservative", "konservant", "[B2] No preservatives."], ["additive", "qo‘shimcha modda", "[B2] Food additives."], ["malnutrition", "to‘yib ovqatlanmaslik", "[B2] Child malnutrition."], ["crop rotation", "ekin almashlab ekish", "[B2] Crop rotation helps."], ["greenhouse", "issiqxona", "[B2] Grow in a greenhouse."], ["aquaculture", "akvakultura", "[B2] Aquaculture is growing."], ["overfishing", "haddan tashqari baliq ovlash", "[B2] Overfishing is serious."], ["food waste", "oziq-ovqat isrofi", "[B2] Cut food waste."], ["vegetarian", "vegetarian", "[B2] A vegetarian meal."], ["arable", "ekin ekiladigan", "[C1] Arable land."], ["agrarian", "agrar", "[C1] An agrarian economy."], ["sustenance", "oziq", "[C1] Basic sustenance."], ["perishable", "tez buziladigan", "[C1] Perishable goods."], ["staple", "asosiy oziq", "[C1] Rice is a staple."], ["provenance", "kelib chiqishi", "[C1] Check the provenance."], ["agroecology", "agroekologiya", "[C1] Agroecology methods."], ["fallow", "shudgor", "[C1] Leave land fallow."], ["smallholder", "kichik fermer", "[C1] A smallholder farmer."], ["commodity", "tovar", "[C1] A farm commodity."]], "r": {"t": "A. Feeding the World\nThe world population has passed eight billion, and every one of these people needs food. Farmers today produce enough calories to feed everyone, yet hundreds of millions go hungry. The problem is mainly distribution, poverty and conflict, not only production. Understanding this helps to explain why simple solutions rarely work.\n\nB. Modern Farming\nIn the twentieth century, tractors, irrigation and chemical fertilisers transformed agriculture. Yields of wheat and rice more than doubled in many regions. Fewer farmers now feed more people than ever before. This success, however, came at a price.\n\nC. Environmental Costs\nGrowing the same crop year after year can exhaust the soil. Pesticides may pollute rivers and harm bees, which are essential for pollination. Farming uses about seventy percent of the world’s fresh water. Overfishing also threatens the survival of many ocean species.\n\nD. Genetically Modified Crops\nScientists can change the genes of plants to make them resist insects or drought. Supporters say this reduces pesticide use and protects farmers’ incomes. Critics worry about long-term effects and the power of a few large companies. Rules differ widely, and some countries restrict or ban such crops.\n\nE. Food Waste\nRoughly one third of all food produced is never eaten. In poorer countries much is lost during storage and transport, while in rich countries it is thrown away by consumers. Supermarkets reject vegetables that look imperfect. Reducing this waste would save money, water and energy.\n\nF. Local and Organic Food\nOrganic farming avoids artificial chemicals and often protects wildlife. Its yields are usually lower, so it needs more land to produce the same amount. Buying local food reduces transport but is not always better for the environment. The most effective choice is often simply to waste less.\n\nG. The Future of Food\nVertical farms grow vegetables in stacked layers indoors, using little land. Insects, a regular food for millions of people, are rich in protein and cheap to raise. Some companies are developing meat grown from cells. Whatever succeeds, eating fewer animal products would reduce pressure on the planet.", "q": [{"q": "Roughly one third of all food produced worldwide is never eaten.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Organic farming always produces higher yields than conventional farming.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Every country bans genetically modified crops.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Vertical farms use less water than traditional fields.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Chemical fertilisers helped to increase yields of wheat and rice.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Farmers’ markets are more popular in cities than in villages.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Insects are a regular food for millions of people.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Modern farms use tractors, irrigation and chemical ______.", "a": "fertilisers"}, {"q": "Growing the same crop year after year can exhaust the ______.", "a": "soil"}, {"q": "Overfishing threatens the survival of many ocean ______.", "a": "species"}, {"q": "Scientists can change plant genes to make them resist insects or ______.", "a": "drought"}, {"q": "In rich countries much food is thrown away by ______.", "a": "consumers"}, {"q": "Vertical farms grow vegetables in stacked ______ indoors.", "a": "layers"}]}, "l": {"s": ["A: Thanks for showing me round the farm, Mr Walker. How big is it?", "B: About two hundred hectares, and we have been farming here for four generations.", "A: What do you grow?", "B: Mainly wheat and potatoes, and we keep a hundred and twenty cows for milk.", "A: Is the farm organic?", "B: Not completely. Only the vegetable fields are, which is about a quarter of the land.", "A: Why did you decide to change?", "B: Our customers asked for it, and the soil improved after we stopped using chemicals.", "A: Is it more expensive to farm that way?", "B: Yes, costs are about fifteen percent higher, but we sell at a better price.", "A: Where do you sell the produce?", "B: At the farm shop, at two markets in town, and to a local school.", "A: How many people work here?", "B: Eight full-time workers and about twenty students in the summer.", "A: What is the biggest problem at the moment?", "B: Weather. Last year it was too dry in spring and too wet in autumn.", "A: Do you use any new technology?", "B: We use drones to check the crops and sensors to measure the water in the soil.", "A: What are your plans?", "B: To build a small cheese dairy next year."], "q": [{"q": "The farm is two hundred ______ in size.", "a": "hectares"}, {"q": "The family has been farming here for four ______.", "a": "generations"}, {"q": "The farm grows wheat and ______.", "a": "potatoes"}, {"q": "The farmer keeps cows for ______.", "a": "milk"}, {"q": "Only the ______ fields are organic.", "a": "vegetable"}, {"q": "After the chemicals were stopped, the ______ improved.", "a": "soil"}, {"q": "The farm sells to the farm shop, two markets and a local ______.", "a": "school"}, {"q": "The farm uses drones to check the ______.", "a": "crops"}, {"q": "Sensors measure the ______ in the soil.", "a": "water"}, {"q": "The farmer plans to build a small cheese ______.", "a": "dairy"}, {"q": "How many cows does the farm keep?", "o": ["One hundred and twenty", "Twenty", "Two hundred"], "a": "One hundred and twenty"}, {"q": "What share of the land is organic?", "o": ["A quarter", "A half", "A tenth"], "a": "A quarter"}, {"q": "How much higher are the costs of organic farming?", "o": ["Fifteen percent", "Five percent", "Fifty percent"], "a": "Fifteen percent"}, {"q": "How many full-time workers are there?", "o": ["Eight", "Eighteen", "Twenty"], "a": "Eight"}, {"q": "How many students work in summer?", "o": ["About twenty", "About ten", "About fifty"], "a": "About twenty"}, {"q": "What was the weather like in spring last year?", "o": ["Too dry", "Too wet", "Too cold"], "a": "Too dry"}, {"q": "What was the weather like in autumn last year?", "o": ["Too wet", "Too dry", "Too hot"], "a": "Too wet"}, {"q": "Why did the farmer decide to change?", "o": ["Customers asked for it", "The government forced it", "It was cheaper"], "a": "Customers asked for it"}, {"q": "At how many markets in town does the farm sell?", "o": ["Two", "Five", "None"], "a": "Two"}, {"q": "When will the dairy be built?", "o": ["Next year", "This autumn", "In five years"], "a": "Next year ublic transport."], ["commuter", "qatnovchi", "[B2] A daily commuter."], ["rush hour", "gavjum soat", "[B2] Avoid rush hour."], ["ring road", "aylanma yo‘l", "[B2] The ring road."], ["infrastructure", "infratuzilma", "[B2] Transport infrastructure."], ["carpool", "birga qatnash", "[B2] Carpool to work."], ["emissions", "chiqindi gazlar", "[B2] Cut emissions."], ["fuel efficiency", "yoqilg‘i tejamkorligi", "[B2] High fuel efficiency."], ["electric vehicle", "elektromobil", "[B2] An electric vehicle."], ["charging point", "zaryad nuqtasi", "[B2] A charging point."], ["cycle lane", "velosiped yo‘lagi", "[B2] A safe cycle lane."], ["toll", "yo‘l to‘lovi", "[B2] Pay the toll."], ["tailback", "uzun tirbandlik", "[B2] A five-mile tailback."], ["road rage", "yo‘ldagi jahl", "[B2] Road rage is dangerous."], ["pedestrian zone", "piyodalar zonasi", "[B2] A pedestrian zone."], ["high-speed rail", "tezyurar temir yo‘l", "[B2] High-speed rail grows."], ["freight", "yuk tashish", "[B2] Rail freight."], ["logistics", "logistika", "[B2] Logistics companies."], ["subsidised", "subsidiyalangan", "[B2] Subsidised tickets."], ["gridlock", "to‘liq tirbandlik", "[C1] City gridlock."], ["modal shift", "transport turini almashtirish", "[C1] A modal shift to rail."], ["last-mile", "oxirgi masofa", "[C1] Last-mile delivery."], ["mobility", "harakatchanlik", "[C1] Urban mobility."], ["autonomous", "o‘zi boshqaradigan", "[C1] Autonomous cars."], ["bottleneck", "tor joy", "[C1] A traffic bottleneck."], ["haulage", "yuk tashish", "[C1] Road haulage."], ["ride-hailing", "taksi chaqirish ilovasi", "[C1] A ride-hailing app."], ["intermodal", "bir necha transport turli", "[C1] Intermodal transport."], ["carbon-neutral", "uglerod neytral", "[C1] A carbon-neutral fleet."]], "r": {"t": "A. Moving People and Goods\nEvery day billions of journeys connect homes, workplaces, schools and shops. Ships, lorries, trains and aeroplanes also carry the food and goods we buy. Without efficient transport, cities and economies could not function. Yet our dependence on movement creates problems of cost, safety and pollution.\n\nB. The Car Culture\nThere are now more than one billion cars in the world. A private car offers freedom, comfort and privacy, which explains its popularity. In cities, however, it is often slow and expensive, because of parking and fuel. Cars also occupy far more road space per passenger than buses or trams.\n\nC. Congestion\nIn large cities, drivers may spend dozens of hours a year stuck in traffic. This wastes time, increases fuel use and raises stress. Some cities charge drivers who enter the centre, while others limit the days on which certain cars may travel. Building more roads rarely solves the problem for long, because new roads attract more traffic.\n\nD. Public Transport\nA single metro train can carry the same number of people as hundreds of cars. Cities with frequent, reliable and affordable services see fewer cars on their streets. Passengers value punctuality, cleanliness and safety above low prices. Governments often subsidise tickets because the whole city benefits.\n\nE. Cycling and Walking\nBicycles are cheap, healthy and take little space. Cities such as Copenhagen have built separate cycle lanes, and about half of residents cycle to work or school. Safe crossings and wide pavements encourage walking. Poor planning, on the other hand, makes both options dangerous.\n\nF. New Technologies\nElectric vehicles have no exhaust pipe, which improves air quality in cities. Producing batteries and electricity still creates pollution, so the benefit depends on how the power is generated. Self-driving cars are being tested and may reduce accidents caused by human error. Many experts believe they will arrive gradually rather than overnight.\n\nG. Planning for the Future\nGood planning places homes, jobs and shops close together so that people travel less. Fast trains can replace short flights between nearby cities. Combining walking, cycling and public transport in one network is often called integrated mobility. The aim is a system that is clean, safe and accessible to everyone.", "q": [{"q": "There are more than one billion cars in the world.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Private cars are the cheapest way to travel in cities.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Some cities charge drivers who enter the centre.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Buses are more popular than trams in most cities.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Electric vehicles create no pollution at all.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Self-driving cars are still being tested.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Most commuters would prefer to cycle to work.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Drivers in large cities may spend dozens of hours a year stuck in ______.", "a": "traffic"}, {"q": "A single metro train can carry as many people as hundreds of ______.", "a": "cars"}, {"q": "Governments often ______ tickets because the whole city benefits.", "a": "subsidise"}, {"q": "Cities such as Copenhagen have built separate cycle ______.", "a": "lanes"}, {"q": "Self-driving cars may reduce accidents caused by human ______.", "a": "error"}, {"q": "Combining walking, cycling and public transport is called integrated ______.", "a": "mobility"}]}, "l": {"s": ["A: Good afternoon, CityBike. How can I help?", "B: Hello, I’m visiting Manchester for a week and I would like to rent a bike.", "A: Of course. There are two options: a day pass or a weekly pass.", "B: How much are they?", "A: A day pass is five pounds, and a weekly pass is twenty pounds.", "B: And how long can I use a bike each time?", "A: Each journey can last up to forty-five minutes, then you must return it to a station.", "B: How many stations are there?", "A: More than a hundred and fifty across the c noyatni takrorlash", "[C1] Recidivism rates."], ["perpetrator", "jinoyatchi (aybdor)", "[C1] The perpetrator fled."], ["litigation", "sud nizosi", "[C1] Costly litigation."], ["jurisdiction", "yurisdiksiya", "[C1] Outside our jurisdiction."], ["due process", "qonuniy tartib", "[C1] Due process matters."], ["extradition", "ekstraditsiya", "[C1] Extradition treaty."], ["felony", "og‘ir jinoyat", "[C1] A felony charge."], ["restorative justice", "tiklovchi adolat", "[C1] Restorative justice works."], ["miscarriage of justice", "sud xatosi", "[C1] A miscarriage of justice."], ["clemency", "rahm-shafqat", "[C1] Plead for clemency."]], "r": {"t": "A. Understanding Crime\nA crime is an act that breaks the law and can be punished by the state. Definitions vary between countries and change over time. Behaviour that was once illegal may be accepted later, and the reverse is also true. Statistics only show the crimes that people report.\n\nB. Causes of Crime\nResearchers link crime with poverty, unemployment and poor education in some areas. Drug addiction and family problems also play a role. However, wealthy people commit crimes too, particularly financial fraud. No single explanation fits every offender.\n\nC. Policing\nVisible police patrols can act as a deterrent and reassure citizens. Modern forces also rely on cameras, databases and forensic science. Trust is vital, because victims and witnesses help only if they believe the police are fair. Where relations are poor, many crimes are never reported.\n\nD. Prison\nPrison protects society from dangerous people and punishes wrongdoing. Yet in many countries prisons are overcrowded, which makes rehabilitation harder. Studies suggest that longer sentences do not always reduce re-offending. Some prisoners leave with fewer skills and less hope than when they entered.\n\nE. Alternatives to Prison\nFor minor offences, courts may order community service, where offenders do unpaid work such as cleaning parks. Restorative justice brings victims and offenders together so that the harm can be discussed and repaired. Supporters say this reduces repeat crime and helps victims feel heard. Critics argue that it is too lenient for serious cases.\n\nF. Cybercrime\nCriminals now steal money without leaving their homes. They send fake emails to obtain bank details and spread programs that lock computers until a ransom is paid. Victims often lose savings and confidence. Police in different countries must cooperate because offenders may live far away.\n\nG. Prevention\nThe most effective response is to stop crime before it happens. Good street lighting, youth clubs and strong passwords all reduce opportunities. Cameras help, but they have not eliminated crime in any city. Communities where neighbours know and help each other tend to be safer.", "q": [{"q": "Poverty and unemployment are linked with crime in some areas.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Longer prison sentences always reduce re-offending.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Cybercrime now costs more than traditional theft.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Community service involves unpaid work.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Cameras have completely eliminated crime in cities.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Restorative justice brings victims and offenders together.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Most victims of fraud are elderly people.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Visible police patrols can act as a ______.", "a": "deterrent"}, {"q": "Overcrowded prisons make ______ harder.", "a": "rehabilitation"}, {"q": "Offenders may do unpaid work known as community ______.", "a": "service"}, {"q": "Criminals send fake emails to obtain ______ details.", "a": "bank"}, {"q": "Good street lighting, youth clubs and strong ______ all reduce opportunities."  see a suspicious person, write down a ______.", "a": "description"}, {"q": "The neighbourhood watch meets in the ______.", "a": "library"}, {"q": "How many fewer burglaries were there than the year before?", "o": ["Ten", "Five", "Twenty"], "a": "Ten"}, {"q": "When do most burglaries happen?", "o": ["Between ten and three", "At night", "At weekends"], "a": "Between ten and three"}, {"q": "What share of burglars enter through an unlocked door or window?", "o": ["About half", "A tenth", "Most"], "a": "About half"}, {"q": "What is the non-emergency number?", "o": ["One-oh-one", "Nine-nine-nine", "One-one-two"], "a": "One-oh-one"}, {"q": "What is the emergency number?", "o": ["Nine-nine-nine", "One-oh-one", "One-hundred"], "a": "Nine-nine-nine"}, {"q": "What should people NOT do when they see a suspicious person?", "o": ["Confront them", "Write a description", "Call the police"], "a": "Confront them"}, {"q": "When does the neighbourhood watch meet?", "o": ["The first Tuesday of each month", "The last Friday of each month", "Every Monday"], "a": "The first Tuesday of each month"}, {"q": "At what time does it meet?", "o": ["Seven thirty", "Six o’clock", "Nine o’clock"], "a": "Seven thirty"}, {"q": "When should holiday photos be posted?", "o": ["After returning", "During the holiday", "Never"], "a": "After returning"}, {"q": "Who can collect the post?", "o": ["A trusted neighbour", "The police", "A friend online"], "a": "A trusted neighbour"}]}, "s1": ["Is your area safe?", "Do you feel safe at night?", "What crimes are common in your city?", "Do you think the police do a good job?", "Have you ever lost something important?", "Do you lock your home carefully?"], "s2": ["Describe a time when you helped someone in trouble. Say what happened, how you helped, and how you felt.", "Describe a law you think is important. Say what it is, why it exists, and how it helps people."]}, "14": {"v": [["money", "pul", "[B1] Earn money."], ["cash", "naqd pul", "[B1] Pay in cash."], ["coin" ptcy."], ["cost of living", "yashash xarajati", "[B2] The cost of living rose."], ["consumer", "iste’molchi", "[B2] A smart consumer."], ["poverty line", "qashshoqlik chegarasi", "[B2] Below the poverty line."], ["supply and demand", "taklif va talab", "[B2] Supply and demand set prices."], ["subsidy", "subsidiya", "[B2] A government subsidy."], ["export", "eksport", "[B2] A major export."], ["import", "import", "[B2] Import tax."], ["tariff", "bojxona tarifi", "[B2] A new tariff."], ["austerity", "tejamkorlik siyosati", "[C1] Austerity measures."], ["fiscal", "moliyaviy", "[C1] Fiscal policy."], ["monetary policy", "pul-kredit siyosati", "[C1] Tight monetary policy."], ["devaluation", "devalvatsiya", "[C1] Currency devaluation."], ["affluent", "badavlat", "[C1] An affluent area."], ["frugal", "tejamkor", "[C1] A frugal lifestyle."], ["disposable income", "sarflanadigan daromad", "[C1] Low disposable income."], ["solvency", "to‘lov qobiliyati", "[C1] Company solvency."], ["speculation", "chayqovchilik", "[C1] Market speculation."], ["equity", "kapital ulushi", "[C1] Home equity."]], "r": {"t": "A. What Is an Economy?\nAn economy is the system through which a society produces, shares and uses goods and services. It includes farms, factories, shops, banks and the government. When people spend money, they create income for others. Economists study how these decisions affect jobs, prices and living standards.\n\nB. Money and Banks\nMoney works because people trust it as a means of payment and a way to store value. Banks keep savings safe and use deposits to give loans to families and businesses. They earn profit from the difference between the interest they pay and the interest they charge. If customers lose confidence, however, a bank can fail quickly.\n\nC. Inflation\nInflation means that prices rise over time, so each unit of money buys less. Mild inflation is normal, but rapid inflation can destroy savings and make planning impossible. Central banks try to control it by raising interest rates. Higher rates make borrowing more expensive and slow spending.\n\nD. Growth and Recession\nWhen an economy grows, businesses hire more workers and incomes rise. During a recession, demand falls, companies close and unemployment increases. Governments often respond by lowering taxes or increasing spending. Recoveries can take years, and some people never regain their former income.\n\nE. International Trade\nCountries export goods they produce efficiently and import those they cannot. Free trade can lower prices for consumers and encourage competition. However, workers in industries that cannot compete may lose their jobs. Governments sometimes introduce tariffs to protect them, which can lead to disputes.\n\nF. Inequality\nIn many countries a small percentage of people own a large share of the wealth. Taxes pay for schools, roads and hospitals, and they also reduce the gap between rich and poor. Supporters of lower taxes argue that they encourage investment and effort. The debate about fairness is likely to continue.\n\nG. Personal Finance\nIndividuals can make a real difference by keeping a simple budget and spending less than they earn. Saving a small amount regularly builds a large sum over time because of interest. Experts advise keeping an emergency fund equal to several months of expenses. Understanding debt is just as important as earning money.", "q": [{"q": "Banks use deposits to give loans to families and businesses.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Inflation means that prices fall over time.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Most people in poorer countries have no bank account.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Free trade can lower prices for consumers.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "All countries benefit equally from international trade.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Saving a small amount regularly can build a large sum over time.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Credit cards are safer than cash.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Prices rising over time is called ______.", "a": "inflation"}, {"q": "During a ______, demand falls and unemployment increases.", "a": "recession"}, {"q": "Taxes pay for schools, roads and ______.", "a": "hospitals"}, {"q": "Countries ______ goods they produce efficiently.", "a": "export"}, {"q": "Taxes also reduce the gap between rich and ______.", "a": "poor"}, {"q": "Experts advise keeping an emergency ______ equal to several months of expenses.", "a": "fund"}]}, "l": {"s": ["A: Good morning, welcome to Northbridge Bank. How can I help?", "B: Hi, I’m a first-year student and I’d like to open an account.", "A: Great. We have a student account with no monthly fee.", "B: Does it pay interest?", "A: Yes, one point five percent a year on balances up to five hundred pounds.", "B: Can I get an overdraft?", "A: Yes, up to a thousand pounds, interest-free for the first year.", "B: What do I need to open the account?", "A: Your passport, a letter from your university and proof of address, such as a rent contract.", "B: How long will it take?", "A: About twenty minutes, and your debit card will arrive within five working days.", "B: Is there an app?", "A: Yes, you can check your balance and send money in seconds. It also has a budgeting tool.", "B: What about saving?", "A: A savings account pays three percent, but you cannot withdraw money for ninety days.", "B: Are there any charges abroad?", "A: Two percent for card payments outside the country.", "B: What if I lose my card?", "A: Call our twenty-four-hour helpline and we will block it at once.", "B: Thank you. I’ll fill in the form now."], "q": [{"q": "The bank is called Northbridge ______.", "a": "Bank"}, {"q": "The student account has no monthly ______.", "a": "fee"}, {"q": "Interest is paid on balances up to five h ingual", "ikki tilli", "[B2] A bilingual child."], ["multilingual", "ko‘p tilli", "[B2] A multilingual city."], ["fluency", "ravonlik", "[B2] Build fluency."], ["proficiency", "mahorat", "[B2] Language proficiency."], ["idiom", "idioma", "[B2] An English idiom."], ["slang", "jargon (so‘zlashuv)", "[B2] Teen slang."], ["body language", "tana tili", "[B2] Read body language."], ["non-verbal", "so‘zsiz", "[B2] Non-verbal signals."], ["subtitle", "subtitr", "[B2] Watch with subtitles."], ["literacy", "savodxonlik", "[B2] Basic literacy."], ["lingua franca", "umumiy muloqot tili", "[B2] English is a lingua franca."], ["immersion", "til muhitiga sho‘ng‘ish", "[B2] Learn by immersion."], ["language barrier", "til to‘siq", "[B2] A language barrier."], ["jargon", "kasbiy jargon", "[B2] Medical jargon."], ["formal register", "rasmiy uslub", "[B2] Use a formal register."], ["tone", "ohang", "[B2] A friendly tone."], ["intonation", "intonatsiya", "[B2] Rising intonation."], ["misunderstanding", "tushunmovchilik", "[B2] A small misunderstanding."], ["endangered language", "yo‘qolish xavfidagi til", "[B2] An endangered language."], ["second language", "ikkinchi til", "[B2] Learn a second language."], ["linguistic", "lingvistik", "[C1] Linguistic diversity."], ["vernacular", "mahalliy til", "[C1] The vernacular."], ["colloquial", "so‘zlashuv", "[C1] Colloquial speech."], ["nuance", "nozik farq", "[C1] A subtle nuance."], ["eloquent", "notiq", "[C1] An eloquent speaker."], ["articulate", "ravshan ifoda etadigan", "[C1] An articulate student."], ["polyglot", "ko‘p tilli shaxs", "[C1] A famous polyglot."], ["lexicon", "lug‘at tarkibi", "[C1] A rich lexicon."], ["semantics", "semantika", "[C1] Study semantics."], ["code-switching", "kod almashtirish", "[C1] Code-switching is common."]], "r": {"t": "A. The Human Gift\nLanguage is one of the features that make humans unique. It allows us to share ideas, plan for the future and pass knowledge from one generation to the next. Children acquire their first language naturally, usually without formal teaching. By the age of five, most can build complex sentences.\n\nB. Languages of the World\nAround seven thousand languages are spoken today, but half of the world’s people use only a handful of them. Mandarin has the largest number of native speakers, followed by Spanish and English. Many small languages have fewer than a thousand speakers. Roughly half of the world’s population uses two or more languages every day.\n\nC. English as a Global Language\nEnglish is the most widely studied foreign language and the main language of science, aviation and the internet. It often serves as a bridge between people who have different mother tongues. This gives native speakers an advantage but also creates new varieties of English. Some linguists believe that no single country now owns the language.\n\nD. Learning a Second Language\nLearning another language trains the brain and improves memory and concentration. Children usually acquire pronunciation more easily than adults, but adults learn grammar rules faster. Regular practice matters more than natural talent. Immersion, such as living abroad, is the fastest method but not the only one.\n\nE. Beyond Words\nA large part of communication is non-verbal. Facial expressions, gestures and tone of voice can change the meaning of spoken words. In some cultures a nod means yes, while in others it means no. Misunderstandings often happen when people interpret body language according to their own customs.\n\nF. Technology and Translation\nMachine translation has improved dramatically and can now translate whole web pages in seconds. It is extremely useful for travellers, yet it still struggles with idioms, humour and cultural references. Professional interpreters remain essential for legal and medical situations. Many experts expect humans and machines to cooperate rather than compete.\n\nG. Communication in the Digital Age\nEmails, messages and video calls allow people to stay in touch across the world. Short messages, however, lack tone, and symbols such as emoji can be misunderstood. Many companies therefore train employees to write clearly and politely. In the end, good communication still depends on listening as much as speaking.", "q": [{"q": "Around seven thousand languages are spoken today.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "English has more native speakers than any other language.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Bilingual people always earn more money than other people.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Body language can change the meaning of spoken words.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Machine translation never makes mistakes.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Emoji can be misunderstood.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Most people prefer voice messages to written messages.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Roughly half of the world’s population uses two or more ______ every day.", "a": "languages"}, {"q": "English is the most widely studied ______ language.", "a": "foreign"}, {"q": "Learning another language trains the ______ and improves memory.", "a": "brain"}, {"q": "Facial expressions, gestures and tone of ______ can change meaning.", "a": "voice"}, {"q": "Machine translation still struggles with ______, humour and cultural references.", "a": "idioms"}, {"q": "Symbols such as emoji can be ______.", "a": "misunderstood"}]}, "l": {"s": ["A: Good afternoon, Global Language Centre.", "B: Hello, I’d like some information about your Spanish courses.", "A: Certainly. Is it for you?", "B: Yes, I’m a complete beginner.", "A: Our beginner course starts on the ninth of September and lasts ten weeks.", "B: How many lessons a week?", "A: Three: Monday, Wednesday and Thursday evenings, from six thirty to eight.", "B: How many students ar id", "[B2] An asteroid belt."], ["space debris", "kosmik chiqindi", "[B2] Space debris is growing."], ["zero gravity", "vaznsizlik", "[B2] Zero gravity training."], ["mission control", "parvozni boshqarish markazi", "[B2] Mission control called."], ["re-entry", "atmosferaga qaytish", "[B2] Re-entry is risky."], ["payload", "foydali yuk", "[B2] A heavy payload."], ["space tourism", "kosmik turizm", "[B2] Space tourism begins."], ["constellation", "yulduz turkumi", "[B2] The Orion constellation."], ["nebula", "tumanlik", "[B2] A colourful nebula."], ["radiation", "nurlanish", "[B2] Dangerous radiation."], ["probe", "zond", "[B2] A space probe."], ["celestial", "samoviy", "[C1] A celestial body."], ["extraterrestrial", "yerdan tashqari", "[C1] Extraterrestrial life."], ["singularity", "singulyarlik", "[C1] A singularity forms."], ["cosmology", "kosmologiya", "[C1] Study cosmology."], ["trajectory", "traektoriya", "[C1] A rocket trajectory."], ["propulsion", "harakatlantiruvchi kuch", "[C1] Ion propulsion."], ["orbiter", "orbital apparat", "[C1] A Mars orbiter."], ["supernova", "o‘ta yangi yulduz", "[C1] A supernova explodes."], ["interstellar", "yulduzlararo", "[C1] Interstellar travel."], ["terraform", "boshqa sayyorani moslashtirish", "[C1] Terraform Mars."]], "r": {"t": "A. Looking Up\nFor thousands of years people studied the night sky to measure time, find their way and understand their place in the universe. The Sun is only one of hundreds of billions of stars in our galaxy. Light from the Sun takes about eight minutes to reach Earth. The distances involved are so great that astronomers measure them in light years.\n\nB. The Space Race\nIn 1957 the Soviet Union launched Sputnik, the first artificial satellite. Four years later, Yuri Gagarin became the first human to orbit the Earth. In 1969 two American astronauts walked on the Moon. The competition between the two superpowers produced rapid technological progress.\n\nC. Living in Space\nThe International Space Station orbits about four hundred kilometres above Earth and circles the planet roughly every ninety minutes. Astronauts live in zero gravity, which weakens muscles and bones, so they exercise for two hours every day. Food is packed in sealed bags, and water is recycled, even from sweat. Crews from many countries work together there.\n\nD. Robots on Mars\nMachines are cheaper and safer than humans for exploring dangerous places. Rovers have driven across the surface of Mars, taking photographs and analysing rocks. They have found evidence that liquid water once flowed there. Scientists are now searching for signs of ancient life.\n\nE. Space Debris\nThousands of dead satellites and fragments of rockets circle the Earth at enormous speed. Even a tiny piece can damage a working spacecraft. Experts warn that collisions could create clouds of debris that make some orbits unusable. Several organisations are testing ways to remove the worst objects.\n\nF. Commercial Space\nPrivate companies now launch rockets, and some of them can land and be used again, which lowers costs dramatically. Satellites provide internet, weather forecasts and navigation for millions of users. Wealthy tourists have begun to buy short flights to the edge of space. Critics ask whether such money should be spent on problems on Earth.\n\nG. Why Explore?\nSpace research has produced useful inventions, from medical scanners to water filters. It also inspires young people to study science. Many scientists argue that understanding other planets helps us to protect our own. The questions that drive exploration are as old as humanity: where did we come from, and are we alone?", "q": [{"q": "Sputnik was the first artificial satellite.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Yuri Gagarin was the first person to walk on the Moon.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Astronauts on the space station exercise for two hours every day.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Rovers have found living organisms on Mars.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Private companies launch more rockets than governments.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Space debris can damage a working spacecraft.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Humans will live on Mars by 2050.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Astronomers measure huge distances in light ______.", "a": "years"}, {"q": "Food on the space station is packed in sealed ______.", "a": "bags"}, {"q": "Rovers have found evidence that liquid ______ once flowed on Mars.", "a": "water"}, {"q": "Thousands of dead satellites and rocket ______ circle the Earth.", "a": "fragments"}, {"q": "Satellites provide internet, weather forecasts and ______.", "a": "navigation"}, {"q": "Space research has produced medical ______ and water filters.", "a": "scanners"}]}, "l": {"s": ["A: Hello, Riverside Astronomy Club.", "B: Hi, I saw your poster. I’d like to join.", "A: Wonderful. We meet every second Friday in the science building at seven.", "B: Do I need a telescope?", "A: No, the club owns three, and the largest has a mirror forty centimetres wide.", "B: How much is membership?", "A: Thirty pounds a year, or fifteen for students.", "B: What do you do at meetings?", "A: Usually a short talk first, then we observe if the sky is clear.", "B: What can we see this month?", "A: Jupiter and its four brightest moons, and the Orion Nebula after ten o’clock.", "B: What if it’s cloudy?", "A: We watch a documentary or run a quiz.", "B: Are there any special events?", "A: A star party in August in the hills, where the sky is very dark.", "B: How do we get there?", "A: By minibus from the university car park, and it costs eight pounds.", "B: Is the club suitable for children?", "A: Yes, our junior group is for ages ten to fifteen, on Saturday mornings.", "B: Great. Where can I register?"], "q": B2] A greenhouse gas."], ["power plant", "elektr stansiya", "[B2] A coal power plant."], ["solar panel", "quyosh paneli", "[B2] A roof solar panel."], ["wind turbine", "shamol turbinasi", "[B2] A tall wind turbine."], ["grid", "elektr tarmog‘i", "[B2] The national grid."], ["energy efficiency", "energiya samaradorligi", "[B2] Improve energy efficiency."], ["insulation", "izolyatsiya", "[B2] Wall insulation."], ["carbon footprint", "uglerod izi", "[B2] A small carbon footprint."], ["biofuel", "biologik yoqilg‘i", "[B2] Biofuel from plants."], ["geothermal", "geotermal", "[B2] Geothermal heat."], ["blackout", "elektr uzilishi", "[B2] A city blackout."], ["energy security", "energetik xavfsizlik", "[B2] Energy security matters."], ["depletion", "tugab borish", "[B2] Resource depletion."], ["sustainable", "barqaror", "[B2] Sustainable power."], ["fracking", "slanets gazi qazish", "[B2] Fracking is controversial."], ["hydrogen", "vodorod", "[B2] Hydrogen fuel."], ["storage", "saqlash", "[B2] Battery storage."], ["decarbonisation", "uglerodsizlantirish", "[C1] Decarbonisation goals."], ["intermittent", "uzilib turadigan", "[C1] Intermittent supply."], ["baseload", "doimiy asosiy yuklama", "[C1] Baseload power."], ["finite", "cheklangan", "[C1] Finite resources."], ["extraction", "qazib olish", "[C1] Oil extraction."], ["retrofit", "zamonaviylashtirish", "[C1] Retrofit old homes."], ["off-grid", "tarmoqdan mustaqil", "[C1] An off-grid cabin."], ["kilowatt-hour", "kilovatt-soat", "[C1] A kilowatt-hour costs."], ["fusion", "termoyadro sintezi", "[C1] Fusion energy."], ["transition", "o‘tish", "[C1] Energy transition."]], "r": {"t": "A. Powering the World\nEnergy lights our homes, runs our factories and moves our vehicles. Global demand has risen steadily for two centuries, and it is expected to keep growing as developing countries become richer. Billions of people have gained electricity in recent decades, yet hundreds of millions still have none. Finding enough clean energy for everyone is one of the biggest challenges of the century.\n\nB. Fossil Fuels\nCoal, oil and gas still supply roughly eighty percent of the world’s energy. They are cheap, easy to transport and store, and they have powered industrial progress. However, burning them releases carbon dioxide, which is the main cause of global warming. Extraction can also damage land and water.\n\nC. Renewable Energy\nSun, wind and flowing water are renewable, because they are naturally replaced. The cost of solar panels and wind turbines has fallen sharply, and in many places they now produce the cheapest new electricity. Their main weakness is that they are intermittent: the sun sets and the wind drops. Large batteries and better power grids are needed to solve this problem.\n\nD. Nuclear Power\nNuclear plants produce about ten percent of the world’s electricity without releasing carbon dioxide while operating. They run day and night, which makes them reliable. On the other hand, they are expensive to build, and radioactive waste must be stored safely for thousands of years. Accidents are rare but, when they happen, public fear lasts for decades.\n\nE. Saving Energy\nThe cheapest energy is the energy that is never used. Better insulation can cut a home’s heating bill by a third, and efficient light bulbs use a fraction of the electricity of old ones. Many governments set standards for appliances and vehicles. Individuals can also make a difference by switching off devices and choosing public transport.\n\nF. The Politics of Energy\nCountries with large reserves of oil and gas hold great economic power, while importing countries worry about energy security. Wars and sanctions can cause prices to rise sharply, as recent years have shown. Many governments now invest in domestic renewable sources to become more independent. Energy policy has therefore become part of foreign policy.\n\nG. The Transition\nExperts agree that the world must move away from fossil fuels, but they disagree about how fast. Rapid change requires large investment and may hurt workers in coal and oil regions. Slow change risks more severe climate damage. The most likely path combines renewables, storage, efficiency and, in some countries, nuclear power.", "q": [{"q": "Hundreds of millions of people still have no electricity.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Fossil fuels supply less than half of the world’s energy.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Solar panels are cheaper than wind turbines.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Nuclear plants release carbon dioxide while operating.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Better insulation can cut a home’s heating bill by a third.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Coal mining provides more jobs than solar energy.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Energy policy has become part of foreign policy.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Burning fossil fuels releases carbon ______.", "a": "dioxide"}, {"q": "Renewable sources are intermittent because the sun sets and the wind ______.", "a": "drops"}, {"q": "Nuclear plants run day and night, which makes them ______.", "a": "reliable"}, {"q": "Radioactive waste must be stored safely for thousands of ______.", "a": "years"}, {"q": "Many governments set standards for appliances and ______.", "a": "vehicles"}, {"q": "Importing countries worry about energy ______.", "a": "security"}]}, "l": {"s": ["A: Good morning, Bright Power. How can I help you?", "B: Hello, I’d like to change to a green tariff. I’ve seen your advert.", "A: Certainly. May I have your postcode?", "B: It’s M fourteen, six E F.", "A: Thank you. At the moment you are paying twenty-eight pence per unit. Our green tariff is twenty-six.", "B: Is the electricity really renewable?", "A: Yes, one hundred percent from wind and solar farms in Scotlan
