Fresh herbs."], ["spice", "ziravor", "Add spice."], ["dough", "xamir", "Knead the dough."], ["sauce", "sous", "A tomato sauce."], ["soup", "sho‘rva", "Hot soup."], ["salad", "salat", "A fresh salad."], ["dessert", "shirinlik", "Sweet dessert."], ["hungry", "och", "I am hungry."], ["delicious", "mazali", "It is delicious."], ["tasty", "mazali", "A tasty meal."], ["spicy", "achchiq", "Too spicy."], ["sweet", "shirin", "Very sweet."], ["sour", "nordon", "A sour lemon."], ["bitter", "achchiq (taъm)", "Bitter coffee."], ["fresh", "yangi", "Fresh bread."], ["raw", "xom", "Raw meat."], ["burnt", "kuygan", "Burnt onions."], ["tender", "yumshoq", "Tender meat."], ["crispy", "qarsildoq", "Crispy bread."], ["measure", "o‘lchamoq", "Measure the flour."], ["gram", "gramm", "Two hundred grams."], ["teaspoon", "choy qoshiq", "One teaspoon."], ["tablespoon", "osh qoshiq", "A tablespoon of oil."], ["apron", "fartuk", "Wear an apron."], ["timer", "taymer", "Set the timer."], ["simmer", "past olovda qaynatmoq", "Simmer for an hour."], ["kazan", "qozon", "Plov is cooked in a kazan."], ["lump", "bo‘lak; dumba", "No lumps, please."], ["golden", "tillarang", "Golden brown."], ["pinch", "chimdim", "A pinch of salt."], ["leftovers", "ortib qolgan ovqat", "We ate the leftovers."], ["patience", "sabr", "Cooking needs patience."], ["mistake", "xato", "Everyone makes mistakes."], ["knead", "yoymoq (xamir)", "Knead the dough."], ["serve", "dasturxonga tortmoq", "Serve it hot."], ["portion", "porsiya", "A big portion."], ["homemade", "uyda tayyorlangan", "Homemade bread."], ["cuisine", "taomlar uslubi", "Uzbek cuisine."]], "r": "A. A Hungry Beginner\nWhen Dilnoza was fifteen, she could only make tea and fried eggs. Her parents often came home late, and she was tired of sandwiches. One Sunday she asked her grandmother to teach her to cook plov. The old woman smiled and tied an apron around her waist.\n\nB. Kitchen Rules\nGrandmother started with the safety rules. Always wash your hands before cooking and keep a sharp knife away from the edge of the table. Turn the pot handles inwards so that nobody hits them. Dilnoza wrote every rule down in a small notebook.\n\nC. The First Lesson\nThe first task was to prepare the vegetables. Dilnoza peeled the onions and cut the carrots into long thin strips. It took her twenty minutes, while her grandmother needed only five. Patience, said the old woman, is more important than speed.\n\nD. A Dish with History\nPlov is cooked all over Central Asia and is served at weddings and celebrations. It is usually prepared in a large, heavy pot called a kazan. Each region has its own small secrets about the rice and the spices. Families often pass these secrets from one generation to the next.\n\nE. The Mistake\nWhile Dilnoza was watching the rice, she forgot about the onions. When she turned around, they were black and the kitchen was full of smoke. She almost cried, but her grandmother only laughed. Everybody burns something in the beginning, she said.\n\nF. Sharing the Meal\nThey started again and this time everything went well. When the plov was ready, the whole family sat around the table. Her father said that it tasted better than in any restaurant. Dilnoza felt proud and a little shy.\n\nG. What She Learned\nFrom that day, Dilnoza cooks one new dish every weekend. She has learned to measure the ingredients and to watch the heat. More importantly, she has learned that cooking is a way to show love. One day she wants to write her own recipe book.", "rq": [{"q": "Dilnoza’s grandmother taught her to cook plov.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Dilnoza had cooked many dishes before the lesson.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Plov is usually cooked in a kazan.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Dilnoza burnt the onions.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Dilnoza’s brother likes spicy food.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "The lesson took place on a Sunday.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Dilnoza decided to stop cooking after her mistake.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Always wash your ______ before cooking.", "a": "hands"}, {"q": "Dilnoza cut the carrots into long thin ______.", "a": "strips"}, {"q": "Plov is prepared in a large, heavy ______ called a kazan.", "a": "pot"}, {"q": "Grandmother said that ______ is more important than speed.", "a": "patience"}, {"q": "Dilnoza wrote every rule in a small ______.", "a": "notebook"}, {"q": "One day Dilnoza wants to write her own recipe ______.", "a": "book"}], "ls": ["A: Hi Nodira, your pancakes were delicious yesterday. What is the recipe?", "B: It is very simple. You need two eggs, a glass of milk and a cup of flour.", "A: Do I need sugar?", "B: Just one spoon, and a pinch of salt.", "A: What do I do first?", "B: Mix the eggs and milk, then slowly add the flour.", "A: How long should I stir it?", "B: Until there are no lumps, about three minutes.", "A: And then?", "B: Heat a pan with a little oil and pour a small amount of the mixture.", "A: How long do I fry each side?", "B: Two minutes on each side, until they are golden.", "A: Great! Can I add honey?", "B: Of course. Honey and fruit are perfect."], "lq": [{"q": "You need two ______.", "a": "eggs"}, {"q": "You need a glass of ______.", "a": "milk"}, {"q": "You add one spoon of ______.", "a": "sugar"}, {"q": "Stir until there are no ______.", "a": "lumps"}, {"q": "Heat a pan with a little ______.", "a": "oil"}, {"q": "Fry each side until the pancakes are ______.", "a": "golden"}, {"q": "How much flour do you need?", "o": ["A cup", "Two cups", "A spoon"], "a": "A cup"}, {"q": "How long should you stir the mixture?", "o": ["About three minutes", "Ten minutes", "One minute"], "a": "About three minutes"}, {"q": "How long do you fry each side?", "o": ["Two minutes", "Five minutes", "Ten minutes"], "a": "Two minutes"}, {"q": "What goes well with pancakes?", "o": ["Honey and fruit", "Cheese", "Meat"], "a": "Honey and fruit"}], "sh": "I started cooking when I was fourteen. My grandmother taught me, and she was a very patient teacher. In the beginning I made a lot of mistakes. Once I burnt the onions, and the whole flat smelled terrible. Another time I forgot to add salt to the soup. My family never laughed at me; they always tried everything and said thank you. Slowly I learned to measure the ingredients and watch the heat. Now I can cook plov, lagman and several kinds of soup. Every Sunday I prepare lunch for the whole family. I enjoy it because cooking makes people happy and brings them together. One day I would like to open a small restaurant.", "sq": [{"q": "How old was the speaker when he or she started cooking?", "o": ["Twelve", "Fourteen", "Sixteen"], "a": "Fourteen"}, {"q": "Who taught the speaker?", "o": ["The grandmother", "The mother", "A chef"], "a": "The grandmother"}, {"q": "What did the speaker burn once?", "o": ["The onions", "The rice", "The bread"], "a": "The onions"}, {"q": "What did the speaker forget to add to the soup?", "o": ["Salt", "Water", "Meat"], "a": "Salt"}, {"q": "What did the speaker slowly learn?", "o": ["To measure ingredients and watch the heat", "To drive", "To paint"], "a": "To measure ingredients and watch the heat"}, {"q": "When does the speaker prepare lunch for the family?", "o": ["Every Sunday", "Every day", "Every month"], "a": "Every Sunday"}, {"q": "What would the speaker like to do one day?", "o": ["Open a small restaurant", "Become a doctor", "Travel abroad"], "a": "Open a small restaurant"}], "s1": ["What can you cook?", "Who taught you to cook?", "Do you enjoy cooking? Why?", "What is your favourite dish?", "Do you prefer homemade food or restaurant food?", "Is it important to know how to cook?"], "s2": ["Describe a dish you can cook. Say what it is, what ingredients you need, and how you make it.", "Describe a person who cooks well. Say who they are, what they cook, and why their food is special."]}, "8": {"v": [["mountain", "tog‘", "The mountain is high."], ["hill", "tepalik", "A small hill."], ["peak", "cho‘qqi", "The peak has snow."], ["summit", "eng baland nuqta", "We reached the summit."], ["valley", "vodiy", "A green valley."], ["slope", "yonbag‘ir", "A steep slope."], ["path", "yo‘lak", "A narrow path."], ["trail", "so‘qmoq", "A mountain trail."], ["rock", "qoya", "A big rock."], ["stone", "tosh", "A flat stone."], ["cliff", "jar", "A high cliff."], ["cave", "g‘or", "A dark cave."], ["stream", "soy", "A cold stream."], ["river", "daryo", "The river is wide."], ["lake", "ko‘l", "A blue lake."], ["waterfall", "sharshara", "A loud waterfall."], ["forest", "o‘rmon", "A pine forest."], ["pine", "qarag‘ay", "Pine trees."], ["flower", "gul", "Wild flowers."], ["grass", "o‘t", "Soft grass."], ["meadow", "yaylov", "A green meadow."], ["snow", "qor", "Fresh snow."], ["ice", "muz", "Thin ice."], ["glacier", "muzlik", "A glacier melts."], ["fog", "tuman", "Thick fog."], ["wind", "shamol", "A cold wind."], ["sunrise", "quyosh chiqishi", "We saw the sunrise."], ["sunset", "quyosh botishi", "A red sunset."], ["view", "manzara", "A great view."], ["scenery", "tabiat manzarasi", "Beautiful scenery."], ["nature", "tabiat", "Love nature."], ["wildlife", "yovvoyi tabiat", "Wildlife is rich."], ["eagle", "burgut", "An eagle flies."], ["goat", "echki", "A mountain goat."], ["sheep", "qo‘y", "Sheep eat grass."], ["shepherd", "cho‘pon", "The shepherd waves."], ["tent", "chodir", "Put up the tent."], ["campfire", "gulxan", "Sit by the campfire."], ["sleeping bag", "uyqu xaltasi", "A warm sleeping bag."], ["backpack", "ryukzak", "A heavy backpack."], ["boots", "etik", "Hiking boots."], ["jacket", "kurtka", "A warm jacket."], ["gloves", "qo‘lqop", "Wear gloves."], ["map", "xarita", "Read the map."], ["compass", "kompas", "The compass points north."], ["guide", "yo‘lboshchi", "Our guide is Rustam."], ["hike", "piyoda yurish", "A long hike."], ["climb", "chiqmoq", "Climb the hill."], ["trek", "sayohat", "A three-day trek."], ["rest", "dam olmoq", "Rest for ten minutes."], ["tired", "charchagan", "We feel tired."], ["steep", "tik", "A steep path."], ["rocky", "toshloq", "A rocky road."], ["narrow", "tor", "A narrow bridge."], ["high", "baland", "A high peak."], ["cold", "sovuq", "Cold air."], ["fresh", "toza", "Fresh air."], ["clean", "toza", "Clean water."], ["quiet", "tinch", "A quiet place."], ["peaceful", "osoyishta", "A peaceful valley."], ["dangerous", "xavfli", "A dangerous cliff."], ["safe", "xavfsiz", "Is it safe?"], ["careful", "ehtiyotkor", "Be careful."], ["altitude", "balandlik", "High altitude."], ["camp", "lager", "A mountain camp."], ["picnic", "piknik", "We had a picnic."], ["flask", "termos", "A flask of tea."], ["binoculars", "durbin", "Use binoculars."], ["photo", "surat", "Take a photo."], ["tourist", "sayyoh", "Many tourists come."], ["fitness", "jismoniy tayyorgarlik", "Hiking needs fitness."], ["breathtaking", "hayratlanarli", "A breathtaking view."], ["exhausted", "juda charchagan", "I am exhausted."], ["route", "yo‘nalish", "A long route."], ["sunscreen", "quyoshdan himoya kremi", "Use sunscreen."], ["bottle", "shisha", "A water bottle."], ["distance", "masofa", "A long distance."], ["altitude sickness", "balandlik kasalligi", "It causes altitude sickness."], ["horizon", "ufq", "The horizon is clear."], ["ridge", "tizma", "We walked along the ridge."], ["avalanche", "ko‘chki", "Avalanches are dangerous."], ["echo", "aks-sado", "Hear the echo."], ["spring", "buloq", "A mountain spring."], ["shelter", "boshpana", "We found shelter."]], "r": "A. The Early Start\nThe Karimov family left home at six on Saturday morning. The car was full of backpacks, sandwiches and bottles of water. Father checked the map once more, and mother counted the jackets. The children, still sleepy, watched the empty streets pass by.\n\nB. The Road\nAfter an hour the road began to climb through green valleys. Small villages with orchards appeared between the hills. Sheep crossed the road slowly, and the father had to stop twice. A shepherd smiled and waved at the children.\n\nC. Mountain Air\nAt the foot of the mountains they parked the car and stepped outside. The air was cold, clean and full of the smell of pine trees. A stream ran beside the path, and its water was cold and clear. Snow stays on the highest peaks all year, even in the middle of summer.\n\nD. The Climb\nThe path was steep and rocky, so they walked slowly. Every twenty minutes they stopped to drink water and rest. Sevara, the youngest, counted the wild flowers along the way. Her brother found a small cave and wanted to look inside.\n\nE. The Picnic\nAt noon they reached a flat meadow near a waterfall. Mother spread a blanket on the grass and opened the bags. They ate sandwiches, boiled eggs and tomatoes with fresh bread. Nothing ever tasted better, said the father.\n\nF. The Summit\nThe last part of the climb was the hardest. When they reached the top, everybody was silent for a moment. The view of the valley and the distant lake was unforgettable. Father took many photos, and everybody put on warm jackets because of the wind.\n\nG. The Return\nThey walked down more quickly and arrived at the car at five. The children fell asleep before the car left the parking place. Back home, they were tired, but nobody complained. That night they decided to repeat the trip in autumn.", "rq": [{"q": "The family left home at six in the morning.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "They travelled to the mountains by bus.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The path was steep and rocky.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The family saw a bear.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Snow stays on the highest peaks all year.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Father forgot the tickets.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "They returned to the car after dark.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The road climbed through green ______.", "a": "valleys"}, {"q": "The water in the stream was cold and ______.", "a": "clear"}, {"q": "They ate boiled eggs and ______ with fresh bread.", "a": "tomatoes"}, {"q": "Everybody put on warm ______ at the top.", "a": "jackets"}, {"q": "The view from the summit was ______.", "a": "unforgettable"}, {"q": "Father took many ______.", "a": "photos"}], "ls": ["A: Hello, Chimgan Tours. How can I help?", "B: Hi, I would like to book a guide for a one-day hike.", "A: How many people are in your group?", "B: Five adults and two children.", "A: What date would you like?", "B: This Saturday, if possible.", "A: Yes, we have a guide called Rustam. He starts at eight in the morning.", "B: How long is the walk?", "A: About six hours, including a lunch break.", "B: Is it suitable for children?", "A: Yes, the path is easy for anyone over six.", "B: What should we bring?", "A: Strong shoes, a warm jacket and two litres of water each.", "B: And how much does it cost?", "A: Four hundred thousand soms for the whole group."], "lq": [{"q": "The customer wants to book a guide for a one-day ______.", "a": "hike"}, {"q": "The group has five adults and two ______.", "a": "children"}, {"q": "The guide is called ______.", "a": "Rustam"}, {"q": "The guide starts at eight in the ______.", "a": "morning"}, {"q": "The group should bring strong ______.", "a": "shoes"}, {"q": "Each person should bring two litres of ______.", "a": "water"}, {"q": "Which day does the customer want?", "o": ["Friday", "Saturday", "Sunday"], "a": "Saturday"}, {"q": "How long is the walk?", "o": ["Three hours", "Six hours", "Ten hours"], "a": "Six hours"}, {"q": "How much does it cost for the whole group?", "o": ["300,000", "400,000", "500,000"], "a": "400,000"}, {"q": "The path is easy for anyone older than ...", "o": ["Six", "Ten", "Twelve"], "a": "Six"}], "sh": "Last summer I went to the mountains with my cousins for three days. We carried heavy backpacks with tents, food and warm clothes. On the first evening we made a campfire and cooked soup together. The sky was full of stars, much brighter than in the city. In the morning a shepherd showed us a path to a hidden waterfall. The water was so cold that we could only touch it for a few seconds. We climbed slowly because the path was steep and rocky. At the top we could see the whole valley and a small blue lake. I felt tired but very proud of myself. In the mountains there is no noise, only wind and birds. I would like to go there again next year and stay for a week.", "sq": [{"q": "How long was the trip?", "o": ["Three days", "One week", "One day"], "a": "Three days"}, {"q": "Who went with the speaker?", "o": ["Cousins", "Teachers", "Neighbours"], "a": "Cousins"}, {"q": "What did they cook on the first evening?", "o": ["Soup", "Plov", "Pancakes"], "a": "Soup"}, {"q": "Who showed them the path to a waterfall?", "o": ["A shepherd", "A guide", "A tourist"], "a": "A shepherd"}, {"q": "What was the water like?", "o": ["Very cold", "Warm", "Dirty"], "a": "Very cold"}, {"q": "What could they see at the top?", "o": ["The valley and a small blue lake", "A city", "A desert"], "a": "The valley and a small blue lake"}, {"q": "How long would the speaker like to stay next year?", "o": ["A week", "A day", "A month"], "a": "A week"}], "s1": ["Do you like mountains?", "Have you ever been to the mountains?", "Do you prefer mountains or the sea?", "What do you take with you on a trip?", "Who do you usually travel with?", "Is it important to spend time in nature?"], "s2": ["Describe a trip to a natural place. Say where you went, who you went with, and what you did.", "Describe a beautiful view you remember. Say where it was, what you saw, and how you felt."]}, "9": {"v": [["phone", "telefon", "My phone is new."], ["mobile", " e is part of almost every hour.\n\nB. A Morning with a Phone\nJasur’s day begins with the alarm on his phone. He reads the weather forecast and watches a short news video while eating breakfast. On the bus he listens to music and replies to messages from classmates. By the time he reaches school, he has already used the phone for an hour.\n\nC. Learning Online\nThe phone also helps Jasur to study. He uses a dictionary app to check new words and watches English lessons on video. His teacher sends homework to the class group in the evening. Last month he even took a free online course about photography.\n\nD. Staying in Touch\nJasur’s older sister studies in another country. They have a video call every Sunday and see each other’s faces. Without the phone, such conversations would be impossible. His grandmother learned to send voice messages and now does it daily.\n\nE. The Dark Side\nExperts warn that too much screen time can harm sleep, eyes and concentration. Jasur noticed that he often could not stop scrolling at night. Sometimes he lost two hours without doing anything useful. His marks fell a little, and his mother became worried.\n\nF. Finding a Balance\nJasur decided to change his habits. He now turns off notifications during homework and leaves the phone in another room at night. He also set a limit of two hours a day for games and social media. After a month he felt calmer and slept better.\n\nG. A Tool, Not a Master\nJasur says that the phone is a wonderful tool but a terrible master. He still uses it every day, but now he controls it. He often meets friends face-to-face instead of sending messages. In his opinion, real life should always come first.", "rq": [{"q": "A smartphone can work as a camera and a map.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Jasur’s teacher sends homework to the class group.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Jasur’s sister studies in the same city.", "o": ["True", "False", "Not given"],  Meeting\nFather suggested that the whole family should meet on Sunday to talk about the problem. Everybody agreed that the flat could not stay like this. Bekzod, Zarina’s younger brother, said that chores were boring. Father answered that they were also fair.\n\nC. The Rota\nThey wrote a plan on a large poster and put it on the fridge. Zarina would clean her room and dust the shelves, and Bekzod would take out the rubbish and water the plants. Father would cook at weekends, and mother would do the shopping. Everybody would wash the dishes in turn.\n\nD. Why Chores Matter\nResearchers say that children who help at home learn responsibility and independence. They also feel more confident because they know that the family needs them. Such children often do better at school. Zarina’s teacher agreed and told the class about it.\n\nE. A Difficult Tuesday\nOn the second Tuesday Bekzod forgot about the rubbish, and the kitchen began to smell. Zarina was angry and complained loudly. For a moment it seemed that the plan would fail. Then Bekzod took the bag out without a word and apologised.\n\nF. Learning Together\nAfter that, the children started to remind each other. Zarina taught Bekzod how to fold clothes properly, and he showed her a quick way to clean the sink. Father discovered that he enjoyed cooking soup. Mother had time to read a book for the first time in months.\n\nG. The Result\nAfter a month the flat was clean, and the family was happier. As a reward, they went for a picnic in the park on Sunday. Mother said that the best gift was not the picnic but the help. Zarina stuck a small star on the poster for every week without problems.", "rq": [{"q": "The family decided to make a rota for chores.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Bekzod’s job was to wash the windows.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Researchers say that helping at home teaches responsibility.", "o": ["True", "False", "Not given"], "a": "True"}, { a": "Six"}], "sh": "In our family everyone has a job. I wash the dishes after dinner, and my brother takes out the rubbish. My sister cleans the bathroom on Saturdays, and my father cooks at the weekend. Last year we did not have any rules, and the flat was always messy. My mother came home tired and had to do everything herself. One evening she sat down and said that she needed our help. We were ashamed because we had never noticed how much she did. Since then we have a list on the fridge, and nobody forgets. Of course, sometimes I am lazy and complain, but I know that it is fair. Helping at home has taught me responsibility and respect. When I have my own family, I will share the work equally.", "sq": [{"q": "What does the speaker do?", "o": ["Washes the dishes", "Cooks dinner", "Cleans the bathroom"], "a": "Washes the dishes"}, {"q": "Who takes out the rubbish?", "o": ["The brother", "The sister", "The father"], "a": "The brother"}, {"q": "Who cooks at the weekend?", "o": ["The father", "The mother", "The sister"], "a": "The father"}, {"q": "How was the flat last year?", "o": ["Always messy", "Spotless", "Empty"], "a": "Always messy"}, {"q": "Why did the mother sit down and talk?", "o": ["She needed help", "She was angry", "She was ill"], "a": "She needed help"}, {"q": "Where is the list?", "o": ["On the fridge", "On the door", "In the bedroom"], "a": "On the fridge"}, {"q": "What has helping at home taught the speaker?", "o": ["Responsibility and respect", "Cooking", "Painting"], "a": "Responsibility and respect"}], "s1": ["Do you help at home?", "What chores do you do?", "Who does most of the housework in your family?", "Which chore do you hate most?", "Did you do chores as a child?", "Should children get pocket money for chores?"], "s2": ["Describe a household job you do. Say what it is, how often you do it, and how you feel about it.", "Describe a time when your family worked together. Say what you did and what the result was."]}, "11": {"v": [["holiday", "ta lanmoq", "Enjoy the holiday."], ["explore", "kashf etmoq", "Explore the town."], ["discover", "topmoq", "Discover new places."], ["adventure", "sarguzasht", "A big adventure."], ["trip", "sayohat", "A short trip."], ["journey", "safar", "A long journey."], ["abroad", "chet elda", "Travel abroad."], ["countryside", "qishloq joy", "The countryside is green."], ["village", "qishloq", "A quiet village."], ["grandparents", "bobo-buvi", "Visit grandparents."], ["relatives", "qarindoshlar", "Meet relatives."], ["orchard", "bog‘", "An apple orchard."], ["river", "daryo", "A cold river."], ["fishing", "baliq ovlash", "Go fishing."], ["bicycle", "velosiped", "Rent a bicycle."], ["volleyball", "voleybol", "Play volleyball."], ["picnic", "piknik", "A family picnic."], ["barbecue", "kabob", "A summer barbecue."], ["sunset", "quyosh botishi", "A red sunset."], ["memory", "xotira", "A happy memory."], ["photo", "surat", "Take a photo."], ["tan", "qoraygan", "A deep tan."], ["sunburn", "quyoshdan kuyish", "I got sunburn."], ["mosquito", "chivin", "Mosquitoes bite."], ["crowded", "gavjum", "A crowded beach."], ["expensive", "qimmat", "An expensive hotel."], ["cheap", "arzon", "A cheap ticket."], ["unforgettable", "unutilmas", "An unforgettable trip."], ["shell", "chig‘anoq", "A pretty shell."], ["pier", "pristan", "Walk on the pier."], ["boat", "qayiq", "A small boat."], ["shore", "qirg‘oq", "Walk along the shore."], ["lifeguard", "qutqaruvchi", "The lifeguard whistled."], ["itinerary", "sayohat rejasi", "Plan the itinerary."], ["excursion", "ekskursiya", "A day excursion."], ["check-in", "ro‘yxatdan o‘tish", "Check-in is at two."]], "r": "A. Waiting for July\nSevara counted the days to the summer holiday on a paper calendar. Every evening she crossed out one more square. The family had planned two weeks at a lake in the mountains. She already knew which clothes she would take.\n\nB. The Journey\nThey left early in the morning in a small minibus. The road went along rivers and through wide valleys. Father played music, and the children played word games. After seven hours they finally saw a blue line between the hills.\n\nC. The Lake\nThe hotel was close to the lake, and the water was clear and cold. The children ran into it at once and shouted with joy. Mother put sunscreen on their faces every morning. Despite this, Sevara got sunburnt on the second day.\n\nD. Local Food\nIn the evenings they tried the food of the region. They ate grilled fish, fresh bread and sweet cherries from the market. A cook showed the children how to make small pies. Sevara decided that she would never forget those tastes.\n\nE. Adventures\nThey rode bicycles along the shore and sailed in a small boat. Father taught the children to swim better. One afternoon they climbed a hill to look at the whole lake. Her brother collected shells and unusual stones.\n\nF. A Rainy Day\nOn the eighth day it rained for a few hours. The family stayed in the hotel and played cards. Later the rain stopped, and a wide rainbow appeared over the water. Nobody was disappointed, because the evening was calm and warm.\n\nG. Going Home\nOn the last evening they watched the sunset from the pier. Sevara bought a small painted box as a souvenir for her grandmother. In the bus she put the best pictures in a new album. She knew that she would remember this summer for a long time.", "rq": [{"q": "The family spent two weeks at the lake.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "They travelled to the lake by plane.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Sevara got sunburnt on the second day.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The family visited a museum.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Father taught the children to swim better.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "It rained every day of the holiday.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Father bought a boat.", even to ten", "From eight to eleven", "From six to nine"], "a": "From seven to ten"}], "sh": "Last summer I spent two weeks at my grandparents’ village. It is a quiet place with orchards, a small river and a lot of fresh air. Every morning I woke up to the sound of birds. After breakfast I helped my grandfather to water the trees and collect apricots. In the afternoon my cousins and I swam in the river until our fingers became wrinkled. In the evenings we sat on a wooden bed under the stars and ate watermelon. My grandmother told us stories about her childhood, and nobody wanted to sleep. I did not use my phone for days, and I did not miss it. When it was time to leave, I almost cried. This holiday was not expensive, but it was the best one of my life. I promised that I will come back next summer.", "sq": [{"q": "How long did the speaker stay?", "o": ["Two weeks", "One week", "One month"], "a": "Two weeks"}, {"q": "Where did the speaker stay?", "o": ["At the grandparents’ village", "At a hotel", "At a camp"], "a": "At the grandparents’ village"}, {"q": "What did the speaker help the grandfather do?", "o": ["Water the trees and collect apricots", "Drive a tractor", "Paint the house"], "a": "Water the trees and collect apricots"}, {"q": "Where did the children swim?", "o": ["In the river", "In a pool", "In the sea"], "a": "In the river"}, {"q": "What did they eat in the evenings?", "o": ["Watermelon", "Pizza", "Ice cream"], "a": "Watermelon"}, {"q": "What did the grandmother tell?", "o": ["Stories about her childhood", "Jokes", "The news"], "a": "Stories about her childhood"}, {"q": "How does the speaker describe the holiday?", "o": ["Not expensive but the best of his or her life", "Expensive and boring", "Short and tiring"], "a": "Not expensive but the best of his or her life"}], "s1": ["What do you usually do in summer?", "Do you prefer sea or mountains for a holiday?", "Where did you spend your last holiday?", "Do you like travelling with family or friends?", "What , "Finish homework."], ["notes", "yozuvlar", "Take notes."], ["study", "o‘qimoq; o‘rganmoq", "Study quietly."], ["read", "o‘qimoq", "Read daily."], ["quiet", "tinch", "Keep quiet."], ["silence", "jimjitlik", "Silence, please."], ["whisper", "pichirlamoq", "Whisper softly."], ["rules", "qoidalar", "Follow the rules."], ["desk", "stol", "A wooden desk."], ["lamp", "chiroq", "A reading lamp."], ["reading room", "o‘qish zali", "The reading room is full."], ["cosy", "shinam", "A cosy corner."], ["peaceful", "osoyishta", "A peaceful place."], ["concentrate", "diqqatni jamlamoq", "Concentrate on work."], ["focus", "e’tibor qaratmoq", "Focus on the text."], ["exam", "imtihon", "Prepare for the exam."], ["revise", "takrorlamoq", "Revise the unit."], ["learn", "o‘rganmoq", "Learn new words."], ["knowledge", "bilim", "Knowledge is power."], ["imagine", "tasavvur qilmoq", "Imagine a castle."], ["adventure", "sarguzasht", "An adventure story."], ["history", "tarix", "A history book."], ["science", "fan", "Science books."], ["poetry", "she’riyat", "Poetry is beautiful."], ["poem", "she’r", "A short poem."], ["biography", "tarjimai hol", "A biography of a poet."], ["fairy tale", "ertak", "A fairy tale."], ["detective", "detektiv", "A detective story."], ["thriller", "triller", "A scary thriller."], ["e-book", "elektron kitob", "Read an e-book."], ["audiobook", "audiokitob", "Listen to an audiobook."], ["copy", "nusxa ko‘chirmoq", "Copy the page."], ["print", "chop etmoq", "Print the notes."], ["bookmark", "xatcho‘p", "Use a bookmark."], ["spine", "kitob orqasi", "The spine is torn."], ["dusty", "changli", "A dusty shelf."], ["rare", "noyob", "A rare book."], ["collection", "to‘plam", "A big collection."], ["recommend", "tavsiya qilmoq", "I recommend this book."], ["club", "klub", "The reading club."], ["opening hours", "ish vaqti", "Check the opening hours."], ["access", "kirish huquqi", "Free access."], ["publish", "nashr qilmoq", "Publish a book."], ["library card", "kutubxona kartasi", "I have a library card."], ["bestseller", "ommabop kitob", "A bestseller."], ["literature", "adabiyot", "World literature."]], "r": "A. A Quiet Corner\nThe school library is on the second floor, next to the art room. It has tall windows, long wooden tables and the smell of old paper. More than eight thousand books stand on the shelves. Students whisper there, because silence is the first rule.\n\nB. The Librarian\nMrs Gulnora has worked at the school for twenty years. She knows every book and almost every student by name. When someone cannot decide what to read, she always recommends a book. Many students say that she changed their opinion about reading.\n\nC. How It Works\nBooks are arranged by subject, and each shelf has a clear label. Students can borrow a book for two weeks and renew it once. If they return it late, they pay a small fine. The rules are simple, so everybody can follow them.\n\nD. Computers and the Catalogue\nFour computers stand at the end of the room. Students use them to search the catalogue and find information for projects. The computers are connected to the internet, but games are blocked. A printer is available for a few hundred soms a page.\n\nE. The Reading Club\nEvery Thursday after lessons the reading club meets in the corner by the window. Students discuss a story and sometimes act out scenes. Newcomers are welcome, and tea is served. Last year the club wrote a short novel together.\n\nF. A Place for Exams\nBefore exams the library becomes very busy. Older students bring notes and sit at the long tables for hours. Eating is not allowed, but water bottles are fine. The silence helps them to concentrate better than at home.\n\nG. Why It Matters\nIn the age of phones, some people think that libraries are old-fashioned. However, many students prefer the calm and the help they find there. A library gives free access to knowledge for everybody. Mrs Gulnora says that a school without a library is like a body without a heart.", "rq": [{"q": "Mrs Gulnora has worked at the school for twenty years.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Students can borrow a book for two weeks.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The library computers are not connected to the internet.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The library is open on Sundays.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Students pay a small fine for late returns.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Students may eat in the reading room.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The library has a collection of old maps.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Students whisper in the library, because ______ is the first rule.", "a": "silence"}, {"q": "Books are arranged by ______.", "a": "subject"}, {"q": "Students use the computers to search the ______.", "a": "catalogue"}, {"q": "The reading club meets every ______.", "a": "Thursday"}, {"q": "When someone cannot decide, the librarian recommends a ______.", "a": "book"}, {"q": "Before ______ the library becomes very busy.", "a": "exams"}], "ls": ["A: Good morning. I would like to join the library.", "B: Of course. Do you have your student card?", "A: Yes, here it is.", "B: Thank you. You can borrow up to three books at a time.", "A: For how long?", "B: For two weeks, and you can renew them once.", "A: What happens if I return a book late?", "B: There is a fine of five hundred soms a day.", "A: Where can I find books about history?", "B: On the second floor, in section C.", "A: Do you have any English novels?", "B: Yes, on the first floor near the window.", "A: Great. What time do you close?", "B: At five on weekdays and at one on Saturdays."], "lq": [{"q": "The student must show a student ______.", "a": "card"}, {"q": "You can borrow up to ______ books.", "a": "three"}, {"q": "You can keep them for ______ weeks.", "a": "two"}, {"q": "The fine is five hundred ______ a day.", "a": "soms"}, {"q": "History books are on the ______ floor.", "a": "second"}, {"q": "English novels are near the ______.", "a": "window"}, {"q": "Which section has the history books?", "o": ["A", "B", "C"], "a": "C"}, {"q": "When does the library close on weekdays?", "o": ["At four", "At five", "At six"], "a": "At five"}, {"q": "When does it close on Saturdays?", "o": ["At one", "At two", "At three"], "a": "At one"}, {"q": "How many times can you renew a book?", "o": ["Once", "Twice", "Never"], "a": "Once"}], "sh": "Our school library is my favourite place. It is on the second floor, and it always smells of old paper. The librarian, Mrs Gulnora, knows every student and every book. When I started in the fifth grade, I did not like reading. She gave me a short adventure story and said that I could return it if it was boring. I finished it in two days and asked for another one. Since then I have read more than fifty books. At break I often sit by the window with a book and forget about the noise outside. Sometimes I also use the computers to look for information for my projects. In the library nobody is in a hurry, and everybody is polite. I think that a good library is the heart of a school.", "sq": [{"q": "Where is the library?", "o": ["On the second floor", "On the first floor", "In the garden"], "a": "On the second floor"}, {"q": "Who is the librarian?", "o": ["Mrs Gulnora", "Mrs Karima", "Mr Anvar"], "a": "Mrs Gulnora"}, {"q": "How did the speaker feel about reading at first?", "o": ["He or she did not like it", "He or she loved it", "He or she was afraid of it"], "a": "He or she did not like it"}, {"q": "What did the librarian give the speaker?", "o": ["A short adventure story", "A dictionary", "A poem"], "a": "A short adventure story"}, {"q": "How many books has the speaker read?", "o": ["More than fifty", "About ten", "Two"], "a": "More than fifty"}, {"q": "Where does the speaker sit at break?", "o": ["By the window", "In ogs are loyal."], ["gentle", "muloyim", "A gentle cat."], ["playful", "o‘ynoqi", "A playful puppy."], ["clever", "aqlli", "A clever parrot."], ["naughty", "yaramas", "A naughty kitten."], ["wild", "yovvoyi", "A wild fox."], ["tame", "qo‘lga o‘rgangan", "A tame bird."], ["protect", "himoya qilmoq", "Dogs protect homes."], ["rescue", "qutqarmoq", "Rescue a cat."], ["shelter", "boshpana", "An animal shelter."], ["adopt", "asrab olmoq", "Adopt a stray dog."], ["stray", "daydi", "A stray cat."], ["bark", "vovullamoq", "The dog barks."], ["purr", "po‘rillamoq", "The cat purrs."], ["bite", "tishlamoq", "It may bite."], ["scratch", "tirnamoq", "Cats scratch."], ["chase", "quvmoq", "Dogs chase balls."], ["fetch", "keltirmoq", "Fetch the stick."], ["cuddle", "quchmoq", "Cuddle the kitten."], ["companion", "hamroh", "A good companion."], ["responsibility", "mas’uliyat", "A pet is a responsibility."], ["allergy", "allergiya", "A cat allergy."], ["smell", "hid", "A strange smell."], ["obey", "itoat qilmoq", "The dog obeys."], ["chew", "chaynamoq", "Puppies chew shoes."], ["basket", "savat", "A dog basket."], ["seeds", "urug‘lar", "Birds eat seeds."], ["wheel", "g‘ildirak", "A hamster wheel."], ["sit", "o‘tirmoq", "Teach it to sit."], ["guard", "qo‘riqlamoq", "Dogs guard sheep."], ["lap", "tizza", "The cat sits on my lap."], ["domestic", "uy", "A domestic animal."], ["herd", "suruv", "A herd of cows."], ["hunt", "ov qilmoq", "Owls hunt at night."], ["pack", "to‘da", "A pack of wolves."]], "r": "A. The Birthday Surprise\nOn her tenth birthday, Laylo found a small box in the hall. Something inside was moving and making soft noises. When she opened the lid, a brown puppy looked up at her with big eyes. She cried with happiness, because she had wanted a dog for years.\n\nB. Choosing a Name\nThe family argued about the name for a whole week. Her father liked Rex, her mother preferred Max, and her brother suggested Pizza. Finally, Laylo chose Bobby because it sounded friendly. The puppy answered to the name at once, wagging his tail.\n\nC. The First Training\nBobby slept in a small basket next to Laylo’s bed. Every morning she took him to the yard and taught him to sit. She gave him a small piece of meat when he obeyed. After two weeks he could also give his paw.\n\nD. Dogs and People\nDogs have lived with humans for more than ten thousand years. People used them to guard sheep, to hunt and to warn about danger. Today dogs also help blind people and rescue those who are lost. No other animal has become such a close companion.\n\nE. A Naughty Puppy\nWhen Bobby was four months old, he began to chew everything. One afternoon he destroyed her father’s new shoes and a cushion. Her father was angry at first but soon started to laugh. Laylo bought a rubber toy, and the problem finally disappeared.\n\nF. At the Vet\nOnce a year Bobby goes to the vet for a check-up. The doctor weighs him, looks at his teeth and gives him a vaccination. Bobby is afraid of the table, so Laylo holds him gently. The vet says that a happy dog lives longer.\n\nG. Responsibility\nLaylo’s brother helps to walk Bobby in the evening, and her mother prepares his food. Owning a dog is not only fun; it takes time, money and patience. Laylo walks him twice a day, even when it rains. She says that Bobby has taught her to be responsible.", "rq": [{"q": "The puppy was a birthday present.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Laylo chose the name Bobby at once.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Dogs have lived with humans for more than ten thousand years.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Bobby chewed her father’s new shoes.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The vet charged a very high price.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Laylo’s brother does not help with Bobby.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Laylo wants to become a vet.", "o  was a tiny kitten. She was thin, dirty and very frightened. My mother gave her milk, and I made a bed from an old blanket. Within a week she was playing with a ball of wool and following me around the flat. Now she is a big, beautiful cat with soft grey fur. Every evening she sits on my lap and purrs while I do my homework. Sometimes she is naughty and jumps on the table, but I cannot stay angry for long. Luna has taught me that animals can feel love and trust. I think that nobody should buy a pet without being ready to care for it all its life. Adopting a stray animal is the kindest thing a person can do.", "sq": [{"q": "What is the cat called?", "o": ["Luna", "Lola", "Bobby"], "a": "Luna"}, {"q": "Where did they find her?", "o": ["In the street", "In a shop", "At school"], "a": "In the street"}, {"q": "What did the mother give her?", "o": ["Milk", "Meat", "Fish"], "a": "Milk"}, {"q": "What did the speaker make?", "o": ["A bed from an old blanket", "A cage", "A toy"], "a": "A bed from an old blanket"}, {"q": "What colour is her fur?", "o": ["Grey", "White", "Black"], "a": "Grey"}, {"q": "What does she do every evening?", "o": ["Sits on the speaker’s lap and purrs", "Goes out", "Sleeps in the kitchen"], "a": "Sits on the speaker’s lap and purrs"}, {"q": "What is the kindest thing a person can do?", "o": ["Adopt a stray animal", "Buy an expensive pet", "Feed birds"], "a": "Adopt a stray animal"}], "s1": ["Do you like animals?", "Do you have a pet?", "Which animal would you like to have?", "Is it a good idea to keep pets in a flat?", "Did you have a pet as a child?", "Why do people keep pets?"], "s2": ["Describe a pet or an animal you know. Say what it is, what it looks like, and why you like it.", "Describe an animal you find interesting. Say what it is, where it lives, and why it is special."]}, "14": {"v": [["sport", "sport", "I love sport."], ["game", "o‘yin", "A good game."], ["match", "o‘yin; uchrashuv", "A football match."], ["team", "jamoa", "Our team won."],  "Sports equipment."], ["ball", "to‘p", "A new ball."], ["racket", "raketka", "A tennis racket."], ["net", "to‘r", "Hit the net."], ["helmet", "shlem", "Wear a helmet."], ["uniform", "forma", "The team uniform."], ["whistle", "hushtak", "Blow the whistle."], ["cheer", "qichqirib qo‘llab-quvvatlamoq", "Cheer for us."], ["applaud", "qarsak chalmoq", "The crowd applauded."], ["crowd", "olomon", "A noisy crowd."], ["fan", "muxlis", "A football fan."], ["spectator", "tomoshabin", "Spectators clap."], ["final", "final", "The final match."], ["semi-final", "yarim final", "Win the semi-final."], ["tournament", "turnir", "A city tournament."], ["league", "liga", "The school league."], ["season", "mavsum", "A long season."], ["opponent", "raqib", "Respect opponents."], ["rival", "raqib", "A strong rival."], ["fair play", "halol o‘yin", "Fair play matters."], ["rule", "qoida", "Follow the rules."], ["foul", "qoidabuzarlik", "A bad foul."], ["penalty", "penalti", "A penalty kick."], ["relay", "estafeta", "A relay race."], ["marathon", "marafon", "Run a marathon."], ["sprint", "qisqa masofaga yugurish", "A fast sprint."], ["baton", "estafeta tayoqchasi", "Pass the baton."], ["long jump", "uzunlikka sakrash", "Win the long jump."], ["bandage", "bint", "Wrap a bandage."], ["sweat", "ter", "Sweat on my face."], ["discipline", "intizom", "Sport teaches discipline."], ["teamwork", "jamoa ishi", "Teamwork wins games."], ["compete", "raqobatlashmoq", "Compete fairly."], ["defeat", "mag‘lub etmoq", "We defeated them."], ["certificate", "sertifikat", "A participation certificate."]], "r": "A. The Big Morning\nOn the first Friday of May, the school held its annual sports day. Students arrived early in white T-shirts and sports shoes. Parents sat on benches around the track with cameras and flags. The sun was bright, and everybody was excited.\n\nB. The Opening Ceremony\nAt nine o’clock the students marched around the track behind their class banners. The headmaster blew a whistle and officially opened the competition. A boy from the ninth grade carried the school flag. The sports teacher reminded everybody to respect the rules and the referees.\n\nC. Running Races\nThe first events were the hundred-metre race and the long jump. Dilshod, the fastest boy in class 8B, won the sprint easily. Girls competed in a separate race, and Madina finished first. The crowd cheered loudly for every runner, even the last one.\n\nD. Team Games\nAfter a short break, the football and volleyball matches began. Mixed teams of boys and girls played volleyball on the sand court. In football, class 9A defeated class 7C by three goals to one. Fair play was more important than the score, the teacher said.\n\nE. A Small Accident\nDuring the football match, Jasur fell and twisted his ankle. The school nurse arrived with a first aid box and wrapped a bandage. Jasur could not continue, but he stayed to support his team. Everybody applauded when he returned to the bench.\n\nF. The Final Relay\nThe last event was the relay, and it was the most exciting. Each team had four runners who passed a baton to each other. Class 8B was behind until the last runner, Dilshod, sped past the others. The crowd stood up and shouted as he crossed the line.\n\nG. Prizes and Lessons\nThe winners received gold medals and small cups. The losers also got certificates for taking part. At the end, all teams shook hands to show fair play. The students went home tired but happy, already waiting for next year.", "rq": [{"q": "The school holds its sports day once a year.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The opening ceremony began at ten o’clock.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Class 8B won the relay.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Jasur twisted his ankle.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The parents paid for the tickets.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Boys and girls Mr Karimov", "Mr Alimov"], "a": "Mr Sodiqov"}, {"q": "What must the customer bring?", "o": ["A medical certificate", "A passport", "A photo"], "a": "A medical certificate"}], "sh": "I have played football since I was seven. Every Tuesday and Thursday we train after school with our coach. First we warm up by running around the pitch and stretching our muscles. Then we practise passing and shooting, and finally we play a short match. At first I was a weak player, and I often lost the ball. My coach told me not to give up and showed me simple exercises. Slowly my speed and confidence improved. Last season our team reached the final of the city tournament. We lost two to one, but I scored our only goal. I was disappointed, yet I learned that taking part is as important as winning. Sport has taught me discipline, teamwork and respect for opponents.", "sq": [{"q": "Since what age has the speaker played football?", "o": ["Five", "Seven", "Ten"], "a": "Seven"}, {"q": "On which days do they train?", "o": ["Tuesday and Thursday", "Monday and Friday", "Saturday and Sunday"], "a": "Tuesday and Thursday"}, {"q": "What do they do first at training?", "o": ["Warm up", "Play a match", "Practise shooting"], "a": "Warm up"}, {"q": "What was the speaker’s problem at first?", "o": ["He or she often lost the ball", "He or she was late", "He or she was injured"], "a": "He or she often lost the ball"}, {"q": "Who helped the speaker?", "o": ["The coach", "A friend", "A doctor"], "a": "The coach"}, {"q": "What was the result of the final?", "o": ["They lost two to one", "They won two to one", "They drew"], "a": "They lost two to one"}, {"q": "What has sport taught the speaker?", "o": ["Discipline, teamwork and respect", "Cooking", "Patience only"], "a": "Discipline, teamwork and respect"}], "s1": ["Do you like sports?", "What sports are popular in your country?", "Did you play sports at school?", "Do you prefer watching or playing sports?", "Is it important to do sports? Why?", "Would you l  "maqsad qilmoq", "I aim to succeed."], ["inspire", "ilhomlantirmoq", "Teachers inspire us."], ["motivation", "rag‘bat", "Motivation is key."], ["meaningful", "mazmunli", "A meaningful job."]], "r": "A. A Question at Dinner\nAt a family dinner, grandfather asked Aziza what she wanted to be. She laughed and said that she had changed her mind many times. At seven she wanted to be a singer, and at ten she dreamed of becoming a pilot. Now, at sixteen, her answer was serious.\n\nB. The Dream\nAziza wants to become a doctor, like her aunt. She remembers visiting the hospital and admiring how calm the doctors were. Helping people who are afraid or in pain seems the most meaningful job to her. She keeps a small notebook where she writes facts about the human body.\n\nC. The Path\nTo enter medical university, she must pass difficult exams in biology and chemistry. Aziza studies two hours every evening and attends extra lessons on Saturdays. Her teacher says that discipline is more useful than talent. She has already finished three textbooks this year.\n\nD. English and Abroad\nAziza also wants to study English seriously. She dreams of attending a conference or even studying abroad for one year. For that she needs an IELTS certificate and, ideally, a scholarship. She practises listening every morning and writes short essays on weekends.\n\nE. Obstacles\nThe road is not easy. Medical studies take six years, and they are expensive. Sometimes Aziza feels afraid that she will fail the entrance exam. When she is discouraged, she remembers that every doctor once felt the same.\n\nF. People Who Help\nHer parents support her with advice and patience. Her aunt lets her visit the hospital during holidays to watch the work. Her best friend studies with her and tests her vocabulary. Aziza believes that nobody reaches a goal completely alone.\n\nG. Ten Years from Now\nIn ten years Aziza imagines herself in a white coat in a small clinic. She hopes to work in a village, where doctors are needed most. She also wants to buy a little house with a garden for her parents. Her grandfather smiled and said that he would be proud.", "rq": [{"q": "Aziza is sixteen years old.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "At seven Aziza wanted to be a pilot.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Aziza wants to become a doctor like her aunt.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Medical studies take six years.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Aziza has already passed the entrance exam.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Aziza’s best friend also wants to be a doctor.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Aziza’s parents are teachers.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Aziza keeps a small ______ where she writes facts about the human body.", "a": "notebook"}, {"q": "She studies two hours every ______.", "a": "evening"}, {"q": "For studying abroad she needs an IELTS ______.", "a": "certificate"}, {"q": "She hopes to work in a ______, where doctors are needed most.", "a": "village"}, {"q": "Her teacher says that ______ is more useful than talent.", "a": "discipline"}, {"q": "She wants to buy a little house with a ______ for her parents.", "a": "garden"}], "ls": ["A: Good morning. Please sit down. What can I do for you?", "B: I am in the eleventh grade and I cannot decide what to study.", "A: What subjects do you enjoy most?", "B: Mathematics and computer science.", "A: Then you could think about programming or engineering.", "B: Which one has better job opportunities?", "A: Both are good, but programmers are in high demand. The salary can be very high.", "B: Do I need to go abroad?", "A: Not necessarily. There are good universities here, and many companies work online.", "B: When is the entrance exam?", "A: In July. I suggest that you start preparing in January.", "B: Is it possible to get a scholarsh ", "[B2] Overcrowded schools."], ["affordable", "hamyonbop", "[B2] Affordable housing."], ["settlement", "aholi punkti", "[B2] An informal settlement."], ["sustainable", "barqaror", "[B2] Sustainable cities."], ["emissions", "chiqindi gazlar", "[B2] Cut emissions."], ["pedestrian", "piyoda", "[B2] A pedestrian zone."], ["regeneration", "qayta tiklash", "[B2] Urban regeneration."], ["commute", "qatnamoq", "[B2] I commute daily."], ["density", "zichlik", "[B2] High density."], ["amenities", "qulayliklar", "[B2] Local amenities."], ["inhabitant", "yashovchi", "[B2] Each inhabitant."], ["migrate", "ko‘chib o‘tmoq", "[B2] People migrate."], ["skyline", "shahar silueti", "[B2] The skyline changed."], ["housing", "uy-joy", "[B2] Housing shortage."], ["slum", "kambag‘al mahalla", "[B2] A crowded slum."], ["ring road", "aylanma avtomagistral", "[B2] The ring road."], ["car-free", "avtomobilsiz", "[B2] A car-free centre."], ["gentrification", "yuqori qatlam tomonidan egallanishi", "[C1] Gentrification raises rents."], ["metropolis", "megapolis", "[C1] A huge metropolis."], ["urban sprawl", "shaharning tartibsiz kengayishi", "[C1] Urban sprawl eats farmland."], ["conurbation", "shahar aglomeratsiyasi", "[C1] A large conurbation."], ["dilapidated", "vayron bo‘lgan", "[C1] A dilapidated block."], ["bustling", "shovqin-suronli", "[C1] A bustling market."], ["cosmopolitan", "ko‘p millatli", "[C1] A cosmopolitan city."], ["deprivation", "muhtojlik", "[C1] Urban deprivation."], ["municipal", "shahar hokimiyatiga oid", "[C1] Municipal services."], ["thoroughfare", "asosiy ko‘cha", "[C1] A busy thoroughfare."]], "r": {"t": "A. The Growth of Cities\nMore than half of the world’s population now lives in cities, and the proportion keeps rising. In 1950 only about thirty percent of people were urban. Experts predict that by 2050 almost seven out of ten will live in towns. This rapid migration brings opportunities as well as serious challenges.\n\nB. Why People Move\nMost newcomers arrive in search of work and better schools. Cities concentrate jobs, hospitals and universities within a small area. Wages are usually higher than in rural regions. Many families also hope that their children will enjoy a wider range of choices.\n\nC. The Housing Problem\nDemand for homes has pushed prices upwards in almost every major city. Young workers often spend half of their income on rent. In some places, informal settlements have grown without proper water or electricity. Governments struggle to build enough affordable apartments.\n\nD. Traffic and Pollution\nMillions of cars fill the streets every morning and evening. Exhaust fumes make the air unhealthy, especially for children and elderly people. Some cities have introduced charges for drivers who enter the centre. Others have invested in metro lines and cycle lanes instead.\n\nE. Green Solutions\nPlanners increasingly recognise the value of parks and trees. Green areas cool the air, absorb noise and improve mental health. Roof gardens and vertical forests are becoming popular in dense districts. Studies show that residents of greener neighbourhoods report lower stress levels.\n\nF. The Role of Technology\nSmart traffic lights adapt to the number of vehicles and reduce waiting time. Sensors in pipes detect leaks before they become serious. Mobile applications let citizens report broken lamps or potholes within seconds. Critics, however, warn that constant data collection may threaten privacy.\n\nG. Looking Ahead\nExperts agree that no single measure can solve every urban problem. Successful cities combine affordable housing, reliable public transport and generous green space. They also listen to the opinions of ordinary residents. The cities that do this are likely to remain attractive for decades.", "q": [{"q": "In 1950 about thirty percent of people lived in cities.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Wages in rural regions are usually higher than in cities.", "o": ["True", "False", "N t lower prices.", "A: What about green space?", "B: Every building has a roof garden, and there is a large park along the river with more than five hundred trees.", "A: Have there been any problems?", "B: The main complaint is noise from the weekend market. We are planning to move it to the northern square.", "A: When will that happen?", "B: Next October, after the new parking area is finished.", "A: Finally, what advice would you give to students interested in urban planning?", "B: Study geography and economics, and talk to the people who actually live in the city."], "q": [{"q": "The land was once an old textile ______.", "a": "factory"}, {"q": "The first residents moved in last ______.", "a": "spring"}, {"q": "The soil was ______, so it had to be cleaned.", "a": "polluted"}, {"q": "Residents use bicycles or an electric ______.", "a": "tram"}, {"q": "Every building has a roof ______.", "a": "garden"}, {"q": "There is a large park along the ______.", "a": "river"}, {"q": "The main complaint is noise from the weekend ______.", "a": "market"}, {"q": "The market will move to the northern ______.", "a": "square"}, {"q": "The move will happen after the new ______ area is finished.", "a": "parking"}, {"q": "Students should study geography and ______.", "a": "economics"}, {"q": "When did the project start?", "o": ["2015", "2019", "2022"], "a": "2019"}, {"q": "How many people live in the district now?", "o": ["About 12,000", "About 25,000", "About 5,000"], "a": "About 12,000"}, {"q": "How long did the cleaning take?", "o": ["Almost two years", "Six months", "Five years"], "a": "Almost two years"}, {"q": "What is special about the main streets?", "o": ["There are no cars", "There are no shops", "There are no trees"], "a": "There are no cars"}, {"q": "What share of the apartments is reserved for young families?", "o": ["Ten percent", "Thirty percent", "Fifty percent"], "a": "Thirty percent"}, {"q": "How many trees are in the park?", "o": ["More than five hundred", "About fif e that automation raises productivity and removes dangerous jobs. Critics warn that millions of routine positions may disappear. Retraining programmes are therefore becoming a priority for governments.\n\nC. Learning Without Walls\nOnline platforms allow a student in a village to follow lectures given in a distant university. Recorded lessons can be paused, replayed and translated. However, learners need self-discipline, and many struggle without a teacher’s direct attention. Dropout rates for free courses are often above eighty percent.\n\nD. Artificial Intelligence\nAlgorithms can now recognise faces, translate speech and recommend films with surprising accuracy. Doctors use them to detect diseases in medical images earlier than the human eye. Yet these systems learn from existing data, and biased data produces biased decisions. Researchers are working to make such systems more transparent.\n\nE. Privacy and Security\nEvery search, purchase and location leaves a digital trace. Companies collect this information to target advertising, and criminals sometimes steal it. Cybersecurity experts recommend strong passwords, regular updates and caution with unknown links. Many users, however, ignore these simple rules.\n\nF. Health and Habits\nConstant notifications interrupt concentration and disturb sleep. Some studies link heavy social media use with anxiety among teenagers. On the other hand, fitness trackers encourage people to walk more. The same device can therefore damage or improve wellbeing, depending on how it is used.\n\nG. A Balanced View\nTechnology is neither a miracle nor a disaster; it is a tool shaped by human choices. Societies that combine innovation with education and sensible regulation benefit most. Individuals can also set limits on their own screen time. The key question is not what machines can do but what we want them to do.", "q": [{"q": "There are now more connected devices than people on Earth.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Automation has created more jobs than it has removed.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Dropout rates for free online courses are often above eighty percent.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Artificial intelligence systems always make unbiased decisions.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Doctors never use algorithms to examine medical images.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Fitness trackers are more popular among teenagers than adults.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "The writer believes that technology is a disaster.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Supporters argue that automation removes ______ jobs.", "a": "dangerous"}, {"q": "Recorded lessons can be paused, replayed and ______.", "a": "translated"}, {"q": "Biased data produces ______ decisions.", "a": "biased"}, {"q": "Criminals sometimes ______ personal information.", "a": "steal"}, {"q": "Constant notifications interrupt ______ and disturb sleep.", "a": "concentration"}, {"q": "Societies that combine innovation with education and sensible ______ benefit most.", "a": "regulation"}]}, "l": {"s": ["A: Good morning, IT Help Desk. How can I help you?", "B: Hi, my laptop has been very slow since last Monday, and sometimes the screen freezes.", "A: Which model is it, and how old is it?", "B: It is a Lenovo, about four years old.", "A: Have you installed any new software recently?", "B: Yes, a video editing program, which I downloaded from a website I did not know.", "A: That may be the problem. It could contain a virus. When did you last run a security scan?", "B: I have never done it, to be honest.", "A: Please bring the laptop to the second floor. We open at nine and close at five.", "B: Is the service free for students?", "A: Yes, but replacing parts costs extra. A new battery, for example, is thirty dollars.", "B: My battery only atidan kelib chiqqan", "[C1] Anthropogenic emissions."], ["stewardship", "mas’uliyatli boshqaruv", "[C1] Environmental stewardship."], ["unsustainable", "barqaror bo‘lmagan", "[C1] Unsustainable growth."], ["catastrophic", "halokatli", "[C1] Catastrophic floods."], ["carbon-neutral", "uglerod neytral", "[C1] A carbon-neutral city."]], "r": {"t": "A. A Warming Planet\nGlobal temperatures have risen by about one degree since the late nineteenth century. This may seem small, but it has already melted glaciers and raised sea levels. Scientists agree that burning coal, oil and gas is the main cause. The last ten years were the warmest ever recorded.\n\nB. Disappearing Forests\nEvery year, an area of forest larger than a small country is cut down. Trees are cleared for farms, roads and timber. Forests absorb carbon dioxide and shelter millions of species, so their loss affects both climate and wildlife. Some regions have started planting millions of seedlings to restore damaged land.\n\nC. The Plastic Problem\nMore than eight million tonnes of plastic enter the oceans each year. Birds and fish mistake small pieces for food and often die. Plastic can take hundreds of years to break down. Several countries have banned single-use bags and encouraged shops to offer reusable ones.\n\nD. Renewable Energy\nSolar panels and wind turbines produce electricity without releasing carbon dioxide. Their prices have fallen sharply in the past decade. However, the sun does not always shine and the wind does not always blow, so storage remains a challenge. Many experts expect renewables to supply most electricity within thirty years.\n\nE. Individual Choices\nPeople can reduce their impact by using public transport, wasting less food and buying fewer new products. Repairing a broken item is often better than replacing it. Small actions may seem unimportant, but millions of people acting together can change markets. Companies respond quickly when customers demand greener goods.\n\nF. The Role of Governments\nOnly governments can set rules that apply to everyone. Carbon taxes make polluting more expensive, while subsidies make clean technology cheaper. International agreements are difficult to negotiate because countries have different priorities. Nevertheless, cooperation has worked before, as the repair of the ozone layer shows.\n\nG. A Hopeful Conclusion\nThe challenge is serious, yet many solutions already exist. What is missing is not knowledge but determination. Cities, businesses and ordinary families are beginning to change. The next two decades will decide how comfortable the planet will be for future generations.", "q": [{"q": "Global temperatures have risen by about one degree since the late nineteenth century.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Scientists disagree about the main cause of global warming.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Plastic breaks down within a few years.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Wind turbines are cheaper than solar panels.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "The price of solar panels has risen in the past decade.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "International cooperation helped to repair the ozone layer.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Electric cars will replace petrol cars by 2040.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "The last ten years were the ______ ever recorded.", "a": "warmest"}, {"q": "Forests absorb carbon ______.", "a": "dioxide"}, {"q": "Birds and fish mistake small pieces of plastic for ______.", "a": "food"}, {"q": "For renewable energy, storage remains a ______.", "a": "challenge"}, {"q": "Carbon ______ make polluting more expensive.", "a": "taxes"}, {"q": "What is missing is not knowledge but ______.", "a": "determination"}]}, "l": {"s": ["A: Welcome to the programme, Maria. You organise the Green River cle ch model is best.\n\nC. The Role of Teachers\nResearch consistently shows that the quality of teaching is the most important school-related factor in learning. Good teachers explain clearly, give useful feedback and motivate weaker pupils. However, many experienced teachers leave the profession because of low pay and heavy paperwork. Some governments have introduced bonuses to keep them.\n\nD. Technology in the Classroom\nTablets, interactive whiteboards and online platforms have entered many schools. They make lessons more visual and allow students to progress at their own speed. On the other hand, devices can distract pupils and widen the gap between rich and poor families. Training teachers to use technology well is therefore essential.\n\nE. Higher Education\nUniversities have expanded rapidly, and in some countries more than half of young people now study for a degree. Graduates generally earn more, but rising tuition fees leave many with large debts. Employers complain that some graduates lack practical skills. As a result, vocational courses and apprenticeships are attracting new interest.\n\nF. Learning Beyond the Classroom\nSport, music and volunteering teach teamwork and responsibility, qualities that exams rarely measure. Students who take part in extracurricular activities often show higher motivation. Online courses now allow adults to retrain at any age. The idea that education ends at graduation is becoming outdated.\n\nG. The Future\nEducation will probably become more flexible, combining classroom teaching, online study and work experience. Memorising facts will matter less because information is always available. Skills such as problem solving and communication are likely to become more valuable. Whatever changes occur, motivated teachers will remain at the heart of the system.", "q": [{"q": "Finland has no national exams for most of the school years.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "All countries start school at the age ience", "chidamlilik", "[C1] Mental resilience."], ["nutrient-dense", "to‘yimli", "[C1] Nutrient-dense foods."], ["psychosomatic", "psixosomatik", "[C1] A psychosomatic illness."], ["pandemic", "pandemiya", "[C1] A global pandemic."]], "r": {"t": "A. Living Longer\nIn many countries life expectancy has risen from about fifty years in 1900 to over eighty today. Better sanitation, vaccines and medicines explain most of this progress. However, longer lives do not always mean healthier ones. Chronic conditions such as diabetes and heart disease now cause most deaths.\n\nB. The Diet Problem\nProcessed food is cheap, convenient and heavily advertised. As a result, people in many regions consume far more sugar and salt than doctors recommend. Obesity rates have almost tripled since 1975. A balanced diet rich in vegetables, fruit and whole grains reduces the risk of many illnesses.\n\nC. The Value of Exercise\nAdults are advised to take at least 150 minutes of moderate exercise per week. Yet modern jobs keep millions of people sitting for eight hours a day. Regular walking lowers blood pressure and improves mood. Even short breaks to stretch can reduce back pain.\n\nD. Sleep Matters\nMost adults need between seven and nine hours of sleep. Lack of sleep weakens the immune system and reduces concentration. Bright screens in the evening make it harder to fall asleep. Experts suggest going to bed at the same time every night.\n\nE. Mental Health\nStress, anxiety and depression are among the leading causes of disability worldwide. For many years such problems were hidden because of shame. Today more people talk openly and seek professional help. Exercise, friendship and hobbies are all shown to protect mental well-being.\n\nF. Prevention and Healthcare\nDoctors increasingly stress prevention rather than treatment. Regular check-ups can detect problems such as high cholesterol before symptoms appear. Vaccination programmes have almost eliminated several once-deadly diseases. Critics note that preventive care needs funding, which many poorer countries lack.\n\nG. Personal Responsibility\nGovernments can tax sugary drinks and build cycle lanes, but individuals make the final choice. Small habits repeated daily have a large effect over decades. Experts therefore recommend changing one habit at a time. Health, in short, is built slowly and lost quickly.", "q": [{"q": "Life expectancy in many countries has risen to over eighty years.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Obesity rates have halved since 1975.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Walking in the morning is better than walking in the evening.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Lack of sleep weakens the immune system.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Mental health problems have always been discussed openly.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Vaccination programmes have eliminated every deadly disease.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Smoking is the main cause of chronic disease.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Better sanitation, vaccines and medicines explain most of this ______.", "a": "progress"}, {"q": "A balanced diet is rich in vegetables, fruit and whole ______.", "a": "grains"}, {"q": "Regular walking lowers blood ______.", "a": "pressure"}, {"q": "Bright ______ in the evening make it harder to fall asleep.", "a": "screens"}, {"q": "Regular check-ups can detect high ______ before symptoms appear.", "a": "cholesterol"}, {"q": "Health is built slowly and ______ quickly.", "a": "lost"}]}, "l": {"s": ["A: Good morning, Greenfield Health Centre.", "B: Hello, I saw your advertisement for the twelve-week wellness programme.", "A: Yes, it starts on the third of March.", "B: What does the programme include?", "A: A medical check-up, a personal fitness plan and weekly cooking classes.", "B: How much at", "[B2] Meet the deadline."], ["teamwork", "jamoa ishi", "[B2] Teamwork is vital."], ["job satisfaction", "ishdan mamnunlik", "[B2] High job satisfaction."], ["career ladder", "karyera zinapoyasi", "[B2] Climb the career ladder."], ["apprenticeship", "shogirdlik", "[B2] A two-year apprenticeship."], ["burnout", "kuyib ketish", "[B2] Avoid burnout."], ["glass ceiling", "ko‘rinmas to‘siq", "[C1] A glass ceiling exists."], ["gig economy", "vaqtinchalik ish iqtisodiyoti", "[C1] The gig economy grows."], ["nepotism", "qarindoshbozlik", "[C1] Nepotism harms fairness."], ["versatile", "ko‘p qirrali", "[C1] A versatile worker."], ["proficiency", "mahorat", "[C1] Language proficiency."], ["downsizing", "xodimlarni qisqartirish", "[C1] Company downsizing."], ["lateral move", "bir darajadagi o‘tish", "[C1] A lateral move."], ["remuneration", "haq to‘lash", "[C1] Fair remuneration."], ["work ethic", "mehnat axloqi", "[C1] A strong work ethic."], ["upskilling", "malakani oshirish", "[C1] Upskilling is essential."]], "r": {"t": "A. A Changing Labour Market\nA hundred years ago most people expected to keep one job for life. Today the average worker changes employer every four to five years. New professions appear while others disappear. Flexibility has therefore become one of the most valued qualities.\n\nB. Choosing a Career\nYoung people usually consider salary, interests and job security. Parents and teachers also influence decisions, sometimes more than the students themselves. Career advisers recommend trying internships before committing to a long course. Experience shows that people who enjoy their work tend to perform better.\n\nC. The Recruitment Process\nEmployers typically begin by reading CVs and shortlisting a few candidates. Interviews test not only knowledge but also communication and attitude. Some companies add practical tasks or group exercises. Candidates who research the organisation in advance usually make a stronger impression.\n\nD. Remote and Flexible Work\nSince the pandemic, millions of employees have worked from home several days a week. Saving commuting time improves satisfaction and allows companies to reduce office costs. However, isolation and blurred boundaries between work and private life are common complaints. Many firms now choose a hybrid model.\n\nE. The Gig Economy\nPlatforms connect customers with freelancers who drive, deliver or design on demand. Workers enjoy freedom to choose their hours. On the other hand, they often lack paid holiday, sick pay and a pension. Governments are debating whether such workers should receive employee rights.\n\nF. Equality at Work\nWomen still earn less than men in most countries, and few reach top management. Studies show that diverse teams make better decisions. Some companies have introduced targets and transparent pay scales. Progress is visible but slow.\n\nG. Skills for the Future\nEmployers increasingly look for adaptability, digital skills and teamwork. Many jobs will require continuous learning through short courses. Machines will take over routine tasks, leaving more creative and social roles to humans. Those who keep learning are likely to stay employable.", "q": [{"q": "The average worker today changes employer every four to five years.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Career advisers recommend avoiding internships.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Most companies reject candidates who wear casual clothes.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Gig workers usually receive paid holiday.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Studies show that diverse teams make better decisions.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Women earn more than men in most countries.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Hybrid work is more common in small companies than in large ones.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Flexibility has become one of the most valued ______.", "a": "qualities"}, {"q": "Employers typically begin by reading CVs and ______ a few candidates.", "a": "shortlisting"}, {"q": "Candidates who research the organisation usually make a stronger ______.", "a": "impression"}, {"q": "Many firms now choose a ______ model.", "a": "hybrid"}, {"q": "Gig workers often lack sick pay and a ______.", "a": "pension"}, {"q": "Some companies have introduced targets and transparent pay ______.", "a": "scales"}]}, "l": {"s": ["A: Good morning, Mr Ali. Please take a seat. I’m Karen Brooks, the sales manager.", "B: Good morning. Thank you for inviting me.", "A: You applied for the position of marketing assistant. Could you tell me about your previous experience?", "B: I worked for two years at a travel agency in Leeds, mainly designing newsletters.", "A: What did you enjoy most about it?", "B: Working with clients and seeing a campaign succeed.", "A: What are your strongest skills?", "B: I am good at communication, and I can use design software and analyse data.", "A: Do you speak any foreign languages?", "B: Spanish fluently, and a little French.", "A: The job is full-time, from nine to five, with occasional work on Saturdays.", "B: That is fine with me.", "A: The starting salary is twenty-six thousand pounds a year, with a bonus after six months.", "B: And what about holidays?", "A: Twenty-five days a year, plus public holidays.", "B: Is there training for new employees?", "A: Yes, a two-week programme at the beginning and an online course every year.", "B: When would the job start?", "A: On the first of June, if you accept the offer.", "B: Thank you. I would be happy to start on the first of June."], "q": [{"q": "Karen Brooks is the sales ______.", "a": "manager"}, {"q": "Mr Ali applied for the position of marketing ______.", "a": "assistant"}, {"q": "His previous job was at a travel agency in ______.", "a": "Leeds"}, {"q": "At the agency he mainly designed ______
