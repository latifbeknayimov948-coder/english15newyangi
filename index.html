wo days", "Within two months"], "a": "Within two weeks"}, {"q": "What discount is given for direct debit?", "o": ["Two percent", "Ten percent", "Five percent"], "a": "Two percent"}, {"q": "When is the direct debit taken?", "o": ["The first of each month", "The fifteenth", "The last day"], "a": "The first of each month"}, {"q": "Where are the farms located?", "o": ["Scotland and Wales", "England", "Ireland"], "a": "Scotland and Wales"}, {"q": "How long does the switch take?", "o": ["Seventeen days", "Seven days", "Seventy days"], "a": "Seventeen days"}, {"q": "What does the customer ask for at the end?", "o": ["An email to confirm", "A phone call", "A letter"], "a": "An email to confirm"}]}, "s1": ["Do you try to save energy at home?", "What kind of energy does your country use most?", "Do you think solar power is a good idea?", "Have you ever experienced a power cut?", "What could people do to use less electricity?", "Would you pay more for green energy?"], "s2": ["Describe a time when there was no electricity. Say when it happened, what you did, and how you felt.", "Describe something you do to save energy. Say what it is, how often you do it, and why."]}, "18": {"v": [["building", "bino", "[B1] A tall building."], ["house", "uy", "[B1] A wooden house."], ["tower", "minora", "[B1] A clock tower."], ["castle", "qal’a", "[B1] An old castle."], ["palace", "saroy", "[B1] A royal palace."], ["temple", "ibodatxona", "[B1] An ancient temple."], ["mosque", "masjid", "[B1] A blue mosque."], ["church", "cherkov", "[B1] A stone church."], ["bridge", "ko‘prik", "[B1] A stone bridge."], ["wall", "devor", "[B1] A high wall."], ["roof", "tom", "[B1] A flat roof."], ["window", "deraza", "[B1] A large window."], ["door", "eshik", "[B1] A wooden door."], ["floor", "qavat; pol", "[B1] The top floor."], ["stairs", "zina", "[B1] Climb the stairs."], ["column", "ustun", "[B1] A marble column."], ["dome", "gumbaz", "[B1] A blue dome."], ["arch", "arka", "[B1] A stone arch."], ["brick", "g‘isht", "[B1] Red brick."], ["stone", "tosh", "[B1] Carved stone."], ["wood", "yog‘och", "[B1] Solid wood."], ["glass", "oyna", "[B1] Stained glass."], ["steel", "po‘lat", "[B1] A steel frame."], ["concrete", "beton", "[B1] Reinforced concrete."], ["design", "loyiha", "[B1] A bold design."], ["plan", "reja", "[B1] A floor plan."], ["style", "uslub", "[B1] A Gothic style."], ["century", "asr", "[B1] A twelfth-century church."], ["ancient", "qadimgi", "[B1] Ancient ruins."], ["modern", "zamonaviy", "[B1] A modern museum."], ["architect", "me’mor", "[B2] A famous architect."], ["blueprint", "chizma", "[B2] Read the blueprint."], ["facade", "fasad", "[B2] A decorated facade."], ["skyscraper", "osmono‘par", "[B2] A glass skyscraper."], ["restoration", "ta’mirlash-tiklash", "[B2] A careful restoration."], ["preservation", "asrab qolish", "[B2] Building preservation."], ["heritage site", "meros obyekti", "[B2] A heritage site."], ["landmark", "diqqatga sazovor bino", "[B2] A city landmark."], ["foundation", "poydevor", "[B2] A deep foundation."], ["load-bearing", "yuk ko‘taruvchi", "[B2] A load-bearing wall."], ["ornate", "bezakli", "[B2] An ornate ceiling."], ["minaret", "minora (masjid)", "[B2] A tall minaret."], ["mosaic", "mozaika", "[B2] A tile mosaic."], ["vernacular", "mahalliy uslub", "[B2] Vernacular houses."], ["urban planning", "shaharsozlik", "[B2] Urban planning rules."], ["renovation", "ta’mirlash", "[B2] A full renovation."], ["demolition", "buzish", "[B2] The demolition began."], ["listed building", "muhofaza etiladigan bino", "[B2] A listed building."], ["earthquake-resistant", "zilzilaga chidamli", "[B2] An earthquake-resistant frame."], ["sustainable design", "barqaror dizayn", "[B2] Sustainable design."], ["edifice", "ulkan bino", "[C1] A grand edifice."], ["ornamentation", "bezak", "[C1] Rich ornamentation."], ["symmetry", "simmetriya", "[C1] Perfect symmetry."], ["aesthetic", "estetik", "[C1] An aesthetic choice."], ["brutalism", "brutalizm", "[C1] Brutalism uses concrete."], ["conservation", "muhofaza", "[C1] Conservation work."], ["adaptive reuse", "qayta foydalanish", "[C1] Adaptive reuse saves buildings."], ["monumental", "ulkan", "[C1] A monumental gate."], ["dilapidated", "vayron", "[C1] A dilapidated house."], ["juxtaposition", "qarama-qarshi qo‘yish", "[C1] A bold juxtaposition."]], "r": {"t": "A. Buildings and People\nArchitecture is more than the art of making buildings; it shapes how people live, work and meet. A school with large windows can make pupils feel calmer, and a well-planned square can bring strangers together. Buildings also tell stories about the societies that built them. Archaeologists often learn more from a ruined temple than from a written record.\n\nB. Ancient Builders\nThe Great Pyramid of Giza, built around 2500 BC, remained the tallest structure in the world for almost four thousand years. Roman engineers used arches and concrete to build bridges, baths and aqueducts that still stand. In medieval Europe, Gothic cathedrals reached for the sky with pointed arches and stained glass. Each culture solved the problems of stone, gravity and climate in its own way.\n\nC. New Materials\nThe nineteenth century brought steel frames and elevators, which allowed buildings to rise far higher than before. The first skyscrapers appeared in Chicago in the 1880s. Glass and reinforced concrete later gave architects freedom to create light, open spaces. Today, new materials such as engineered timber allow tall buildings with a smaller carbon footprint.\n\nD. Islamic Architecture\nDomes, arches, courtyards and geometric tiles are typical of the Islamic world, from Spain to Central Asia. In hot regions thick walls, shaded courtyards and fountains keep interiors cool without machines. Craftsmen covered surfaces with blue and turquoise tiles and patterns that never end. The great squares of Samarkand and Bukhara show how beauty and function can be combined.\n\nE. Preservation and Progress\nGrowing cities face a difficult question: should old buildings be saved or replaced? Preserving them attracts tourists and protects identity, but repairs can cost more than new construction. Some cities permit only careful restoration in historic centres, while allowing modern towers elsewhere. Many architects prefer to give old buildings a new use, such as turning a factory into a museum.\n\nF. Sustainable Design\nBuildings account for roughly a third of the world’s energy use. Designers now use insulation, natural ventilation and solar panels to reduce consumption. Green roofs cool cities and absorb rainwater. In earthquake zones, flexible foundations and strong frames save lives.\n\nG. The Future\nThree-dimensional printing may soon produce houses in a few days at lower cost. Smart sensors can adjust heating and lighting automatically. Yet the most successful buildings will still be those that people love and want to keep. Good architecture, in the end, is judged by the lives it improves.", "q": [{"q": "The Great Pyramid was the tallest structure in the world for almost four thousand years.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Roman engineers avoided using concrete.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "The first skyscrapers appeared in New York.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Engineered timber is cheaper than steel.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Green roofs help to cool cities.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The squares of Samarkand were built in the fifteenth century.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Three-dimensional printing has already replaced traditional building methods.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Gothic cathedrals used pointed arches and stained ______.", "a": "glass"}, {"q": "Steel frames and ______ allowed buildings to rise far higher than before.", "a": "elevators"}, {"q": "In hot regions, shaded courtyards and ______ keep interiors cool.", "a": "fountains"}, {"q": "Many architects prefer to give old buildings a new ______.", "a": "use"}, {"q": "Buildings account for roughly a ______ of the world’s energy use.", "a": "third"}, {"q": "In earthquake zones, flexible ______ and strong frames save lives.", "a": "foundations"}]}, "l": {"s": ["A: Welcome to Hartley Hall. My name is Peter, and I will be your guide today.", "B: When was the building completed?", "A: In 1868, designed by the architect Thomas Wren.", "B: What was it used for?", "A: It was a cotton mill until 1975, and then it stood empty for twenty years.", "B: Why was it saved?", "A: Local residents started a campaign, and the city bought it in 1996.", "B: How long did the restoration take?", "A: Four years, and it cost nearly six million pounds.", "B: What is it used for now?", "A: The ground floor is a market, the first floor has artists’ studios, and the top floor is a museum.", "B: What materials were used originally?", "A: Red brick for the walls, cast iron for the columns and slate for the roof.", "B: Is the original roof still there?", "A: Not entirely. About sixty percent was replaced, but we kept the old timber beams.", "B: Are there any modern additions?", "A: Yes, a glass lift and solar panels on the south side.", "B: How many visitors come each year?", "A: About eighty thousand, and entry is free on Sundays.", "B: Can we take photographs?"], "q": [{"q": "The guide’s name is ______.", "a": "Peter"}, {"q": "The building was designed by the architect Thomas ______.", "a": "Wren"}, {"q": "The building was originally a cotton ______.", "a": "mill"}, {"q": "It stood empty for twenty ______.", "a": "years"}, {"q": "It was saved after a campaign by local ______.", "a": "residents"}, {"q": "The ground floor is now a ______.", "a": "market"}, {"q": "The first floor has artists’ ______.", "a": "studios"}, {"q": "The columns are made of cast ______.", "a": "iron"}, team won."], ["player", "o‘yinchi", "[B1] A skilled player."], ["coach", "murabbiy", "[B1] A strict coach."], ["referee", "hakam", "[B1] The referee whistled."], ["match", "o‘yin", "[B1] A close match."], ["game", "o‘yin", "[B1] A great game."], ["goal", "gol", "[B1] Score a goal."], ["score", "hisob", "[B1] The final score."], ["win", "yutmoq", "[B1] We want to win."], ["lose", "yutqazmoq", "[B1] Do not lose."], ["draw", "durang", "[B1] A one-one draw."], ["champion", "chempion", "[B1] The world champion."], ["medal", "medal", "[B1] A gold medal."], ["trophy", "kubok", "[B1] The trophy shone."], ["race", "poyga", "[B1] A long race."], ["run", "yugurmoq", "[B1] Run fast."], ["jump", "sakramoq", "[B1] Jump high."], ["swim", "suzmoq", "[B1] Swim daily."], ["throw", "otmoq", "[B1] Throw the ball."], ["kick", "tepmoq", "[B1] Kick the ball."], ["stadium", "stadion", "[B1] A huge stadium."], ["pitch", "maydon", "[B1] A football pitch."], ["court", "korte", "[B1] A tennis court."], ["track", "yugurish yo‘lagi", "[B1] A running track."], ["fan", "muxlis", "[B1] A loyal fan."], ["crowd", "olomon", "[B1] A loud crowd."], ["training", "mashg‘ulot", "[B1] Daily training."], ["injury", "jarohat", "[B1] A leg injury."], ["fitness", "jismoniy tayyorgarlik", "[B1] Improve fitness."], ["tournament", "turnir", "[B2] A city tournament."], ["qualify", "saralashdan o‘tmoq", "[B2] Qualify for the final."], ["opponent", "raqib", "[B2] A strong opponent."], ["penalty", "penalti", "[B2] A penalty kick."], ["doping", "doping", "[B2] Doping is banned."], ["sponsorship", "homiylik", "[B2] A sponsorship deal."], ["professional", "professional", "[B2] A professional player."], ["amateur", "havaskor", "[B2] An amateur club."], ["athlete", "sportchi", "[B2] A top athlete."], ["endurance", "chidamlilik", "[B2] Great endurance."], ["tactics", "taktika", "[B2] Clever tactics."], ["relegation", "quyi ligaga tushish", "[B2] Avoid relegation."], ["transfer", "o‘tkazish (o‘yinchi)", "[B2] A record transfer."], ["spectator", "tomoshabin", "[B2] Spectators cheered."], ["broadcasting rights", "translyatsiya huquqi", "[B2] Broadcasting rights cost billions."], ["Olympic Games", "Olimpiya o‘yinlari", "[B2] The Olympic Games."], ["world record", "jahon rekordi", "[B2] Break the world record."], ["fair play", "halol o‘yin", "[B2] Fair play matters."], ["rivalry", "raqobat", "[B2] A fierce rivalry."], ["sports injury", "sport jarohati", "[B2] A sports injury."], ["prowess", "mahorat", "[C1] Athletic prowess."], ["camaraderie", "do‘stlik ruhi", "[C1] Team camaraderie."], ["underdog", "g‘alaba kutilmagan jamoa", "[C1] The underdog won."], ["adrenaline", "adrenalin", "[C1] An adrenaline rush."], ["sportsmanship", "sportchilik axloqi", "[C1] Show sportsmanship."], ["hooliganism", "bezorilik", "[C1] Football hooliganism."], ["commercialisation", "tijoratlashtirish", "[C1] The commercialisation of sport."], ["grassroots", "quyi bo‘g‘in", "[C1] Grassroots football."], ["paralympian", "paralimpiyachi", "[C1] A paralympian."], ["dominance", "ustunlik", "[C1] A team’s dominance."]], "r": {"t": "A. Why We Play\nPeople have competed in sport since ancient times, and no society has ever been without it. Games offer exercise, excitement and a chance to belong to a team. Children learn rules, patience and respect for others through play. For many adults, sport is the best escape from daily stress.\n\nB. The Olympic Story\nThe first recorded ancient Olympic Games took place in Greece in 776 BC, with a single running race. The modern Games began in Athens in 1896, and they now include thousands of athletes from more than two hundred countries. The Paralympic Games, for athletes with disabilities, have grown into a major event of their own. Cities compete fiercely to host the Games, although the cost is often enormous.\n\nC. Money in Sport\nTop footballers can earn more in a week than a teacher earns in a year. Money comes from television rights, sponsors and ticket sales. Supporters argue that such wages reflect the huge revenue players create. Critics say that sport has become too commercial and that ordinary fans are priced out.\n\nD. The Problem of Doping\nSome athletes take banned drugs to run faster or lift heavier weights. Doping is dangerous to health and destroys fair competition. Testing has become more advanced, yet cheats also find new methods. Several countries have been banned from major events because of organised doping programmes.\n\nE. Sport and Health\nRegular exercise lowers the risk of heart disease, improves mood and helps people sleep better. However, professional athletes often suffer injuries that last for life. Concussion in contact sports has become a particular worry. Doctors recommend moderate activity for most people rather than extreme training.\n\nF. National Pride\nVictories bring communities together and can raise national confidence. In a famous example, the 1995 Rugby World Cup helped to unite South Africa after apartheid. Unfortunately, rivalry sometimes turns into hooliganism, and a few matches have been followed by violence. Fair play and respect for opponents are therefore taught from a young age.\n\nG. Sport for All\nMany cities now build free outdoor gyms, cycle lanes and public swimming pools. Community clubs give young people a safe place to spend free time. Adapted sports allow people with disabilities to take part on equal terms. The most important goal of sport is not to produce champions but to include everyone.", "q": [{"q": "The first recorded ancient Olympic Games took place in 776 BC.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The modern Olympic Games began in Paris.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Cities rarely compete to host the Games.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Testing for doping has become more advanced.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Doping is more common in athletics than in football.",  "Centre"}, {"q": "Basic membership includes the gym and the ______.", "a": "pool"}, {"q": "Basic membership is off-______ only.", "a": "peak"}, {"q": "Off-peak hours are weekdays between ten and ______.", "a": "four"}, {"q": "Standard membership includes free ______ such as yoga and spinning.", "a": "classes"}, {"q": "Premium membership adds a personal ______.", "a": "trainer"}, {"q": "Premium membership also includes the ______.", "a": "sauna"}, {"q": "The joining fee is waived if you join this ______.", "a": "month"}, {"q": "Parking is free for ______.", "a": "members"}, {"q": "Tennis courts can be booked online up to a week ______.", "a": "ahead"}, {"q": "How much is basic membership per month?", "o": ["Twenty-five pounds", "Thirty-eight pounds", "Fifty-five pounds"], "a": "Twenty-five pounds"}, {"q": "How much is standard membership per month?", "o": ["Thirty-eight pounds", "Twenty-five pounds", "Fifty-five pounds"], "a": "Thirty-eight pounds"}, {"q": "How much is premium membership per month?", "o": ["Fifty-five pounds", "Thirty-eight pounds", "Sixty-five pounds"], "a": "Fifty-five pounds"}, {"q": "How many personal trainer sessions are included?", "o": ["Two a month", "One a month", "Four a month"], "a": "Two a month"}, {"q": "How much is the joining fee?", "o": ["Twenty pounds", "Ten pounds", "Fifty pounds"], "a": "Twenty pounds"}, {"q": "What are the weekend opening hours?", "o": ["Eight until six", "Six until ten", "Nine until five"], "a": "Eight until six"}, {"q": "About how many parking spaces are there?", "o": ["A hundred", "Ten", "A thousand"], "a": "A hundred"}, {"q": "How many tennis courts are there?", "o": ["Four", "Two", "Six"], "a": "Four"}, {"q": "What are the weekday opening hours?", "o": ["Six in the morning until ten at night", "Eight until six", "Ten until four"], "a": "Six in the morning until ten at night"}, {"q": "What will the caller do tomorrow?", "o": ["Come for a tour", "Join online", "Cancel"], "a": "Come for a tour"}]}, "s1": ["Do you like sports?", "What sports are popular in your country?", "Do you prefer watching or playing sport?", "Did you play sports at school?", "Is competition good for children?", "Would you like to try a new sport?"], "s2": ["Describe a sports event you enjoyed. Say what it was, where it took place, and why you enjoyed it.", "Describe a sportsperson you admire. Say who they are, what they have achieved, and why you admire them."]}, "20": {"v": [["work", "ish", "[B1] Hard work."], ["job", "ish joyi", "[B1] A new job."], ["career", "kasb yo‘li", "[B1] A long career."], ["employee", "xodim", "[B1] A loyal employee."], ["employer", "ish beruvchi", "[B1] A fair employer."], ["office", "ofis", "[B1] A busy office."], ["factory", "zavod", "[B1] A car factory."], ["salary", "oylik", "[B1] A good salary."], ["wage", "ish haqi", "[B1] A fair wage."], ["hours", "ish soatlari", "[B1] Long hours."], ["shift", "smena", "[B1] A night shift."], ["contract", "shartnoma", "[B1] Sign a contract."], ["skill", "ko‘nikma", "[B1] A useful skill."], ["training", "o‘qitish", "[B1] Job training."], ["promotion", "lavozim ko‘tarilishi", "[B1] A promotion."], ["unemployed", "ishsiz", "[B1] Unemployed people."], ["retire", "nafaqaga chiqmoq", "[B1] Retire early."], ["robot", "robot", "[B1] A factory robot."], ["machine", "mashina", "[B1] A smart machine."], ["computer", "kompyuter", "[B1] Work on a computer."], ["software", "dasturiy ta’minot", "[B1] Business software."], ["internet", "internet", "[B1] Fast internet."], ["remote", "masofaviy", "[B1] Remote work."], ["meeting", "yig‘ilish", "[B1] A long meeting."], ["deadline", "muddat", "[B1] Meet the deadline."], ["team", "jamoa", "[B1] A strong team."], ["manager", "menejer", "[B1] A new manager."], ["customer", "mijoz", "[B1] Help the customer."], ["technology", "texnologiya", "[B1] New technology."], ["change", "o‘zgarish", "[B1] A big change."], ["automation", "avtomatlashtirish", "[B2] Automation grows."], ["artificial intelligence", "sun’iy intellekt", "[B2] Artificial intelligence helps."], ["gig economy", "vaqtinchalik ish iqtisodiyoti", "[B2] The gig economy."], ["remote working", "masofaviy ishlash", "[B2] Remote working is popular."], ["upskilling", "malakani oshirish", "[B2] Upskilling is vital."], ["redundancy", "ishdan bo‘shatish", "[B2] Redundancy payments."], ["freelancer", "frilanser", "[B2] A freelancer designer."], ["hybrid", "gibrid", "[B2] A hybrid schedule."], ["work-life balance", "ish va hayot muvozanati", "[B2] Work-life balance matters."], ["digital nomad", "raqamli ko‘chmanchi", "[B2] A digital nomad."], ["productivity", "samaradorlik", "[B2] Higher productivity."], ["job security", "ish xavfsizligi", "[B2] Job security."], ["flexible hours", "moslashuvchan ish vaqti", "[B2] Flexible hours."], ["universal basic income", "universal bazaviy daromad", "[B2] Universal basic income."], ["workforce", "ishchi kuchi", "[B2] An ageing workforce."], ["outsourcing", "tashqi ishlarga berish", "[B2] Outsourcing saves cost."], ["startup", "startap", "[B2] A tech startup."], ["adaptability", "moslashuvchanlik", "[B2] Adaptability is key."], ["cybersecurity", "kiberxavfsizlik", "[B2] Cybersecurity jobs."], ["lifelong learning", "umrbod o‘rganish", "[B2] Lifelong learning."], ["obsolescence", "eskirish", "[C1] Skill obsolescence."], ["displacement", "siqib chiqarilish", "[C1] Worker displacement."], ["paradigm shift", "tub burilish", "[C1] A paradigm shift."], ["human capital", "inson kapitali", "[C1] Invest in human capital."], ["reskilling", "qayta o‘qitish", "[C1] Reskilling programmes."], ["labour market", "mehnat bozori", "[C1] A tight labour market."], ["precarious", "beqaror", "[C1] Precarious work."], ["telecommute", "masofadan ishlamoq", "[C1] Telecommute daily."], ["algorithmic management", "algoritmik boshqaruv", "[C1] Algorithmic management."], ["knowledge economy", "bilimga asoslangan iqtisod", "[C1] A knowledge economy."]], "r": {"t": "A. A Changing World of Work\nWork has changed more in the last thirty years than in the previous three hundred. Factories once employed thousands of people on one site, whereas today many jobs are performed on laptops from any location. New professions such as data analyst and app developer did not exist a generation ago. Nobody can say with certainty which jobs will exist in thirty years.\n\nB. Automation and Jobs\nRobots already assemble cars, sort parcels and pack goods in warehouses. Studies estimate that a large share of tasks in many jobs could be automated, though few jobs will disappear completely. History offers comfort: earlier machines destroyed some occupations but created many new ones. The transition, however, can be painful for those who lose their income.\n\nC. Artificial Intelligence at Work\nArtificial intelligence can now write simple reports, answer customer questions and analyse medical images. Supporters say it frees people from boring tasks and increases productivity. Critics fear that it may reduce the value of skills that took years to learn. Many companies therefore ask employees to work alongside the technology rather than compete with it.\n\nD. Remote and Hybrid Work\nSince the pandemic, many offices have introduced hybrid schedules, with some days at home and some on site. Employees save commuting time and report greater freedom. Employers worry about teamwork and the training of young staff. Cities with large office districts have seen fewer customers in restaurants and shops.\n\nE. Skills for the Future\nEmployers value adaptability, communication and the ability to learn quickly more than a single technical skill. Short online courses allow workers to upgrade their knowledge without leaving their jobs. Many experts speak of lifelong learning, because a degree earned at twenty-two cannot last forty years. Creativity and empathy are difficult for machines to copy.\n\nF. Inequality and Security\nNot everyone benefits equally from change. Highly skilled workers often earn more, while routine jobs are replaced or paid less. Gig workers enjoy flexibility but usually lack paid holiday and a pension. Some economists propose a universal basic income, a regular payment to every citizen, although the idea remains controversial.\n\nG. Preparing for Tomorrow\nGovernments can invest in education, retraining and fair labour laws. Companies can offer training and clear career paths. Individuals can build a wide network and keep learning new skills. The future of work will be decided less by machines than by the choices that societies make.", "q": [{"q": "Work has changed more in the last thirty years than in the previous three hundred.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Earlier machines created new occupations as well as destroying some.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Artificial intelligence will replace all teachers within ten years.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Hybrid work has increased the number of customers in office districts.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "A university degree is more valuable than work experience.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Gig workers usually receive pensions.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Creativity and empathy are difficult for machines to copy.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Robots already assemble cars, sort parcels and pack goods in ______.", "a": "warehouses"}, {"q": "Many companies ask employees to work ______ the technology rather than compete with it.", "a": "alongside"}, {"q": "Employers worry about teamwork and the training of young ______.", "a": "staff"}, {"q": "Short online courses allow workers to ______ their knowledge without leaving their jobs.", "a": "upgrade"}, {"q": "Gig workers usually lack paid holiday and a ______.", "a": "pension"}, {"q": "The future of work will be decided less by machines than by the ______ that societies make.", "a": "choices"}]}, "l": {"s": ["A: Welcome to the Harbour Work Hub. I’m Elena, the community manager.", "B: Thanks. I’m a freelance designer and I work from home at the moment.", "A: What made you think of a shared space?", "B: I miss talking to people, and my flat is too noisy.", "A: We have three options: a hot desk, a fixed desk and a private office.", "B: What is a hot desk?", "A: You can sit anywhere you like. It costs one hundred and twenty pounds a month.", "B: And the fixed desk?", "A: Your own desk and a locker for two hundred and ten pounds.", "B: What about the private office?", "A: It fits four people and costs nine hundred pounds a month.", "B: What facilities do you offer?", "A: Fast internet, a printer, two meeting rooms and unlimited coffee.", "B: Are there any events?", "A: Every Thursday at five we have a networking evening, and sometimes a workshop on marketing.", "B: When is the Hub open?", "A: Members have access from seven in the morning until ten at night, every day.", "B: Is there a contract?", "A: Monthly, and you only need to give two weeks’ notice.", "B: Could I try it for a day?"], "q": [{"q": "The centre is called the Harbour Work ______.", "a": "Hub"}, {"q": "The caller is a freelance ______.", "a": "designer"}, {"q": "The caller’s flat is too ______.", "a": "noisy"}, {"q": "With a hot desk you can sit ______.", "a": "anywhere"}, {"q": "A fixed desk comes with a ______.", "a": "locker"}, {"q": "A private office fits four ______.", "a": "people"}, {"q": "The Hub offers fast internet, a printer and two meeting ______.", "a": "rooms"}, {"q": "The networking evening is every ______.", "a": "Thursday"}, {"q": "Members have access until ten at ______.", "a": "night"}, {"q": "Members must give two weeks’ ______.", "a": "notice"}, {"q": "How much is a hot desk per month?", "o": ["One hundred and twenty pounds", "Two hundred and ten pounds", "Nine hundred pounds"], "a": "One hundred and twenty pounds"}, {"q": "How much is a fixed desk per month?", "o": ["Two hundred and ten pounds", "One hundred and twenty pounds", "Three hundred pounds"], "a": "Two hundred and ten pounds"}, {"q": "How much is a private office per month?", "o": ["Nine hundred pounds", "Four hundred pounds", "One thousand two hundred pounds"], "a": "Nine hundred pounds"}, {"q": "At what time is the networking evening?", "o": ["Five", "Six", "Seven"], "a": "Five"}, {"q": "When can members use the Hub?", "o": ["Seven in the morning until ten at night", "Nine to five", "Twenty-four hours"], "a": "Seven in the morning until ten at night"}, {"q": "What kind of contract is there?", "o": ["Monthly", "Yearly", "There is none"], "a": "Monthly"}, {"q": "Why does the caller want a shared space?", "o": ["He or she misses people and the flat is noisy", "It is cheaper", "He or she needs a printer"], "a": "He or she misses people and the flat is noisy"}, {"q": "How many meeting rooms are there?", "o": ["Two", "One", "Four"], "a": "Two"}, {"q": "What is available without limit?", "o": ["Coffee", "Printing", "Meeting rooms"], "a": "Coffee"}, {"q": "What does the caller ask at the end?", "o": ["To try it for a day", "To book an office", "To cancel"], "a": "To try it for a day"}]}, "s1": ["What job would you like to have in the future?", "Do you think robots will take many jobs?", "Would you like to work from home?", "What skills are important for the future?", "Do you prefer working in a team or alone?", "How do you think work will change?"], "s2": ["Describe a job you would like to have in the future. Say what it is, what skills it needs, and why you want it.", "Describe how technology has changed a job you know about. Say what the job is, what has changed, and how people feel about it."]}};for(const k in N)DATA[k]=N[k]}
{const N={"21": {"v": [["fashion", "moda", "[B1] Follow fashion."], ["clothes", "kiyim", "[B1] New clothes."], ["shirt", "ko‘ylak", "[B1] A white shirt."], ["dress", "ko‘ylak (ayollar)", "[B1] A long dress."], ["jacket", "kurtka", "[B1] A warm jacket."], ["trousers", "shim", "[B1] Black trousers."], ["shoes", "poyabzal", "[B1] Comfortable shoes."], ["trainers", "krossovka", "[B1] White trainers."], ["hat", "shlyapa", "[B1] A straw hat."], ["scarf", "sharf", "[B1] A silk scarf."], ["fabric", "mato", "[B1] Soft fabric."], ["cotton", "paxta", "[B1] Pure cotton."], ["wool", "jun", "[B1] A wool coat."], ["silk", "ipak", "[B1] Natural silk."], ["size", "o‘lcham", "[B1] My size."], ["fit", "mos kelmoq", "[B1] It fits well."], ["style", "uslub", "[B1] A modern style."], ["trend", "trend", "[B1] A summer trend."], ["brand", "brend", "[B1] A famous brand."], ["label", "yorliq", "[B1] Read the label."], ["designer", "dizayner", "[B1] A fashion designer."], ["shop", "do‘kon", "[B1] A clothes shop."], ["mall", "savdo markazi", "[B1] A big mall."], ["sale", "chegirma", "[B1] A summer sale."], ["discount", "chegirma", "[B1] A ten percent discount."], ["price", "narx", "[B1] A fair price."], ["cheap", "arzon", "[B1] A cheap shirt."], ["expensive", "qimmat", "[B1] An expensive coat."], ["bargain", "arzon xarid", "[B1] A real bargain."], ["receipt", "chek", "[B1] Keep the receipt."], ["consumerism", "iste’molchilik", "[B2] Consumerism is growing."], ["fast fashion", "tez moda", "[B2] Fast fashion harms nature."], ["second-hand", "ishlatilgan", "[B2] Second-hand clothes."], ["sweatshop", "ayovsiz mehnat korxonasi", "[B2] A sweatshop factory."], ["sustainable fashion", "barqaror moda", "[B2] Sustainable fashion grows."], ["wardrobe", "kiyim to‘plami; shkaf", "[B2] A full wardrobe."], ["impulse buying", "o‘ylamay xarid", "[B2] Impulse buying is common."], ["window shopping", "vitrinalarni tomosha", "[B2] Enjoy window shopping."], ["loyalty card", "doimiy mijoz kartasi", "[B2] Show your loyalty card."], ["refund", "pulni qaytarish", "[B2] Ask for a refund."], ["brand loyalty", "brendga sodiqlik", "[B2] Brand loyalty pays."], ["counterfeit", "qalbaki", "[B2] Counterfeit bags."], ["textile waste", "to‘qimachilik chiqindisi", "[B2] Textile waste piles up."], ["ethical", "axloqiy", "[B2] Ethical brands."], ["vintage", "vintaj", "[B2] A vintage dress."], ["catwalk", "moda namoyishi sahnasi", "[B2] Walk the catwalk."], ["tailor-made", "buyurtma bilan tikilgan", "[B2] A tailor-made suit."], ["off-the-peg", "tayyor kiyim", "[B2] Off-the-peg clothes."], ["online retailer", "onlayn sotuvchi", "[B2] A large online retailer."], ["return policy", "qaytarish qoidasi", "[B2] Check the return policy."], ["sartorial", "kiyinishga oid", "[C1] Sartorial elegance."], ["haute couture", "yuqori moda", "[C1] Haute couture shows."], ["ephemeral", "o‘tkinchi", "[C1] Ephemeral trends."], ["conspicuous consumption", "ko‘z-ko‘z qilib sarflash", "[C1] Conspicuous consumption."], ["commodity", "tovar", "[C1] Fashion is a commodity."], ["frugality", "tejamkorlik", "[C1] Frugality is a virtue."], ["obsolescence", "eskirish", "[C1] Planned obsolescence."], ["cult following", "sadoqatli muxlislar", "[C1] A cult following."], ["status symbol", "maqom ramzi", "[C1] A status symbol."], ["materialism", "moddiyatparastlik", "[C1] Materialism spreads."]], "r": {"t": "A. Why We Dress\nPeople first wore clothes to keep warm and protect their bodies. Over time, clothing also became a way to show identity, status and belonging. A uniform tells us someone’s job, while a traditional costume tells us their culture. Fashion, in other words, is a language without words.\n\nB. The Rise of Fast Fashion\nIn the past, shops offered two main collections a year, for summer and winter. Today some brands put new styles on sale every few weeks at very low prices. Customers buy more items, but wear each of them only a few times. Critics say that clothes have become almost disposable.\n\nC. The Environmental Cost\nGrowing cotton needs enormous amounts of water, and producing one T-shirt can require thousands of litres. Dyeing and washing textiles pollutes rivers in several producing countries. Synthetic fabrics release tiny plastic fibres when they are washed. Millions of tonnes of unsold or discarded clothing end up in landfills every year.\n\nD. Working Conditions\nMost clothes are made in factories in countries where labour is cheap. Many workers put in long hours for low wages, sometimes in unsafe buildings. Several tragic accidents have forced international brands to promise improvements. Campaigners still argue that many promises have not been fully kept.\n\nE. Shopping Online\nInternet shops allow customers to compare prices and browse at any hour. Free delivery and easy returns make buying simple, perhaps too simple. Psychologists note that people often buy on impulse when they see a limited-time offer. Advertisements on social media make the temptation even stronger.\n\nF. Second-hand and Repair\nBuying second-hand clothes extends their life and keeps them out of landfills. Charity shops, vintage markets and online platforms have made this option fashionable. Learning to repair a zip or sew on a button saves money and reduces waste. In some cities, shops now offer free repair workshops.\n\nG. Smarter Choices\nExperts suggest buying fewer, better-quality items and choosing materials that last. Checking the label for fabric and country of origin gives useful information. Before purchasing anything, shoppers can ask whether they will wear it at least thirty times. Fashion will always change, but responsibility can become part of the style.", "q": [{"q": "Clothes protect the body and also communicate identity.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Fast fashion brands release new collections only twice a year.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Producing one T-shirt can require thousands of litres of water.", "o": [" ] The family matriarch."], ["cohabitation", "nikohsiz birga yashash", "[C1] Cohabitation is rising."], ["familial", "oilaviy", "[C1] Familial duties."], ["socialisation", "ijtimoiylashuv", "[C1] Early socialisation."]], "r": {"t": "A. What Is a Family?\nA family is a group of people connected by blood, marriage or commitment. It is the first place where children learn language, values and how to behave with others. Definitions differ widely between cultures. Yet almost every society regards the family as a basic unit.\n\nB. Changing Structures\nIn many countries the traditional picture of two parents and their children is only one of several family types. Divorce, migration and later marriage have changed household structures. Some families have a single parent, while others include step-parents or grandparents. In some cultures several generations still live in one house.\n\nC. Parenting\nPsychologists describe different parenting styles. Parents who set clear rules and show warmth are often called authoritative, and their children tend to be confident. Very strict parents may produce obedient but anxious children, while very permissive ones may raise children who struggle with limits. Whatever the style, children need to feel loved and respected.\n\nD. The Role of Grandparents\nGrandparents often provide childcare, which allows both parents to work. They also pass on traditions, stories and recipes. Children who spend time with older relatives usually develop more respect for age and history. The relationship is rewarding for the elderly too, because it gives them a sense of purpose.\n\nE. Work and Family\nLong hours and long commutes leave many parents with little time at home. Working parents often feel guilty, whichever choice they make. Flexible hours, remote work and shared parental leave can help to balance work and family. Companies that offer such support usually keep their staff longer.\n\nF. Caring for the Elderly\nIn many countries the ageing population creates new challenges. Some families care for older relatives at home, while others choose nursing homes. Caring can be rewarding but also exhausting, especially for those who also look after children. Governments are debating how to share the cost fairly.\n\nG. Strong Families\nResearch suggests that regular shared meals, honest conversation and clear expectations strengthen family bonds. Money matters less than time and attention. Disagreements are normal and even useful when they are handled with respect. Whatever its shape, a strong family offers security and a place to belong.", "q": [{"q": "Family structures differ from one country to another.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Nuclear families are the only type found in modern societies.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Boys are more affected by family conflict than girls.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Grandparents often provide childcare.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Working parents never feel guilty.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "In some cultures several generations live in one house.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The number of single-parent families is falling in every country.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "The family is the first place where children learn language and ______.", "a": "values"}, {"q": "Divorce and migration have changed household ______.", "a": "structures"}, {"q": "Parents who set clear rules and show warmth are often called ______.", "a": "authoritative"}, {"q": "Grandparents pass on traditions, stories and ______.", "a": "recipes"}, {"q": "Flexible hours can help parents balance ______ and family.", "a": "work"}, {"q": "In many countries the ______ population creates new challenges.", "a": "ageing"}]}, "l": {"s": ["A: Welcome to Family Matters. Today our guest is parenting [B2] Respect copyright."], ["patron", "homiy", "[B2] A wealthy patron."], ["commission", "buyurtma", "[B2] A commission for a mural."], ["forgery", "qalbakilashtirish", "[B2] An art forgery."], ["street art", "ko‘cha san’ati", "[B2] Colourful street art."], ["performance art", "performans san’ati", "[B2] Performance art."], ["self-expression", "o‘zini ifoda etish", "[B2] Art is self-expression."], ["aesthetic", "estetik", "[B2] An aesthetic sense."], ["inspiration", "ilhom", "[B2] A source of inspiration."], ["avant-garde", "avangard", "[C1] An avant-garde film."], ["oeuvre", "ijodiy meros", "[C1] The artist’s oeuvre."], ["iconography", "ikonografiya", "[C1] Religious iconography."], ["patronage", "homiylik", "[C1] Royal patronage."], ["mimesis", "taqlid", "[C1] Art as mimesis."], ["connoisseur", "bilimdon", "[C1] An art connoisseur."], ["ephemeral", "o‘tkinchi", "[C1] Ephemeral street art."], ["subversive", "an’anani buzuvchi", "[C1] A subversive poster."], ["cacophony", "bema’ni shovqin", "[C1] A cacophony of sounds."], ["kitsch", "didsiz bezak", "[C1] Cheap kitsch."]], "r": {"t": "A. Why Art Matters\nHumans were making art tens of thousands of years ago, when early people painted animals on cave walls. Art does not help us to grow food or build houses, yet every culture has produced it. It allows us to express feelings that are difficult to put into words. Many people say that art makes life richer and more meaningful.\n\nB. Art and Society\nArt often reflects the values and fears of the age in which it was made. Religious paintings once taught stories to people who could not read, while modern posters can carry political messages. Rulers and wealthy families have supported artists for centuries, in exchange for portraits and monuments. Today governments, companies and ordinary visitors support art through taxes, sponsorship and tickets.\n\nC. Great Movements\nDuring the Renaissance, artists studied anatomy and perspective to paint figures that looked alive. In the nineteenth century, the Impressionists left their studios to paint outdoors and capture changing light. Twentieth-century painters moved towards abstract forms and bold colour. Each movement began as a challenge to what came before.\n\nD. Creativity in Education\nCreative subjects teach children to experiment, make mistakes and try again. Schools that encourage creativity help students to solve problems in new ways. Yet in many countries art and music receive fewer lessons than science and mathematics. Employers increasingly say that imagination is a valuable skill.\n\nE. Digital Art\nDigital tools allow anyone to create images, music or films with a phone. Artists use software to paint, animate and design three-dimensional worlds. New programs can even produce pictures from short written instructions, which raises questions about authorship and copyright. Some artists welcome the technology, while others fear that it may reduce the value of human skill.\n\nF. Art and Money\nA few paintings sell for hundreds of millions of pounds, but most artists earn very little. Collectors may buy works as an investment, which sometimes makes prices rise beyond reason. Forgeries are a serious problem, and experts use chemical tests to identify them. Public galleries make art available to those who could never afford to own it.\n\nG. Everyone Can Create\nYou do not have to be a professional to benefit from creative activity. Studies link drawing, singing and writing with lower stress and better mood. Community choirs, craft clubs and amateur theatres bring neighbours together. The greatest value of art may be the simple pleasure of making something.", "q": [{"q": "Humans were making art tens of thousands of years ago.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Impressionist painters preferred to work only indoors.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Creativity is a talent that cannot be developed.", "o": ["True", "False", "Not given"], vakuatsiya", "[B2] A quick evacuation."], ["early warning system", "erta ogohlantirish tizimi", "[B2] An early warning system."], ["seismic", "seysmik", "[B2] Seismic activity."], ["epicentre", "epitsentr", "[B2] Near the epicentre."], ["magnitude", "kuch (balli)", "[B2] A magnitude seven quake."], ["climate change", "iqlim o‘zgarishi", "[B2] Climate change worsens storms."], ["sea level", "dengiz sathi", "[B2] Rising sea level."], ["flood defences", "toshqindan himoya", "[B2] Build flood defences."], ["reservoir", "suv ombori", "[B2] A large reservoir."], ["irrigation", "sug‘orish", "[B2] Modern irrigation."], ["water scarcity", "suv tanqisligi", "[B2] Water scarcity worries."], ["desalination", "chuchuklashtirish", "[B2] A desalination plant."], ["relief effort", "yordam ishlari", "[B2] A relief effort."], ["resilience", "chidamlilik", "[B2] Community resilience."], ["displaced", "ko‘chirilgan", "[B2] Displaced families."], ["infrastructure", "infratuzilma", "[B2] Damaged infrastructure."], ["aftershock", "keyingi silkinish", "[B2] An aftershock hit."], ["flash flood", "to‘satdan toshqin", "[B2] A flash flood."], ["wildfire", "o‘rmon yong‘ini", "[B2] A wildfire spread."], ["catastrophic", "halokatli", "[C1] A catastrophic flood."], ["vulnerability", "zaiflik", "[C1] Social vulnerability."], ["mitigation", "yumshatish", "[C1] Disaster mitigation."], ["humanitarian", "insonparvarlik", "[C1] Humanitarian aid."], ["tectonic", "tektonik", "[C1] Tectonic plates."], ["cataclysm", "ofat", "[C1] A cataclysm struck."], ["precipitation", "yog‘ingarchilik", "[C1] Heavy precipitation."], ["inundation", "suv bosishi", "[C1] Coastal inundation."], ["contingency", "favqulodda reja", "[C1] A contingency plan."], ["rehabilitation", "tiklash", "[C1] Post-flood rehabilitation."]], "r": {"t": "A. Water: Essential and Unequal\nWater covers most of our planet, but only a small share of it is fresh and easily available. More than two billion people still lack safely managed drinking water at home. Rivers, lakes and rain give life to farms and cities, yet the same water can destroy them. Understanding both sides is essential for survival in a changing climate.\n\nB. Floods\nFloods are among the most common natural disasters. They happen when heavy rain, melting snow or storm waves overwhelm rivers and coasts. Floodwater destroys homes, crops and roads, and it can contaminate drinking water with sewage. Cities with many hard surfaces suffer especially because rain cannot soak into the ground.\n\nC. Droughts\nA drought is a long period of unusually low rainfall. Rivers shrink, crops fail and animals die, so farmers may lose their entire income. Drought can also lead to wildfires and conflicts over water. Better irrigation, water storage and drought-resistant crops can reduce the damage.\n\nD. Earthquakes and Volcanoes\nEarthquakes occur where tectonic plates move against each other, and volcanoes often form along the same boundaries. Scientists can map risky regions, but they cannot predict the exact day of an earthquake. Most deaths are caused by collapsing buildings, not by the shaking itself. Strict building rules can make homes far more resistant.\n\nE. Storms\nHurricanes form over warm ocean water, which gives them their energy. They bring strong wind, heavy rain and high waves that flood coastal areas. Satellites now allow forecasters to follow a storm for days, giving people time to leave. Even so, the damage to property can be enormous.\n\nF. Preparing and Responding\nEarly warning systems, evacuation plans and community training save lives. Households are advised to keep a small bag with water, food, a torch and copies of important documents. After a disaster, rescue teams, medical help and temporary shelter are the first priorities. Long-term recovery may take years and depends on international support.\n\nG. Climate Change\nA warmer climate may make some disasters more frequent or more intense. Rising sea levels threaten low-lying coastal cities, while heavier rainfall increases the risk of floods in other regions. Poorer countries often suffer most because they have fewer resources to prepare. Cutting emissions and building resilient communities are therefore both necessary.", "q": [{"q": "More than two billion people lack safely managed drinking water at home.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Floods are among the least common natural disasters.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Scientists can predict the exact day of an earthquake.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Volcanic eruptions kill more people than floods.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Hurricanes form over warm ocean water.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Early warning systems, evacuation plans and training save lives.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Every country keeps an emergency fund for disasters.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Floodwater destroys homes, crops and ______.", "a": "roads"}, {"q": "During a ______, rivers shrink and crops fail.", "a": "drought"}, {"q": "Earthquakes occur where tectonic ______ move against each other.", "a": "plates"}, {"q": "Warm ocean water gives hurricanes their ______.", "a": "energy"}, {"q": "Strict building rules can make homes more resistant to ______.", "a": "earthquakes"}, {"q": "Rising sea levels threaten low-lying coastal ______.", "a": "cities"}]}, "l": {"s": ["A: Good evening, everyone. I’m Officer Khan from the Emergency Service.", "B: What are we talking about tonight?", "A: How to prepare for floods, since our town is close to the river.", "B: How often do floods happen?", "A: Seriously about once every ten years, the last time in March two years ago.", "B: What should we have at home?", "A: A grab bag with water, food for three days, a torch, a radio and a first aid kit.", "B: How much water per person?", "A: At least three litres a day.", "B: What about documents?", "A: Keep copies of passports and insurance papers in a waterproof folder.", "B: How will we know if a flood is coming?", "A: By text message from the town council and a siren on the church tower.", "B: Where should we go?", "A: To the sports hall on Hill Street, which can shelter four hundred people.", "B: Can we take pets?", "A: Yes, there is a separate room for them.", "B: What should we never do?", "A: Never walk or drive through floodwater; thirty centimetres of moving water can move a car.", "B: Thank you. I’ll tell my neighbours."], "q": [{"q": "The speaker is Officer ______.", "a": "Khan"}, {"q": "The town is close to the ______.", "a": "river"}, {"q": "The last flood was in ______ two years ago.", "a": "March"}, {"q": "The grab bag should include a first ______ kit.", "a": "aid"}, {"q": "Each person needs at least three ______ of water a day.", "a": "litres"}, {"q": "Documents should be kept in a ______ folder.", "a": "waterproof"}, {"q": "Residents will get a text message from the town ______.", "a": "council"}, {"q": "There is a siren on the church ______.", "a": "tower"}, {"q": "The shelter is the sports ______ on Hill Street.", "a": "hall"}, {"q": "People must never walk or drive through ______.", "a": "floodwater"}, {"q": "How often do serious floods happen?", "o": ["About once every ten years", "Every year", "Every century"], "a": "About once every ten years"}, {"q": "For how many days should the grab bag contain food?", "o": ["Three", "One", "Fourteen"], "a": "Three"}, {"q": "How much water does each person need per day?", "o": ["At least three litres", "One litre", "Ten litres"], "a": "At least three litres"}, {"q": "How many people can the sports hall shelter?", "o": ["Four hundred", "Forty", "Four thousand"], "a": "Four hundred"}, {"q": "Where can pets stay?", "o": ["In a separate room", "They are not allowed", "Outside"], "a": "In a separate room"}, {"q": "How deep can y mayor."], ["council", "kengash", "[B1] The local council."], ["court", "sud", "[B1] A supreme court."], ["police", "politsiya", "[B1] Local police."], ["army", "armiya", "[B1] A national army."], ["constitution", "konstitutsiya", "[B1] The constitution."], ["democracy", "demokratiya", "[B1] A stable democracy."], ["freedom", "erkinlik", "[B1] Freedom of speech."], ["equality", "tenglik", "[B1] Equality before the law."], ["protest", "norozilik", "[B1] A peaceful protest."], ["campaign", "kampaniya", "[B1] An election campaign."], ["debate", "munozara", "[B1] A public debate."], ["leader", "rahbar", "[B1] A national leader."], ["legislation", "qonunchilik", "[B2] New legislation."], ["opposition", "muxolifat", "[B2] The opposition party."], ["coalition", "koalitsiya", "[B2] A coalition government."], ["manifesto", "saylov dasturi", "[B2] A party manifesto."], ["referendum", "referendum", "[B2] A national referendum."], ["turnout", "saylovda ishtirok", "[B2] High turnout."], ["compulsory voting", "majburiy ovoz berish", "[B2] Compulsory voting is debated."], ["bureaucracy", "byurokratiya", "[B2] Slow bureaucracy."], ["corruption", "korrupsiya", "[B2] Fight corruption."], ["transparency", "shaffoflik", "[B2] Government transparency."], ["accountability", "hisobdorlik", "[B2] Political accountability."], ["local authority", "mahalliy hokimiyat", "[B2] The local authority."], ["majority", "ko‘pchilik", "[B2] A clear majority."], ["constituency", "saylov okrugi", "[B2] A rural constituency."], ["lobbying", "lobbi qilish", "[B2] Corporate lobbying."], ["political party", "siyosiy partiya", "[B2] A new political party."], ["civil rights", "fuqarolik huquqlari", "[B2] Civil rights movements."], ["human rights", "inson huquqlari", "[B2] Protect human rights."], ["public opinion", "jamoatchilik fikri", "[B2] Public opinion shifted."], ["ballot", "ovoz berish byulleteni", "[B2] A secret ballot."], ["sovereignty", "suverenitet", "[C1] National sovereignty."], ["electorate", "saylovchilar", "[C1] The electorate decided."], ["bipartisan", "ikki partiyaviy", "[C1] A bipartisan plan."], ["populism", "populizm", "[C1] Populism grows."], ["incumbent", "amaldagi lavozimdagi", "[C1] The incumbent mayor."], ["authoritarian", "avtoritar", "[C1] An authoritarian regime."], ["pluralism", "plyuralizm", "[C1] Political pluralism."], ["mandate", "vakolat", "[C1] A clear mandate."], ["political apathy", "siyosiy loqaydlik", "[C1] Political apathy rises."], ["checks and balances", "tiyib turish tizimi", "[C1] Checks and balances."]], "r": {"t": "A. Why Governments Exist\nMost people accept that a society needs rules and shared services. Governments make laws, collect taxes and provide roads, schools, hospitals and security. How much a government should do is one of the oldest political questions. People hold different opinions, and political debate is how a society chooses between them.\n\nB. Forms of Government\nIn a democracy citizens choose their leaders through elections. Some countries have a president who is both head of state and head of government, while in others a prime minister leads the government and a monarch or president has a mostly ceremonial role. There are also systems in which power is held by a small group or a single ruler. Each system has its own rules about who may take decisions.\n\nC. Elections\nElectoral systems differ greatly. In some, the candidate with most votes in a district wins; in others, seats are shared according to the percentage each party receives. Voters may choose between candidates or parties, each presenting a manifesto of promises. A referendum, by contrast, asks the whole electorate one question. Free and fair elections require secret ballots and honest counting.\n\nD. Turnout and Compulsory Voting\nIn many countries a significant share of citizens do not vote, and younger people vote less often than older ones. Some countries have made voting compulsory, with a small fine for those who do not take part. Supporters say this increases turnout and makes results more representative. Opponents say that people should be free to choose not to vote and that forced participation may not create real interest.\n\nE. Local and National Government\nNational governments deal with defence, foreign policy and the economy. Local councils decide about parks, libraries, public transport and rubbish collection. Many people feel closer to local decisions because they see their effects directly. Cooperation between the two levels is essential.\n\nF. The Role of Citizens\nCitizens can take part by voting, joining parties, attending meetings, signing petitions or protesting peacefully. A free press and independent courts help to hold politicians accountable. Volunteering and community groups also strengthen public life. Democracy works best when people stay informed and engaged.\n\nG. Challenges\nIn many countries trust in politicians has fallen, and corruption remains a serious problem. Misleading information on social media makes sensible debate harder. Some experts propose civic education in schools and greater transparency in government spending. Whatever the reforms, a political system is only as strong as the participation of its citizens.", "q": [{"q": "Governments provide services such as roads, schools and security.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "All countries use the same electoral system.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "In some countries voting is compulsory.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Compulsory voting is used in more than fifty countries.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Local councils are responsible for national defence.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Younger people vote less often than older people in many countries.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Most citizens fully trust their politicians.", "o": tive breeding", "asirlikda ko‘paytirish", "[B2] Captive breeding saved it."], ["migration", "migratsiya", "[B2] Bird migration."], ["predator", "yirtqich", "[B2] A top predator."], ["prey", "o‘lja", "[B2] The predator hunts prey."], ["food chain", "oziq zanjiri", "[B2] A long food chain."], ["wildlife reserve", "yovvoyi tabiat qo‘riqxonasi", "[B2] A wildlife reserve."], ["ecotourism", "ekoturizm", "[B2] Ecotourism helps locals."], ["invasive species", "bosqinchi tur", "[B2] An invasive species."], ["population decline", "aholi soni kamayishi", "[B2] A sharp population decline."], ["pollination", "changlanish", "[B2] Bees help pollination."], ["overfishing", "haddan tashqari baliq ovlash", "[B2] Overfishing is dangerous."], ["rewilding", "tabiatni tiklash", "[B2] A rewilding project."], ["apex predator", "cho‘qqi yirtqich", "[C1] Wolves are apex predators."], ["anthropogenic", "inson faoliyatidan kelib chiqqan", "[C1] Anthropogenic pressure."], ["keystone species", "tayanch tur", "[C1] Bees are a keystone species."], ["fragmentation", "bo‘linib ketish", "[C1] Habitat fragmentation."], ["endemic", "faqat shu joyga xos", "[C1] An endemic plant."], ["sanctuary", "boshpana qo‘riqxona", "[C1] A bird sanctuary."], ["carrying capacity", "ko‘tarish qobiliyati", "[C1] The carrying capacity."], ["wildlife corridor", "hayvonlar yo‘lagi", "[C1] A wildlife corridor."], ["trophic", "oziqlanishga oid", "[C1] Trophic levels."], ["ecological", "ekologik", "[C1] Ecological balance."]], "r": {"t": "A. A Planet Full of Life\nScientists have described about two million species of animals, plants and fungi, and many more are still unknown. Every one of them lives in a particular habitat that provides food, water and shelter. Together they form complex ecosystems in which each species depends on others. When one disappears, the effects can spread in surprising ways.\n\nB. Why Biodiversity Matters\nPlants depend on bees and other insects for pollination, and many of our crops would fail without them. Forests and wetlands clean air and water and reduce the risk of floods. Many modern medicines were first discovered in wild plants. Beyond practical benefits, many people believe that every species has a right to exist.\n\nC. The Main Threats\nThe biggest threat to wildlife is the loss of habitat, because forests are cut down for farms, roads and towns. Illegal hunting, known as poaching, endangers elephants, rhinos and tigers. Pollution poisons rivers and seas, and plastic harms birds and fish. Climate change adds a new pressure, since many animals cannot move quickly enough to cooler places.\n\nD. Success Stories\nConservation can work. Some populations of humpback whales have recovered after hunting was banned. Wolves have returned to parts of Europe where they had disappeared for a century. In several countries, the number of wild tigers has begun to rise. These examples show that recovery is possible when laws, science and local support work together.\n\nE. Protected Areas\nNational parks and nature reserves protect large areas from farming and building. They need guards, funding and clear rules, otherwise they exist only on paper. Wildlife corridors connect separate protected areas so that animals can migrate and find mates. Ecotourism can provide income for local people, who then have a reason to protect the animals.\n\nF. Zoos and Captive Breeding\nModern zoos claim to have a role in education and species protection. Some rare animals have been bred in captivity and then returned to the wild. Critics argue that large animals suffer in small enclosures and that money would be better spent protecting natural habitats. The debate continues, and the best zoos try to answer both concerns.\n\nG. What Individuals Can Do\nPeople can reduce their impact by buying sustainable fish and wood, using less plastic and avoiding products made from endangered animals. Planting native flowers helps local insects and birds. Citizens can also support organisations that protect habitats and report illegal hunting. Small actions, repeated by millions of people, can protect the living world.", "q": [{"q": "Insects help plants by carrying pollen from flower to flower.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Habitat loss is a minor threat to wildlife.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Some humpback whale populations have recovered after hunting was banned.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Zoos have saved every species that they have bred.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "National parks are more effective than private reserves.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Ecotourism can provide income for local people.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Most people support banning all zoos.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Plants depend on bees and other insects for ______.", "a": "pollination"}, {"q": "Many modern medicines were first discovered in wild ______.", "a": "plants"}, {"q": "Cutting forests for farms, roads and towns destroys the ______ of animals.", "a": "habitat"}, {"q": "Illegal hunting is known as ______.", "a": "poaching"}, {"q": "Wildlife corridors connect separate protected ______.", "a": "areas"}, {"q": "Ecotourism can provide income for local ______.", "a": "people"}]}, "l": {"s": ["A: Good morning, Greenvale Wildlife Reserve. How can I help?", "B: Hello, I’m interested in the volunteer programme.", "A: Lovely. We need helpers aged sixteen and over.", "B: What would I do?", "A: Mainly feeding the animals, cleaning enclosures and guiding visitors.", "B: Which animals do you have?", "A: Mostly rescued birds, otters and a pair of red foxes.", "B: How many days a week?", "A: A minimum of two, from nine until four.", "B: Is training provided?", "A: Yes, a two-day course in the first week, including safety and first aid.", "B: Is there an age l d."], ["city", "shahar", "[B1] An ancient city."], ["castle", "qal’a", "[B1] A stone castle."], ["temple", "ibodatxona", "[B1] A Greek temple."], ["tomb", "maqbara", "[B1] A royal tomb."], ["ruins", "xarobalar", "[B1] Ancient ruins."], ["museum", "muzey", "[B1] A history museum."], ["archaeologist", "arxeolog", "[B1] An archaeologist digs."], ["artefact", "artefakt", "[B1] A bronze artefact."], ["document", "hujjat", "[B1] An old document."], ["legend", "rivoyat", "[B1] A local legend."], ["civilisation", "sivilizatsiya", "[B2] An early civilisation."], ["dynasty", "sulola", "[B2] A ruling dynasty."], ["conquest", "bosib olish", "[B2] A military conquest."], ["colonisation", "mustamlaka qilish", "[B2] Colonisation changed regions."], ["excavation", "qazish ishlari", "[B2] An excavation site."], ["chronicle", "solnoma", "[B2] A medieval chronicle."], ["manuscript", "qo‘lyozma", "[B2] A rare manuscript."], ["nomadic", "ko‘chmanchi", "[B2] Nomadic tribes."], ["independence", "mustaqillik", "[B2] Win independence."], ["industrial revolution", "sanoat inqilobi", "[B2] The Industrial Revolution."], ["primary source", "birlamchi manba", "[B2] A primary source."], ["monument", "yodgorlik", "[B2] A national monument."], ["caravan", "karvon", "[B2] A camel caravan."], ["scholar", "olim", "[B2] A medieval scholar."], ["decline", "inqiroz", "[B2] The empire’s decline."], ["cultural exchange", "madaniy almashinuv", "[B2] Cultural exchange grew."], ["trade route", "savdo yo‘li", "[B2] An ancient trade route."], ["archive", "arxiv", "[B2] A national archive."], ["oral history", "og‘zaki tarix", "[B2] Oral history matters."], ["ruler", "hukmdor", "[B2] A powerful ruler."], ["historiography", "tarixshunoslik", "[C1] Modern historiography."], ["hegemony", "hukmronlik", "[C1] Political hegemony."], ["anachronism", "anaxronizm", "[C1] A film anachronism."], ["epoch", "davr", "[C1] A new epoch."], ["millennium", "ming yillik", "[C1] The third millennium."], ["antiquity", "qadimiy davr", "[C1] Classical antiquity."], ["chronology", "xronologiya", "[C1] A clear chronology."], ["revisionism", "qayta ko‘rib chiqish", "[C1] Historical revisionism."], ["legacy", "meros", "[C1] A lasting legacy."], ["transience", "o‘tkinchilik", "[C1] The transience of power."]], "r": {"t": "A. Why Study History?\nHistory is more than a list of dates and kings. It helps us to understand how societies, ideas and conflicts developed, and why the present looks as it does. People who know the past are less likely to be misled by simple explanations. Studying history also develops skills such as comparing evidence and building arguments.\n\nB. Early Civilisations\nThe first cities grew along great rivers such as the Tigris and Euphrates, the Nile, the Indus and the Yellow River. Farming produced a surplus of food, which allowed some people to become craftsmen, priests or officials. Writing was invented in Mesopotamia around 3000 BC, first to record trade and taxes. Rulers soon used it to make laws and to record their achievements.\n\nC. The Silk Road\nThe Silk Road was not a single road but a network of routes linking China with the Mediterranean. Merchants carried silk, spices and paper, and they also spread religions, technologies and stories. Cities such as Samarkand and Bukhara became wealthy meeting points where languages and customs mixed. Caravans needed inns, wells and protection, so trade created whole communities along the way.\n\nD. Science and Scholars\nIn the Middle Ages scholars of Central Asia and the Islamic world made major advances. Al-Khwarizmi wrote the book that gave us the word algebra, and the word algorithm comes from the Latin form of his name. Ibn Sina’s Canon of Medicine was used in Europe for centuries. In the fifteenth century Ulugh Beg built a great observatory in Samarkand and compiled an accurate star catalogue.\n\nE. Empires and Their Decline\nGreat empires grew through conquest, trade and efficient administration. Yet almost all of them eventually weakened because of weak leaders, wars and economic problems. Historians still debate which factors were most important in each case. The rise and fall of empires remind us that no power lasts for ever.\n\nF. How Historians Work\nHistorians compare documents, objects and eyewitness accounts. Primary sources, such as letters and chronicles, come from the time itself, while secondary sources are written later. Every source has limits, because its author may have been biased or poorly informed. Archaeologists add physical evidence by excavating ruins, tombs and rubbish pits.\n\nG. Lessons from the Past\nHistory rarely repeats itself exactly, but patterns do appear. Studying earlier crises can help societies to prepare for new ones. Remembering both achievements and mistakes gives a more honest picture of a nation. Above all, studying the past helps us to understand the present.", "q": [{"q": "Writing was invented in Mesopotamia around 3000 BC.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "The Silk Road was a single road.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Ulugh Beg built an observatory in Samarkand.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Al-Khwarizmi lived in the twentieth century.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Most empires lasted more than five hundred years.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Historians have to consider whether a source was biased.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Archaeologists have found the tomb of every ancient king.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "The first cities grew along great rivers such as the Tigris and ______.", "a": "Euphrates"}, {"q": "Merchants carried silk, spices and ______ along the Silk Road.", "a": "paper"}, {"q": "Ibn Sina’s Canon of Medicine was used in ______ for centuries.", "a": "Europe"}, {"q": "Historians compare documents, objects and ey al city."], ["sensor", "datchik", "[B2] A traffic sensor."], ["data", "ma’lumot", "[B2] City data."], ["autonomous vehicle", "o‘zi boshqaradigan avtomobil", "[B2] An autonomous vehicle."], ["affordable housing", "hamyonbop uy-joy", "[B2] Affordable housing."], ["resilience", "chidamlilik", "[B2] Urban resilience."], ["megacity", "megapolis", "[C1] A growing megacity."], ["conurbation", "aglomeratsiya", "[C1] A large conurbation."], ["gentrification", "yuqori qatlam tomonidan egallanish", "[C1] Gentrification raises rents."], ["densification", "zichlashtirish", "[C1] Urban densification."], ["urbanism", "urbanistika", "[C1] Modern urbanism."], ["walkability", "piyoda yurishga qulaylik", "[C1] High walkability."], ["ecocity", "ekologik shahar", "[C1] A planned ecocity."], ["biophilic", "tabiatga yaqin dizayn", "[C1] Biophilic design."], ["retrofit", "zamonaviylashtirish", "[C1] Retrofit old blocks."], ["circular economy", "aylanma iqtisodiyot", "[C1] A circular economy."]], "r": {"t": "A. More People, More Cities\nRoughly two thirds of the world’s people are expected to live in cities by the middle of this century. This growth puts pressure on housing, transport, water and energy. At the same time, cities produce most of the world’s economic output and many of its new ideas. The question is not whether cities will grow but how they will be planned.\n\nB. Smart Cities\nSensors in roads, buildings and pipes collect data about traffic, air quality and energy use. Smart traffic lights adjust to the number of vehicles, and apps tell residents when the next bus will arrive. City managers can detect leaks or faults quickly and repair them before they become serious. Critics warn that constant data collection may threaten privacy and must be controlled by clear rules.\n\nC. Green Cities\nGreen roofs and vertical gardens absorb rainwater and reduce heat in summer. Parks and trees improve air and mental health, and they give wildlife a place to live. Some new districts produce their own electricity from solar panels and recycle most of their waste. The aim of many planners is a carbon-neutral city.\n\nD. The Future of Mobility\nMany cities are reducing the space for private cars in their centres. They add cycle lanes, wider pavements and fast, frequent trams or metros. Electric buses and shared bicycles cut pollution and noise. Self-driving vehicles may eventually reduce accidents, although their role in city transport is still being tested.\n\nE. Housing for Everyone\nRising rents force many workers to live far from their jobs and spend hours commuting. Some cities require developers to include a share of affordable apartments in new projects. Mixed-use districts place homes, shops and offices close together, so that people can walk to most places. Building upwards saves land but needs good design to avoid cold, crowded blocks.\n\nF. Inequality and Inclusion\nA successful city must work for all its residents, not only for the wealthy. Parks, libraries and transport should be accessible to people with disabilities and to those with low incomes. When an area becomes fashionable, rents may rise and long-term residents may be forced to leave. Planners are therefore looking for ways to improve neighbourhoods without pushing people out.\n\nG. The Role of Citizens\nResidents can give their opinions through surveys, public meetings and mobile applications. They can report broken lamps or potholes within seconds. Projects that include the people who live there tend to be more successful and more loved. The best city of the future will be built with its citizens, not only for them.", "q": [{"q": "Roughly two thirds of the world’s people are expected to live in cities by the middle of this century.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Smart traffic lights never reduce waiting time.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Green roofs and vertical gardens reduce heat in summer.", "o": ["True", "False", "Not og‘liq", "[B1] Good health."], ["friend", "do‘st", "[B1] A close friend."], ["family", "oila", "[B1] A caring family."], ["well-being", "farovonlik", "[B2] Mental well-being."], ["resilience", "chidamlilik", "[B2] Show resilience."], ["motivation", "rag‘bat", "[B2] High motivation."], ["self-esteem", "o‘zini hurmat qilish", "[B2] Build self-esteem."], ["ambition", "intilish", "[B2] Strong ambition."], ["fulfilment", "qoniqish", "[B2] Find fulfilment."], ["work ethic", "mehnat axloqi", "[B2] A strong work ethic."], ["perseverance", "qat’iyat", "[B2] Perseverance wins."], ["mindset", "fikrlash tarzi", "[B2] A positive mindset."], ["gratitude", "minnatdorchilik", "[B2] Show gratitude."], ["optimism", "optimizm", "[B2] Optimism helps."], ["burnout", "kuyib ketish", "[B2] Avoid burnout."], ["peer pressure", "tengdoshlar bosimi", "[B2] Peer pressure."], ["setback", "muvaffaqiyatsizlik", "[B2] A temporary setback."], ["milestone", "muhim bosqich", "[B2] A career milestone."], ["self-discipline", "o‘zini boshqarish", "[B2] Self-discipline matters."], ["purpose", "maqsad (hayotiy)", "[B2] A sense of purpose."], ["balance", "muvozanat", "[B2] Find a balance."], ["mindfulness", "ongli e’tibor", "[B2] Practise mindfulness."], ["achievement", "yutuq", "[B2] A great achievement."], ["contentment", "qanoat", "[C1] A quiet contentment."], ["hedonic", "lazzatga yo‘naltirilgan", "[C1] Hedonic pleasure."], ["intrinsic", "ichki", "[C1] Intrinsic motivation."], ["extrinsic", "tashqi", "[C1] Extrinsic rewards."], ["equanimity", "xotirjamlik", "[C1] Face failure with equanimity."], ["self-actualisation", "o‘zini namoyon etish", "[C1] Self-actualisation."], ["tenacity", "qat’iyat", "[C1] Admirable tenacity."], ["complacency", "befarqlik", "[C1] Avoid complacency."], ["aspiration", "orzu-intilish", "[C1] High aspirations."], ["eudaimonia", "ma’noli baxt", "[C1] Eudaimonia means flourishing."]], "r": {"t": "A. What Is Happiness?\nHappiness means different things to different people. For some it is pleasure and comfort, for others it is a feeling that life has meaning. Psychologists often separate short moments of joy from a deeper sense of satisfaction with life as a whole. Both matter, and they do not always come together.\n\nB. Money and Happiness\nHaving enough money to meet basic needs clearly makes people happier, because it reduces worry and gives some freedom. Beyond a certain level, however, extra income brings little additional happiness. Researchers also note that people compare themselves with others, so a raise may feel small if colleagues receive more. Time and freedom often matter more than possessions.\n\nC. Relationships\nStudies that follow people for decades suggest that good relationships are among the strongest signs of a happy and healthy life. Close friendships and family bonds reduce stress and give support in difficult times. Loneliness, on the other hand, is linked with poorer health. Being kind to others tends to improve one’s own mood as well.\n\nD. Defining Success\nSuccess is often measured by wealth, position or fame, yet many people feel empty after reaching such goals. Others define it as learning, helping others or raising a family. Psychologists distinguish between extrinsic rewards, such as money and praise, and intrinsic rewards, such as interest and pride in the work. Intrinsic motivation usually lasts longer.\n\nE. Failure and Mindset\nEvery successful person has faced failure. People with a growth mindset see mistakes as chances to learn, while those with a fixed mindset believe that talent cannot change. Research suggests that praising effort rather than ability encourages children to try harder tasks. Perseverance, not natural talent alone, often decides who reaches difficult goals.\n\nF. Everyday Habits\nSimple habits can improve well-being. Writing down three good things each day builds gratitude, while regular exercise lifts mood and energy. Good sleep, time outdoors and limits on social media support mental health. None of these habits is dramatic, but together they make a noticeable difference.\n\nG. A Balanced View\nNo one can be happy all the time, and sadness has a natural place in life. Chasing happiness too hard can even make people more anxious. A more realistic aim is a life with purpose, good relationships and enough rest. Success and happiness are most likely to meet when we pursue goals that really matter to us.", "q": [{"q": "Happiness means different things to different people.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Money has no effect on happiness at all.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Strong relationships are linked with greater happiness.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "Failure is always harmful.", "o": ["True", "False", "Not given"], "a": "False"}, {"q": "Optimistic people live ten years longer than pessimistic people.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Writing down good things each day can build gratitude.", "o": ["True", "False", "Not given"], "a": "True"}, {"q": "People in colder countries are happier than people in warm countries.", "o": ["True", "False", "Not given"], "a": "Not given"}, {"q": "Some people define happiness as pleasure, others as a feeling that life has ______.", "a": "meaning"}, {"q": "Beyond a certain level, extra income brings ______ additional happiness.", "a": "little"}, {"q": "Close friendships and family bonds reduce ______.", "a": "stress"}, {"q": "People with a growth ______ see mistakes as chances to learn.", "a": "mindset"}, {"q": "Writing down three good things each day builds ______.", "a": "gratitude"}, {"q": "Good sleep, time outdoors and limits on social media support mental ______.", "a": "health"}]}, "l": {"s": ["A: Hello everyone, and welcome to the Motivation Workshop. I’m Dr Reid.", "B: How long will this session last?", "A: Ninety minutes, with a break after forty-five.", "B: What will we cover?", "A: Go
